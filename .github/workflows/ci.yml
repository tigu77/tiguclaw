name: CI

on:
  push:
    # ★`dev` 도 본다 (2026-09-01). `main` 은 이제 **릴리스·핫픽스에만** 갱신되고 평소
    #  동기화는 `dev` 로 간다. 트리거를 안 넓히면 릴리스 직전까지 CI 가 한 번도 안 돌아,
    #  리눅스·깨끗한 설치 축(로컬 mac 이 못 보는 축)을 그때서야 처음 보게 된다.
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# 같은 브랜치에 연달아 push 하면 앞 잡을 취소한다 — 종전엔 중복 잡이 러너를 물고
# 앉아 있었다(2026-08-23 4R F11).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # ★`build` 도 본다 (v0.40.0). `typecheck`·`build:prod` 는 넓은 스코프
      #  (`tsconfig.check/build.json` = src+plugins+packages)라 **`rootDir` 위반을 못 본다** —
      #  순수 `tsc`(=`tsconfig.json`, `rootDir: src`)만 TS6059 를 낸다. 실제로 v0.40.0 에서
      #  회귀 하나가 `plugins/` 를 import 해 `npm run build` 가 죽었는데, CI 가 그 명령을
      #  한 번도 안 불러서 **릴리스 게이트까지 살아남았다**. package.json 에 있는 명령은
      #  누군가 친다 — 안 도는 명령은 조용히 썩는다.
      - run: npm run build
      # 회귀 스위트 — 실제 사고에서 나온 계약만 모아 매 push 에서 다시 돌린다.
      # (종전엔 typecheck 하나뿐이라, 검증 하네스를 아무리 만들어도 재실행되지 않았다.)
      # 격리: 러너가 TIGUCLAW_HOME 을 임시 디렉터리로 잡아 실제 홈·DB 를 안 건드린다.
      # timeout: 검사들이 자체 시한을 갖지만, 러너가 매달리는 최악의 경우를 막는 바깥 그물.
      # ★바깥 그물은 **안쪽 시한의 합보다 커야** 한다 (2026-08-23 4R F5). 데몬을 띄우는
      #  검사 둘이 각각 90초 시한을 갖는데 예산이 5분이면, 둘 다 걸릴 때 스텝이 통째로
      #  잘려 **1,559건 신호가 전부 사라진다**(= 게이트 사망). 로컬 실측 59초.
      - run: npm run test:regression
        timeout-minutes: 15
      # ★배포 산출물 빌드까지 본다 (4R F11). `build:prod` 는 `copy-dist-assets.mjs` 를
      #  돌려 dist/plugins·dist/packages 를 채우는데, 그게 깨지면 built 런타임이 플러그인
      #  0개로 뜬다(2026-07-14 실사고). typecheck·build 로는 안 보인다.
      - run: npm run build:prod
