<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="820" height="460" rx="16" fill="#0e1621"/>
  <!-- header -->
  <rect width="820" height="64" rx="16" fill="#17212b"/>
  <rect y="48" width="820" height="16" fill="#17212b"/>
  <circle cx="44" cy="32" r="20" fill="#2b5278"/>
  <text x="44" y="38" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">t</text>
  <text x="78" y="28" fill="#fff" font-size="16" font-weight="600">tiguclaw</text>
  <text x="78" y="46" fill="#6a7a8c" font-size="12">always on · multi-LLM assistant</text>
