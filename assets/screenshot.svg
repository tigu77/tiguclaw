  <!-- outgoing (user, right, blue) -->
  <rect x="486" y="180" width="310" height="48" rx="14" fill="#2b5278"/>
  <text x="506" y="209" fill="#fff" font-size="14">yes, and research today's AI news</text>
  <!-- incoming (assistant, left) -->
  <rect x="24" y="248" width="470" height="92" rx="14" fill="#182533"/>
  <text x="44" y="276" fill="#e7eef6" font-size="14">On it — delegating the news scan to a local</text>
  <text x="44" y="298" fill="#e7eef6" font-size="14">model in the background. Here's your digest</text>
  <text x="44" y="320" fill="#7aa2c4" font-size="14">📄 daily-digest.md · 🔎 worker #1 running…</text>
