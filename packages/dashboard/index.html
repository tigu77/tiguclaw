        const lbl = document.createElement("span");
        lbl.className = "act-output-lbl";
        lbl.textContent = output.isError ? "출력 (에러)" : "출력";
        head.appendChild(caret); head.appendChild(lbl);
        const body = document.createElement("div");
        body.className = "act-diff-body";
        const pre = document.createElement("pre");
        pre.className = "act-output-pre";
        pre.textContent = (output.text != null ? output.text : "") + (output.truncated ? "\n… (이하 생략 — 크기 제한)" : "");
        body.appendChild(pre);
        // 토글은 스텝(부모) 단위 — 헤더는 접힘 시 요약("출력")만. (클릭 핸들러 없음.)
        wrap.appendChild(head); wrap.appendChild(body);
        return wrap;
      };

      const buildActivityLine = (p) => {
        const line = document.createElement("div");
        // 스텝 = 클릭 가능 요소(P4 사이드바 상세가 여기 붙는다). 지금은 자리 예약만(no-op).
        line.className = "act-line act-step";
        line.dataset.threadkey = p.threadKey || "?";
        if (p.seq != null) line.dataset.seq = String(p.seq);
        const icon = document.createElement("span");
        icon.className = "act-icon";
        icon.textContent = p.kind === "tool" ? "🔧" : "▶";
        const label = document.createElement("span");
        label.className = "act-label";
        label.textContent = p.label || p.kind || "activity";
        // 인라인 상세(중립 detail = path=…, cmd: … 등). 단 diff 있는 스텝(Edit/Write)은 diff
        // 헤더가 경로+N/-M 을 이미 보여주므로 verbose 한 old_string=… 은 접힘 한 줄에서 생략(간결).
        const hasDiff = p.diff && Array.isArray(p.diff.lines);
        const detail = p.detail && !hasDiff
          ? Object.assign(document.createElement("span"), {
              className: "act-detail", textContent: p.detail,
            })
          : null;
        const meta = document.createElement("span");
        meta.className = "act-meta";
        meta.textContent = (p.model ? p.model + " · " : "") + "#" + (p.seq ?? "");
        line.appendChild(icon); line.appendChild(label);
        if (detail) line.appendChild(detail);
        line.appendChild(meta);
        // 리치 diff(Edit/Write) — 있으면 스텝 줄 아래 접이식 블록(flex-wrap 로 다음 줄).
        if (hasDiff) line.appendChild(buildDiffBlock(p.diff));
        // 클릭 = 도구 스텝 펼침/접힘(리치 diff·출력 있으면). sticky(hover 무관). 리치 블록이
        // 없는 스텝은 기존대로 사이드바 상세(P4).
        line.addEventListener("click", () => {
          if (line.querySelector(":scope > .act-diff, :scope > .act-output")) {
            line.classList.toggle("expanded");
            return;
          }
          const stored = activityByStep.get(stepKey(line.dataset.threadkey, line.dataset.seq));
          openStepDetail(stored || p, line);
        });
        return line;
      };

      // 서브에이전트 threadKey = `${부모}::sub::<name>::<ts>` (agent-registry spawn_agent).
      // → 에이전트명 추출(없으면 null). 멀티에이전트 턴에서 "누가 무엇을" 구분 라벨용.
      const agentOfThread = (thread) => {
        const m = /::sub::(.+?)::/.exec(thread || "");
        return m ? m[1] : null;
      };

      // 턴 그룹 = 스텝 리스트(접이식 turn-card) + 답변 버블을 한 묶음으로 잡는 컨테이너.
      // 그룹 자체가 stream 에 삽입되고, 그 안에 스텝 카드 → (도착 시) 답변 버블 순으로 쌓인다.
      const createTurnCard = (p, ts, adapter, thread) => {
        const group = document.createElement("div");
        group.className = "turn-group";
        group.dataset.threadkey = thread;
        // 로그 패널 필터(stream 직속 자식의 dataset.type 매칭)와 일관되도록 그룹에도 타입 표기.
        group.dataset.type = "llm.activity";

        applyFilter(group);
        const el = document.createElement("div");
        el.className = "ev turn-card in-group";
        el.dataset.type = "llm.activity";
        el.dataset.threadkey = thread;
        const head = document.createElement("div");
        head.className = "turn-head";
        const caret = document.createElement("span");
        caret.className = "turn-caret"; caret.textContent = "▼";
        const badge = document.createElement("span");
        badge.className = "act-badge act-" + adapter;
        badge.textContent = p.adapter || "?";
        const th = document.createElement("span");
        th.className = "turn-thread"; th.textContent = thread;
        const tsEl = document.createElement("span");
        tsEl.className = "ts"; tsEl.textContent = ts;
        const lastEl = document.createElement("span");
        lastEl.className = "turn-last"; lastEl.textContent = "";
        const countEl = document.createElement("span");
        countEl.className = "turn-count"; countEl.textContent = "0단계";
        head.appendChild(caret); head.appendChild(badge);
        // 서브에이전트면 "🤖 <name>" 라벨 — 누가 하는 작업인지 한눈에. raw threadKey 는 숨김.
        const agentName = agentOfThread(thread);
        if (agentName) {
          const ab = document.createElement("span");
          ab.className = "agent-badge";
          ab.textContent = "🤖 " + agentName;
          head.appendChild(ab);
          th.style.display = "none";
        }
        head.appendChild(th);
        head.appendChild(tsEl); head.appendChild(lastEl); head.appendChild(countEl);
        const body = document.createElement("div");
        body.className = "turn-body";
        // 수동 접힘(.collapsed) = 두 패널 공통(헤더 클릭, 기존 로그 토글 보존).
        // 완료 자동접힘(.done-collapsed) = 채팅 패널만(로그 패널 회귀 0). 수동 클릭이 우선.
        const setOpen = (open) => {
          el.classList.toggle("collapsed", !open);
          el.classList.remove("done-collapsed"); // 수동 조작이 자동접힘을 해제.
          caret.textContent = open ? "▼" : "▶";
        };
        head.addEventListener("click", () => setOpen(
          el.classList.contains("collapsed") || el.classList.contains("done-collapsed"),
        ));
        el.appendChild(head); el.appendChild(body);
        group.appendChild(el);
        // replyBubble = 이 턴의 진행(타이핑) 답변 슬롯(P5). 첫 delta 때 생성, out 도착 시 승격.
        return {
          group, el, body, countEl, lastEl, setOpen,
          lastSeq: -1, count: 0, closed: false,
          replyBubble: null, replyMsg: null, replyRaw: "",
        };
      };

      // delta-only 턴(스텝 활동 없이 토큰만 오는 경우)용 경량 그룹 — 진행 버블만 담는다.
      // 이후 activity 가 오면 renderActivity 의 isNewTurn 판정(seq 리셋/closed)으로 자연 정리.
      const createDeltaGroup = (p, ts, adapter, thread) => {
        const group = document.createElement("div");
        group.className = "turn-group";
        group.dataset.threadkey = thread;
        group.dataset.type = "channel.message.out";
        applyFilter(group);
        return {
          group, el: null, body: null, countEl: null, lastEl: null,
          setOpen: () => {}, lastSeq: -1, count: 0, closed: false,
          replyBubble: null, replyMsg: null, replyRaw: "",
        };
      };

      // 진행(타이핑) 버블을 그 턴 그룹 안(스텝 카드 아래)에 생성. 평문 누적용 빈 버블.
      const ensureReplyBubble = (card, ts) => {
        if (card.replyBubble) return card.replyBubble;
        const div = document.createElement("div");
        div.className = "ev local channel-chat";
        div.dataset.type = "channel.message.out";
        const head = document.createElement("div");
        const tsEl = document.createElement("span");
        tsEl.className = "ts"; tsEl.textContent = ts;
        const tyEl = document.createElement("span");
        tyEl.className = "type"; tyEl.textContent = assistantName;
        head.appendChild(tsEl); head.appendChild(tyEl);
        div.appendChild(head);
        const msg = document.createElement("div");
        // streaming = 평문 + 깜빡이는 커서. out 도착 시 마크다운 전체본으로 승격(streaming 제거).
        msg.className = "chat-message streaming";
        div.appendChild(msg);
        card.group.appendChild(div); // 스텝 카드(있으면) 다음 = 라이브 답변 슬롯.
        card.replyBubble = div;
        card.replyMsg = msg;
        card.replyRaw = "";
        return div;
      };

      // ── P5 L3 — 토큰 델타 증분 렌더 ───────────────────────────────────────
      // 같은 threadKey 의 진행 버블에 delta 를 순서대로 평문 append(미완성 마크다운 깜빡임 회피).
      // 스텝 그룹(P3)이 진행 중이면 그 그룹의 답변 슬롯으로, 없으면 경량 delta 그룹을 새로 만든다.
      // 최종 권위는 channel.message.out — 도착 시 이 버블을 마크다운 전체본으로 승격(renderChannelMessage).
      const renderDelta = (p, ts) => {
        const delta = String(p.delta || "");
        if (delta === "") return;
        const thread = p.threadKey || THREAD_KEY;
        const adapter = ADAPTERS.includes(p.adapter) ? p.adapter : "other";
        let card = cardByThread.get(thread);
        // 진행 버블을 붙일 그룹이 없거나 이미 닫힌(답변 완료) 턴이면 새 경량 그룹 시작.
        if (!card || !card.group.isConnected || card.closed) {
          card = createDeltaGroup(p, ts, adapter, thread);
          cardByThread.set(thread, card);
          stream.insertBefore(card.group, stream.firstChild);
          capStream();
        }
        ensureReplyBubble(card, ts);
        // 평문 누적(textContent) — 스트리밍 중 부분 마크다운/미완 코드펜스 위험·깜빡임 회피.
        card.replyRaw += delta;
        card.replyMsg.textContent = card.replyRaw;
        // firstEvent/evCount 는 renderEvent 진입부에서 이미 처리됨(델타도 이벤트 1건).
        refreshChatEmpty();
        if (currentView === "overview") setTimeout(showOverview, 0);
      };

      const renderActivity = (p, ts) => {
        const thread = p.threadKey || "?";
        // dedup(기능 B) — chat-history 가 이미 그린 영속 스텝이면 SSE replay 는 스킵(중복 차단).
        const ak = actKey(p.ts != null ? p.ts : ts, thread, p.seq);
        if (renderedActivityKeys.has(ak)) return;
        renderedActivityKeys.add(ak);
        // 마스터 데이터 저장: 전체 payload 를 threadKey+seq 키로(클릭 시 상세 조회).
        activityByStep.set(stepKey(thread, p.seq), p);
        const adapter = ADAPTERS.includes(p.adapter) ? p.adapter : "other";
        let card = cardByThread.get(thread);
        const prevCard = card; // 직전 턴(있으면) — 새 턴 시작 시 접어 최신만 펼침 유지.
        // 새 턴 = 카드 없음 / 제거됨 / seq 리셋 / 이미 답변으로 닫힌 턴 / 스텝카드 없는 delta-only 그룹.
        const isNewTurn =
          !card || !card.group.isConnected || card.closed || !card.el || (p.seq ?? 0) <= card.lastSeq;
        if (isNewTurn) {
          // ★최신/진행중 턴만 펼침(2026-07-10) — 새 턴이 시작되면 직전 턴을 접는다(클러터 방지).
          if (prevCard && prevCard.el) {
            prevCard.el.classList.add("done-collapsed");
            const pc = prevCard.el.querySelector(".turn-caret"); if (pc) pc.textContent = "▶";
          }
          card = createTurnCard(p, ts, adapter, thread);
          cardByThread.set(thread, card);
          stream.insertBefore(card.group, stream.firstChild);
          capStream();
        }
        card.body.appendChild(buildActivityLine(p));
        card.lastSeq = p.seq ?? 0;
        card.count += 1;
        card.countEl.textContent = card.count + "단계";
        // 진행 중/접힘 시 헤더 미리보기 — 도구명 + 상세(무슨 파일/명령인지 한눈에).
        card.lastEl.textContent =
          (p.label || p.kind || "") + (p.detail ? " · " + p.detail : "");
        card.setOpen(true); // 진행 중엔 펼쳐서 라이브로 보이게.
      };

      // 답변(channel.message.out) 도착 시, 같은 threadKey 의 진행 중 턴 그룹을 마무리한다.
      // 답변 버블을 그 그룹 안(스텝 아래)에 배치 + 스텝 카드를 "n단계 완료" 로 접는다.
      // 진행 중 그룹이 없으면 null 반환 → 호출부가 기존 단독 버블로 렌더(회귀 0).
      // 턴 종료 시 마지막 스텝 pulse 정지용 — 카드에 .done 만 붙인다(collapse·closed 안 함).
      // completeTurnGroup(응답 도착)은 그대로 full 완료(접기)를 한다. 응답이 안 와도(에러·
      // Edit hang·타임아웃 종료) turn_done/turn_error 에서 이걸 불러 스텝이 영영 깜빡이는 것 방지.
      const markTurnCardDone = (thread) => {
        const card = cardByThread.get(thread);
        if (card && card.el && !card.el.classList.contains("done")) {
          card.el.classList.add("done");
        }
      };
      const completeTurnGroup = (thread) => {
        const card = cardByThread.get(thread);
        if (!card || !card.group.isConnected || card.closed) return null;
        card.closed = true;
        // delta-only 경량 그룹(스텝 카드 없음)은 접을 카드가 없다 — 그룹만 반환.
        if (!card.el) return card.group;
        card.countEl.textContent = card.count + "단계 완료";
        card.el.classList.add("done");
        // ★진행중/최신 턴은 펼친 채 유지(사용자 요청 2026-07-10) — 완료돼도 자동접힘 안 함.
        // 직전 턴 정리는 새 턴 시작 시 renderActivity 가 접는다(최신만 펼침 → 클러터 방지).
        return card.group;
      };

      // ── 마크다운 렌더(봇 답변 전용) ──────────────────────────────────────
      // 봇 출력은 신뢰경계 밖(모델이 <script>·onerror·javascript: 토해낼 수 있음).
      // marked 는 sanitize 안 함 → DOMParser 화이트리스트 재구성으로 안전 태그/속성만 통과.
      // 구멍 우려 시 DOMPurify(min) 1파일 동봉으로 승격: marked.parse→DOMPurify.sanitize 로 교체.
      const MD_ALLOWED_TAGS = new Set([
        "p","br","strong","em","b","i","code","pre","ul","ol","li",
        "blockquote","h1","h2","h3","h4","h5","h6","a","hr","del","s",
        "table","thead","tbody","tr","th","td","span",
      ]);
      const MD_SAFE_HREF = /^(https?:|mailto:)/i;
      // 미닫힌 코드펜스(``` 홀수) 봉합 — 답변에 ``` 하나만 있어도 깨진 HTML 방지(렌더용 복사본만).
      const sealFences = (src) => {
        const fences = (src.match(/^```/gm) || []).length;
        return fences % 2 === 1 ? src + "\n```" : src;
      };
      const sanitizeMarkdownHtml = (html) => {
        const doc = new DOMParser().parseFromString(html, "text/html");
        const walk = (node) => {
          // 자식 스냅샷(순회 중 교체로 인한 라이브 컬렉션 변동 방지).
          for (const child of Array.from(node.childNodes)) {
            if (child.nodeType === 1) {
              const tag = child.tagName.toLowerCase();
              if (!MD_ALLOWED_TAGS.has(tag)) {
                // 미허용 태그 = unwrap(자식 텍스트/노드는 보존, 통째 drop 아님).
                walk(child);
                while (child.firstChild) node.insertBefore(child.firstChild, child);
                node.removeChild(child);
                continue;
              }
              // 모든 속성 제거 후, a.href·code 의 language 클래스만 화이트리스트로 복원.
              const href = tag === "a" ? child.getAttribute("href") : null;
              // 코드블록 언어 클래스(예: language-csharp) 보존 → 하이라이터가 언어 판별에 사용.
              const codeLang =
                tag === "code" ? child.getAttribute("class") : null;
              for (const attr of Array.from(child.attributes)) {
                child.removeAttribute(attr.name);
              }
              if (tag === "a") {
                if (href && MD_SAFE_HREF.test(href.trim())) {
                  child.setAttribute("href", href.trim());
                  child.setAttribute("target", "_blank");
                  child.setAttribute("rel", "noopener noreferrer");
                }
              }
              if (tag === "code" && codeLang && /^language-[\w#+.\-]+$/.test(codeLang.trim())) {
                child.setAttribute("class", codeLang.trim());
              }
              walk(child);
            } else if (child.nodeType !== 3) {
              // 텍스트(3) 외 코멘트/기타 노드 제거.
              node.removeChild(child);
            }
          }
        };
        walk(doc.body);
        return doc.body.innerHTML;
      };
      // 코드블록 하이라이팅 — vendored highlight.js(window.hljs). sanitize 후 DOM 의 pre code 를
      // 언어(language-* 클래스, 없으면 자동감지)로 하이라이트. hljs 미로드 시 무해 스킵.
      const highlightCodeBlocks = (root) => {
        if (typeof window.hljs === "undefined") return;
        try {
          root.querySelectorAll("pre code").forEach((el) => {
            try { window.hljs.highlightElement(el); } catch {}
          });
        } catch {}
      };

      const renderMarkdown = (src) => {
        // marked·sanitize 실패 시 평문 폴백(happy-path 금지).
        return sanitizeMarkdownHtml(
          window.marked.parse(sealFences(src), { gfm: true, breaks: true }),
        );
      };
      // 봇 답변=마크다운(innerHTML, sanitize 후), 사용자/오류=평문(textContent).
      const setChatBody = (msgEl, text, asMarkdown) => {
        const src = String(text || "");
        if (asMarkdown && typeof window.marked !== "undefined") {
          try {
            msgEl.innerHTML = renderMarkdown(src);
            msgEl.classList.add("md");
            highlightCodeBlocks(msgEl); // 코드블록 언어별 하이라이팅.
            return;
          } catch (e) {
            // 폴백: 평문.
          }
        }
        msgEl.classList.remove("md");
        msgEl.textContent = src;
      };

      const renderChannelMessage = (ev, ts) => {
        const payload = ev.payload || {};
        const isOut = ev.type === "channel.message.out";
        const thread = payload.threadKey || THREAD_KEY;

        // ── P5 진행 버블 승격 ──────────────────────────────────────────────
        // out(봇 답변)이고 같은 threadKey 에 스트리밍 진행 버블이 있으면, 새 버블을 만들지
        // 말고 그 진행 버블을 "최종 권위 전체본 + 마크다운"으로 승격(중복 버블 생성 금지).
        // 누적 평문 델타는 폐기되고 out 전체본으로 치환 = 부분 렌더 오차 자가치유.
        if (isOut) {
          const card = cardByThread.get(thread);
          if (card && card.replyBubble && card.replyBubble.isConnected) {
            setChatBody(card.replyMsg, payload.text, true);     // 평문 델타 → 마크다운 전체본 1회.
            card.replyMsg.classList.remove("streaming");        // 타이핑 커서 off.
            card.replyBubble = null; card.replyMsg = null; card.replyRaw = "";
            completeTurnGroup(thread);                          // 스텝 카드 "n단계 완료"로 접기.
            localChatCount += 1;
            refreshChatEmpty();
            if (currentView === "overview") setTimeout(showOverview, 0);
            capStream();
            return;
          }
        }

        const div = document.createElement("div");
        div.className = "ev local channel-chat";
        div.dataset.type = (ev.type || "").toLowerCase();
        if (ev.ts != null) div.dataset.ts = String(ev.ts); // prune 후 커서 복구용 수치 ts.
        const head = document.createElement("div");
        const tsEl = document.createElement("span");
        tsEl.className = "ts";
        tsEl.textContent = ts;
        const tyEl = document.createElement("span");
        tyEl.className = "type";
        tyEl.textContent = isOut ? assistantName : "나";
        head.appendChild(tsEl); head.appendChild(tyEl);
        div.appendChild(head);
        const msg = document.createElement("div");
        msg.className = "chat-message";
        // 봇 출력(비서)만 마크다운, 사용자 입력(나)은 평문 유지.
        setChatBody(msg, payload.text, isOut);
        div.appendChild(msg);
        // 봇 답변(out)이면 같은 턴의 스텝 그룹을 마무리하고 그 그룹 안(스텝 아래)에 버블 배치.
        // 진행 중 그룹이 없으면(또는 사용자 입력) 기존처럼 stream 최상단에 단독 삽입.
        const group = isOut ? completeTurnGroup(thread) : null;
        if (group) {
          group.appendChild(div); // 그룹 내 스텝 카드 다음 = 답변 말풍선.
        } else {
          stream.insertBefore(div, stream.firstChild);
        }
        localChatCount += 1;
        refreshChatEmpty();
        if (currentView === "overview") setTimeout(showOverview, 0);
        capStream();
      };

      // ── 과거 대화 이력 렌더(기능 B) ──────────────────────────────────────
      // chat_log 에서 온 과거 메시지를 단순 채팅 버블로 렌더한다. 라이브 경로(renderChannelMessage)
      // 와 달리 스텝 카드·도구 활동·턴 그룹화가 없다(이벤트 미영속 = 설계 한계, 메시지 버블만).
      // 사용자=평문·비서=마크다운(setChatBody) 으로 라이브 버블과 동일 모양.
      // 순서: 호출자가 오래된→최신 순으로 넘기고 매번 stream.firstChild 앞에 삽입한다.
      // column-reverse 라 child[0]=시각 최하단(=최신). 오래된 것이 먼저 들어가 깊은 DOM
      // 인덱스(=시각 아래)로 밀리고 최신 과거가 child[0](시각 맨위)에 온다.
      // 버블 div 생성만(삽입은 호출자). 초기 로드는 insertBefore(firstChild)=시각 상단 누적,
      // 페이지네이션(더 로드)은 appendChild=시각 하단(=DOM 끝=최古쪽) 누적으로 재사용한다.
      const buildHistoryDiv = (entry) => {
        const isOut = entry.role === "assistant";
        const div = document.createElement("div");
        div.className = "ev local channel-chat";
        div.dataset.type = isOut ? "channel.message.out" : "channel.message.in";
        div.dataset.ts = String(entry.ts); // prune 후 oldestLoadedTs 복구용 수치 ts.
        const head = document.createElement("div");
        const tsEl = document.createElement("span");
        tsEl.className = "ts";
        tsEl.textContent = fmtTime(entry.ts);
        const tyEl = document.createElement("span");
        tyEl.className = "type";
        tyEl.textContent = isOut ? assistantName : "나";
        head.appendChild(tsEl); head.appendChild(tyEl);
        div.appendChild(head);
        const msg = document.createElement("div");
        msg.className = "chat-message";
        setChatBody(msg, entry.text, isOut); // 비서=마크다운, 사용자=평문.
        div.appendChild(msg);
        return div;
      };

      // 메시지 유닛 → element(+dedup 키 등록). 이미 렌더됐으면 null(SSE/다른 페이지 중복 방지).
      const buildHistoryMsgEl = (entry) => {
        const role = entry.role === "assistant" ? "assistant" : "user";
        const key = msgKey(entry.ts, role);
        if (renderedMsgKeys.has(key)) return null;
        renderedMsgKeys.add(key);
        return buildHistoryDiv({ ts: entry.ts, role, text: entry.text });
      };

      // 이력 도구 스텝(기능 B) — 영속 llm.activity 복원. 낱줄 element 빌더(카드 크롬 없음).
      // 라이브 buildActivityLine 과 동형: diff/출력 리치 블록 + 스텝 단위 클릭 sticky 토글.
      const buildHistStepLine = (a) => {
        const line = document.createElement("div");
        line.className = "hist-step";
        if (a.ts != null) line.dataset.ts = String(a.ts);
        const icon = document.createElement("span");
        icon.className = "hist-tool-icon"; icon.textContent = "🔧";
        const label = document.createElement("span");
        label.className = "hist-tool-label"; label.textContent = a.label || "tool";
        line.appendChild(icon); line.appendChild(label);
        // diff 있는 스텝은 diff 헤더가 경로+N/-M 을 보여주므로 verbose detail 생략(접힘 간결).
        const hasDiff = a.diff && Array.isArray(a.diff.lines);
        if (a.detail && !hasDiff) {
          const d = document.createElement("span");
          d.className = "hist-tool-detail"; d.textContent = a.detail;
          line.appendChild(d);
        }
        if (hasDiff) line.appendChild(buildDiffBlock(a.diff));
        if (a.output && typeof a.output.text === "string") line.appendChild(buildOutputBlock(a.output));
        // 클릭 = 스텝 펼침/접힘(리치 블록 있으면). 부모 turn 접힘으로 전파 방지(stopPropagation).
        if (line.querySelector(":scope > .act-diff, :scope > .act-output")) {
          line.style.cursor = "pointer";
          line.addEventListener("click", (e) => { e.stopPropagation(); line.classList.toggle("expanded"); });
        }
        return line;
      };

      // 이력 turn 묶음 — 연속된 같은 턴의 도구 스텝을 접이식 "N단계" 카드로(라이브 turn-card 파리티).
      // 새로고침 후에도 라이브처럼 그룹핑돼 보이게. 기본 접힘(완료된 라이브 턴의 done-collapsed 동형).
      const buildHistoryTurnEl = (acts) => {
        for (const a of acts) renderedActivityKeys.add(actKey(a.ts, a.threadKey, a.seq));
        const turn = document.createElement("div");
        turn.className = "ev local hist-turn";
        turn.dataset.type = "llm.activity";
        turn.dataset.ts = String(acts[0].ts);
        const head = document.createElement("div");
        head.className = "hist-turn-head";
        const caret = document.createElement("span");
        caret.className = "hist-turn-caret"; caret.textContent = "▸";
        const icon = document.createElement("span");
        icon.className = "hist-turn-icon"; icon.textContent = "🔧";
        const count = document.createElement("span");
        count.className = "hist-turn-count"; count.textContent = acts.length + "단계";
        const preview = document.createElement("span");
        preview.className = "hist-turn-preview";
        preview.textContent = acts.map((a) => a.label || "tool").slice(0, 6).join(" · ");
        head.appendChild(caret); head.appendChild(icon); head.appendChild(count); head.appendChild(preview);
        const body = document.createElement("div");
        body.className = "hist-turn-body";
        for (const a of acts) body.appendChild(buildHistStepLine(a));
        head.addEventListener("click", () => turn.classList.toggle("expanded"));
        turn.appendChild(head); turn.appendChild(body);
        return turn;
      };

      // 메시지+활동 → 시간순 병합 후 연속된 같은 턴(threadKey·seq 증가)의 활동을 turn 으로 묶은
      // ASC 유닛 배열. 라이브 turn-card 파리티. 메시지·threadKey 변경·seq 리셋이 경계.
      const groupMergedItems = (entries, activities) => {
        const merged = [
          ...entries.map((e) => ({ ts: e.ts, m: e })),
          ...activities.map((a) => ({ ts: a.ts, a })),
        ].sort((x, y) => x.ts - y.ts);
        const units = [];
        let cur = null; // { threadKey, lastSeq, acts }
        const flush = () => { if (cur && cur.acts.length) units.push({ kind: "turn", acts: cur.acts }); cur = null; };
        for (const it of merged) {
          if (it.m) { flush(); units.push({ kind: "msg", entry: it.m }); }
          else {
            const a = it.a; const seq = typeof a.seq === "number" ? a.seq : 0;
            if (cur && cur.threadKey === a.threadKey && seq > cur.lastSeq) { cur.acts.push(a); cur.lastSeq = seq; }
            else { flush(); cur = { threadKey: a.threadKey, lastSeq: seq, acts: [a] }; }
          }
        }
        flush();
        return units;
      };

      // 이력 배치 렌더 — 초기 로드(append=false: insertBefore firstChild, ASC)와 페이지네이션
      // (append=true: appendChild=시각 상단, 유닛 역순)이 같은 병합·묶음 로직을 공유. column-reverse
      // 라 append 방향은 유닛을 역순으로 넣어야 시각 top-to-bottom 이 최古→최新 이 된다.
      const renderHistoryBatch = (entries, activities, append) => {
        const units = groupMergedItems(entries, activities);
        const order = append ? units.slice().reverse() : units;
        for (const u of order) {
          const el = u.kind === "turn" ? buildHistoryTurnEl(u.acts) : buildHistoryMsgEl(u.entry);
          if (el === null) continue;
          if (append) stream.appendChild(el); else stream.insertBefore(el, stream.firstChild);
          localChatCount += 1;
        }
      };

      // ── 페이지네이션 상태(기능 2) ────────────────────────────────────────
      // 초기 최근 100 + 위(시각 최上=최古)로 스크롤 시 더 로드(column-reverse). 수동
      // scrollTop 계산 비일관 회피 → IntersectionObserver 센티넬(DOM 끝=최古쪽) 방식.
      const HISTORY_PAGE = 100; // 페이지당 건수(초기·추가 동일).
      let oldestLoadedTs = null; // 현재 로드된 가장 오래된 메시지 ts(다음 beforeTs).
      let loadingOlder = false; // 동시 로드 가드.
      let reachedOldest = false; // 빈 배치 → 더 없음(센티넬 observe 해제).
      let olderObserver = null; // IntersectionObserver 핸들(누수 0 위해 disconnect 추적).
      let historySentinel = null; // 시각 최下단(=DOM 끝=최古쪽) 센티넬 요소. (이름은 관습 유지.)

      // 센티넬을 항상 DOM 끝(= 시각 최하단 = 최古쪽)에 유지한다. 더 로드로 메시지를
      // appendChild 하면 센티넬보다 앞에 들어가므로, 매 로드 후 다시 끝으로 옮긴다.
      const ensureSentinelAtTop = () => {
        if (historySentinel === null) {
          historySentinel = document.createElement("div");
          historySentinel.id = "history-sentinel";
          historySentinel.setAttribute("aria-hidden", "true");
          // 보이지 않는 0높이 마커 — 레이아웃·스크롤에 영향 0.
          historySentinel.style.cssText = "height:1px;margin:0;padding:0;pointer-events:none;";
        }
        stream.appendChild(historySentinel); // DOM 끝 = 시각 최하단(최古쪽).
      };

      // 과거 배치(ASC: 최古→최新)를 시각 최상단(기존 최古 위)에 쌓는다(column-reverse: DOM 끝=시각 위).
      // DOM 끝=시각 하단 → 배치를 **내림차순(최新→최古)으로 appendChild** 해야 시각
      // top-to-bottom 이 [… 기존最古, 배치最新 … 배치最古] 로 올바르게 쌓인다(위=최신 유지).
      // dedup: 이미 렌더된 key 는 스킵. 반환 = 실제 추가된 가장 오래된 ts.
      // 더 로드 — 시각 최古까지 스크롤업 트리거(센티넬 가시). try/catch 로 라이브 무손상.
      const loadOlderHistory = async () => {
        if (loadingOlder || reachedOldest || oldestLoadedTs === null) return;
        // ★하단(라이브/최신)에 있을 땐 older 를 로드하지 않는다. 하단에선 capStream 이
        // near-bottom prune 으로 200 상한을 유지하는데, 거기서 older 를 당기면 "로드→prune"
        // 싸움이 나 observer/cursor 상태가 꼬이고 스크롤업 더보기가 죽는다(헤드리스 검증
        // 2026-06-26). older 는 사용자가 실제로 스크롤업해 이력을 볼 때(=not near-bottom)만.
        if (isNearBottom()) return;
        loadingOlder = true;
        try {
          const r = await fetch(
            "/api/chat-history?limit=" + HISTORY_PAGE + "&beforeTs=" + oldestLoadedTs,
          );
          if (!r.ok) return;
          const data = await r.json().catch(() => ({}));
          const entries = Array.isArray(data.entries) ? data.entries : [];
          const activities = Array.isArray(data.activities) ? data.activities : [];
          if (entries.length === 0) {
            reachedOldest = true; // 더 없음 → 센티넬 해제.
            if (olderObserver !== null) { olderObserver.disconnect(); olderObserver = null; }
            return;
          }
          // 스크롤 위치 보존: column-reverse 라 older 는 시각 상단(뷰 위)에 append → 현재 보던
          // 위(최신) 위치는 안 흔들린다. 만일을 대비해 scrollTop 보정 기준만 잡아둔다(보통 0).
          const beforeTop = stream.scrollTop;
          // 도구 스텝·diff·출력·묶음도 함께 복원(초기 로드와 동일 로직, append 방향).
          renderHistoryBatch(entries, activities, true);
          oldestLoadedTs = entries[0].ts; // 배치 最古(ASC[0]) = 다음 beforeTs.
          ensureSentinelAtTop(); // 센티넬을 다시 DOM 끝(시각 최하단·最古쪽)으로.
          if (entries.length < HISTORY_PAGE) {
            reachedOldest = true; // 페이지 미만 = 마지막 묶음.
            if (olderObserver !== null) { olderObserver.disconnect(); olderObserver = null; }
          }
          // 점프 보정(브라우저 비일관 대비) — 위치가 변했으면 되돌린다.
          if (stream.scrollTop !== beforeTop) stream.scrollTop = beforeTop;
        } catch (err) {
          console.warn("older history load failed:", err && err.message ? err.message : err);
        } finally {
          loadingOlder = false;
        }
      };

      // 센티넬 IntersectionObserver 설정 — 1회. root = 스크롤 컨테이너(#stream).
      // 센티넬(시각 최상단)이 보이면 = 사용자가 최古까지 스크롤업 → 더 로드.
      const setupOlderObserver = () => {
        if (olderObserver !== null || reachedOldest) return;
        ensureSentinelAtTop();
        olderObserver = new IntersectionObserver(
          (obsEntries) => {
            for (const oe of obsEntries) {
              if (oe.isIntersecting) { void loadOlderHistory(); }
            }
          },
          { root: stream, rootMargin: "120px", threshold: 0 },
        );
        olderObserver.observe(historySentinel);
      };

      // SSE 연결 *전에* 과거 이력을 await 로드해 채팅 흐름을 복원한다. 비어있으면 chat-empty
      // 안내가 그대로 유지된다(첫 사용). 실패는 무해 — 라이브 SSE 경로엔 영향 0(과거 로드는 추가).
      // 초기 limit 100(기능 2). 100 미만이면 더 없음(reachedOldest), 아니면 센티넬 관찰 시작.
      // 비서 이름을 정적 문구(채팅 설명 등)에 반영 — 라벨은 렌더 시점에 assistantName 참조.
      const applyAssistantName = () => {
        const desc = document.querySelector(".chat-desc");
        if (desc) desc.textContent = assistantName + "와 대화합니다. 진행 단계는 대화에 바로, 백그라운드 작업은 옆 패널에서 확인합니다.";
      };

      const loadChatHistory = async () => {
        try {
          const r = await fetch("/api/chat-history?limit=" + HISTORY_PAGE);
          if (!r.ok) return;
          const data = await r.json().catch(() => ({}));
          // 비서 표시 이름(AGENT.md 이름, 폴백 tiguclaw) — 라벨/문구에 반영. 빈 이력이어도 세팅.
          if (typeof data.assistantName === "string" && data.assistantName.trim() !== "") {
            assistantName = data.assistantName.trim();
            applyAssistantName();
          }
          const entries = Array.isArray(data.entries) ? data.entries : [];
          const activities = Array.isArray(data.activities) ? data.activities : [];
          if (entries.length === 0 && activities.length === 0) return; // 빈 이력.
          // 메시지 + 도구 스텝(기능 B)을 병합·묶음 렌더(초기=prepend). 각 dedup 키 등록 →
          // 곧 연결될 SSE replay 가 같은 메시지/스텝을 중복 렌더 안 하게.
          renderHistoryBatch(entries, activities, false);
          // 가장 오래된 ts = 다음 페이지의 beforeTs (메시지 기준 — 페이지네이션은 메시지 축).
          oldestLoadedTs =
            entries.length > 0 ? entries[0].ts : (activities.length > 0 ? activities[0].ts : oldestLoadedTs);
          if (entries.length < HISTORY_PAGE) {
            reachedOldest = true; // 첫 로드가 페이지 미만 = 더 없음.
          } else {
            setupOlderObserver(); // 더 있을 수 있음 → 위 스크롤 관찰 시작.
          }
          refreshChatEmpty();
          scrollChatToNewest(); // 초기 로드 후 최신(하단) 고정 — 앵커 드리프트 보정.
          if (currentView === "overview") setTimeout(showOverview, 0);
        } catch (err) {
          // 무해 — 라이브 경로 무손상. 콘솔만.
          console.warn("chat-history load failed:", err && err.message ? err.message : err);
        }
      };

      // ── 축1 선택지(버튼 묶음) — 대시보드 채널 렌더 ─────────────────────────
      // http-bridge 가 publish 한 prompt.options 이벤트를 채팅 흐름에 버튼 묶음으로 렌더.
      // 버튼 클릭 = 사용자가 그 value 를 입력한 것과 동치 → 기존 chat-form 과 동일하게
      // POST /api/messages {text:value, threadKey}. 클릭 후 묶음 비활성(중복 클릭 방지).
      // 비차단: 전송은 백그라운드(에러는 status/로컬 오류 버블로 표면화). route() 단일 인격
      // 재진입이라 새 세션/스레드 0 — threadKey 는 페이로드 우선, 없으면 대시보드 기본.
      // 채팅 진행 상태 표시 — 켜면 "<이름> 작업 중…"(펄스), 끄면 지움. 답(SSE)·에러 시 해제.
      // 진행 표시(모든 채널) — 회전 스피너 + 경과시간. 대시보드 자기 발신뿐 아니라 텔레그램·CLI
      // 등 어느 채널의 턴이 진행 중이어도 표시(SSE channel.message.in=시작, .out/turn_done/
      // turn_error=종료). activeTurns: threadKey→{start,channel}. 하나라도 있으면 working. 대표는
      // 내 대화(THREAD_KEY) 우선, 없으면 가장 이른 것. 여럿이면 "(+N)". 스피너 요소는 유지하고
      // 경과 텍스트만 1초 틱 갱신(애니메이션 끊김 방지).
      let chatWorkingTimer = null;
      const activeTurns = new Map(); // threadKey -> startTime(ms). 채널 무관 — 단일 인격 취급.
      // stale 임계 — 어떤 실제 턴도 이보다 오래 못 감(codex 턴 캡 ~10분 + 여유). 초과 진행표시는
      // turn_done 을 놓친 유령(SSE 재연결·replay·데몬 재시작 중)으로 보고 해제(영구 '작업 중' 방지).
      const STALE_TURN_MS = 15 * 60 * 1000;
      // 경과시간 기준 시작시각 — 내 대화(THREAD_KEY) 우선, 없으면 가장 이른 턴.
      const earliestStart = () => {
        if (activeTurns.has(THREAD_KEY)) return activeTurns.get(THREAD_KEY);
        let best = Infinity;
        for (const t of activeTurns.values()) if (t < best) best = t;
        return best === Infinity ? Date.now() : best;
      };
      const paintWorking = (s) => {
        // ★다채널 단일 인격 — 텔레그램·CLI·대시보드 어디서 온 턴이든 대시보드 발신과 똑같이
        // "<비서> 작업 중" 으로 통일(채널 라벨 없음). 동시에 여럿이면 "(+N)".
        const extra = activeTurns.size > 1 ? " (+" + (activeTurns.size - 1) + ")" : "";
        const lab = s.querySelector(".chat-work-label"); if (lab) lab.textContent = assistantName + " 작업 중" + extra + " ·";
        const el = s.querySelector(".chat-elapsed"); if (el) el.textContent = fmtElapsed(Date.now() - earliestStart());
      };
      const refreshWorking = () => {
        const s = document.getElementById("chat-status"); if (!s) return;
        if (activeTurns.size === 0) {
          if (chatWorkingTimer) { clearInterval(chatWorkingTimer); chatWorkingTimer = null; }
          s.classList.remove("working"); s.textContent = ""; return;
        }
        if (!s.classList.contains("working")) {
          s.classList.add("working");
          s.innerHTML = '<span class="chat-spinner">✳️</span> <span class="chat-work-label"></span> <span class="chat-elapsed"></span>';
        }
        paintWorking(s);
        if (!chatWorkingTimer) chatWorkingTimer = setInterval(() => {
          // stale 스윕 — 유령 진행표시(놓친 turn_done)가 영영 안 꺼지는 것 방지. 비면 해제.
          const now = Date.now(); let swept = false;
          for (const [k, start] of activeTurns) if (now - start > STALE_TURN_MS) { activeTurns.delete(k); swept = true; }
          if (swept && activeTurns.size === 0) { refreshWorking(); return; }
          const el = document.getElementById("chat-status"); if (el) paintWorking(el);
        }, 1000);
      };
      const markTurnActive = (tk) => {
        const k = tk || THREAD_KEY;
        if (!activeTurns.has(k)) activeTurns.set(k, Date.now());
        refreshWorking();
      };
      const markTurnDone = (tk) => { const k = tk || THREAD_KEY; if (activeTurns.delete(k)) refreshWorking(); };
      // 하위호환 — sendChatMessage 의 로컬 즉시 피드백/에러 해제(내 대화 턴).
      const setChatWorking = (on) => { if (on) markTurnActive(THREAD_KEY); else markTurnDone(THREAD_KEY); };
      // 큐 대기 표시 — 이미 이 스레드 턴이 진행 중일 때(busy) 보낸 메시지는 직렬 큐(enqueueThreadTurn)
      // 뒤에 붙어 현재 턴이 끝나야 처리된다. 처리 시작(channel.message.in echo) 전까진 화면에 안
      // 떠서 "등록됐나?" 헷갈린다 → 낙관적 "대기 중" 버블로 즉시 피드백, echo 도착 시 승격(배지 제거).
      const pendingQueued = []; // [{ text, el }] — 아직 처리 시작(echo) 안 된 큐 대기 버블.
      const queueOptimisticBubble = (text) => {
        const div = buildHistoryDiv({ ts: Date.now(), role: "user", text });
        div.classList.add("queued");
        const badge = document.createElement("span");
        badge.className = "queued-badge"; badge.textContent = "대기 중";
        (div.firstChild || div).appendChild(badge); // head(ts+라벨) 에 배지 부착.
        stream.insertBefore(div, stream.firstChild);
        pendingQueued.push({ text, el: div });
        localChatCount += 1;
        refreshChatEmpty();
        scrollChatToNewest();
      };

      // POST /api/messages 공용 전송 — 긴 턴은 응답이 SSE 로 도착하므로, POST 가 오래 기다린 뒤
      // 끊겨도(프록시/HTTP 타임아웃) 빨간 에러 대신 "작업 중…" 유지(가짜 timeout 방지). 답이
      // 오면 SSE(channel.message.out)가 setChatWorking(false)로 해제. 즉시 실패(<10s)만 진짜 에러.
      const sendChatMessage = async (text, attachments) => {
        recordTypedTags(text); // 타이핑/삽입한 #태그 학습 → 다음부터 칩으로.
        // 이미 이 스레드 턴 진행 중이면 이 메시지는 큐잉된다 → "대기 중" 낙관적 버블(텍스트 있을 때).
        if (text && activeTurns.has(THREAD_KEY)) queueOptimisticBubble(text);
        setChatWorking(true);
        const t0 = Date.now();
        try {
          const r = await fetch("/api/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              text,
              threadKey: THREAD_KEY,
              ...(attachments && attachments.length ? { attachments } : {}),
            }),
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) {
            if (Date.now() - t0 < 10000) { // 즉시 실패 = 진짜 에러(브리지 다운·잘못된 요청 등).
              setChatWorking(false);
              renderLocalChat("error", data.error || ("HTTP " + r.status));
            }
            // 오래 기다린 뒤 끊김 = 긴 턴 → 작업 중 유지(답은 SSE 로). 아무것도 안 함.
          } else {
            setChatWorking(false); // 동기 POST 반환 = 턴 완료(답은 SSE 로 이미/곧 렌더).
          }
        } catch (err) {
          if (Date.now() - t0 < 10000) { // 즉시 네트워크 실패 = 진짜 에러.
            setChatWorking(false);
            renderLocalChat("error", err.message);
          }
          // 긴 대기 뒤 fetch 끊김 = 긴 턴 → 작업 중 유지(답은 SSE 로).
        }
      };
      const submitOptionValue = (value) => sendChatMessage(value);

      const renderPromptOptions = (payload, ts) => {
        const options = Array.isArray(payload.options) ? payload.options : [];
        if (options.length === 0) return;
        const logEmpty = document.getElementById("log-empty");
        if (logEmpty && firstEvent) { logEmpty.remove(); firstEvent = false; }
        localChatCount += 1;
        refreshChatEmpty();
        if (currentView === "overview") setTimeout(showOverview, 0);
        const div = document.createElement("div");
        div.className = "ev local prompt-options";
        div.dataset.type = "prompt.options";
        const head = document.createElement("div");
        const tsEl = document.createElement("span");
        tsEl.className = "ts"; tsEl.textContent = ts;
        const tyEl = document.createElement("span");
        tyEl.className = "type"; tyEl.textContent = assistantName + " · 선택";
        head.appendChild(tsEl); head.appendChild(tyEl);
        div.appendChild(head);
        if (payload.question) {
          const q = document.createElement("div");
          q.className = "chat-message"; q.textContent = String(payload.question);
          div.appendChild(q);
        }
        if (payload.note) {
          const n = document.createElement("div");
          n.className = "prompt-note"; n.textContent = String(payload.note);
          div.appendChild(n);
        }
        const btnWrap = document.createElement("div");
        btnWrap.className = "prompt-buttons";
        let chosen = false;
        for (const opt of options) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "prompt-option-btn";
          btn.textContent = String(opt.label || opt.value || "");
          btn.addEventListener("click", () => {
            if (chosen) return;
            chosen = true;
            // 묶음 전체 비활성 + 선택 버튼 표시(중복 클릭 방지).
            for (const b of btnWrap.querySelectorAll("button")) b.disabled = true;
            btn.classList.add("picked");
            submitOptionValue(String(opt.value != null ? opt.value : (opt.label || "")));
          });
          btnWrap.appendChild(btn);
        }
        div.appendChild(btnWrap);
        stream.insertBefore(div, stream.firstChild);
        capStream();
      };

      const renderEvent = (ev) => {
        if (firstEvent) {
          const logEmpty = document.getElementById("log-empty");
          if (logEmpty) logEmpty.remove();
          firstEvent = false;
        }
        evCount += 1;
        evCountEl.textContent = evCount + "개 이벤트";
        const navEventCount = document.getElementById("nav-event-count");
        if (navEventCount) navEventCount.textContent = String(evCount);
        if (currentView === "overview") setTimeout(showOverview, 0);
        const ts = fmtTime(ev.ts);
        // 진행 표시 종료(모든 채널) — 턴 종료 신호는 렌더를 막지 않고(return 안 함) 표시만 해제.
        // channel.message.out 이 안 오는 에러 턴까지 확실히 끄기 위한 authoritative 종료.
        if (ev.type === "llm.turn_done" || ev.type === "llm.turn_error") {
          const tk = ev.payload && ev.payload.threadKey;
          markTurnDone(tk);
          markTurnCardDone(tk); // 턴 카드 마지막 스텝 pulse 정지(응답 누락·에러·hang 종료 대비).
        }
        if (ev.type === "channel.message.in" || ev.type === "channel.message.out") {
          const tk = ev.payload && ev.payload.threadKey;
          // 진행 표시(모든 채널) — 인바운드=턴 시작(텔레그램·CLI 포함), 아웃바운드=턴 종료.
          // ★재연결 replay 방어 — 버퍼가 흘리는 과거 .in 은 phantom 진행표시(짝 turn_done 없음)를
          // 만든다. 최근(2분 이내) .in 만 활성화 → 이미 끝난 옛 턴이 '작업 중'으로 안 뜬다.
          if (ev.type === "channel.message.in") {
            if (Date.now() - (ev.ts || 0) < 120000) markTurnActive(tk);
            // 큐 대기 버블 승격 — 이 in echo(=처리 시작)가 대기 중이던 낙관적 버블과 텍스트 일치면
            // 새로 안 그리고 그 버블의 배지를 떼고 서버 ts 키를 등록(중복 렌더 방지).
            const inText = ev.payload && ev.payload.text;
            const pi = pendingQueued.findIndex((p) => p.text === inText);
            if (pi !== -1) {
              const { el } = pendingQueued.splice(pi, 1)[0];
              el.classList.remove("queued");
              const b = el.querySelector(".queued-badge"); if (b) b.remove();
              el.dataset.ts = String(ev.ts);
              renderedMsgKeys.add(msgKey(ev.ts, "user"));
              return;
            }
          } else markTurnDone(tk);
          // dedup — chat-history 로 이미 그린 과거 메시지면(ts|role 일치) 스킵.
          const role = ev.type === "channel.message.out" ? "assistant" : "user";
          const key = msgKey(ev.ts, role);
          if (renderedMsgKeys.has(key)) return;
          renderedMsgKeys.add(key);
          renderChannelMessage(ev, ts);
          return;
        }
        if (ev.type === "llm.activity") {
          const ap = ev.payload || {};
          if (ap.ts == null) ap.ts = ev.ts; // 숫자 ts — dedup 키(기능 B)·주석에 사용.
          // 도구 실행시간(#3) — phase:"end" 는 새 스텝이 아니라 같은 seq 의 시작 스텝에
          // durationMs 를 주석(잡 카드 스텝 · 메인 스트림 라인 양쪽). 여기서 가로채 렌더로 안 감.
          if (ap.phase === "end") { annotateToolDuration(ap); return; }
          // 워커 활동(threadKey=worker:<jobId>)은 백그라운드 잡 카드 스텝으로(채팅 누수 차단).
          if (handleWorkerActivity(ap, ts)) return;
          renderActivity(ap, ts);
          return;
        }
        if (ev.type === "llm.delta") {
          renderDelta(ev.payload || {}, ts);
          return;
        }
        if (ev.type === "prompt.options") {
          renderPromptOptions(ev.payload || {}, ts);
          return;
        }
        if (typeof ev.type === "string" && ev.type.indexOf("worker.") === 0) {
          handleWorkerEvent(ev.payload || {}, ts);
          return;
        }
        const div = document.createElement("div");
        div.className = "ev " + typeClass(ev.type);
        div.dataset.type = (ev.type || "").toLowerCase();
        applyFilter(div);
        const head = document.createElement("div");
        const tsEl = document.createElement("span");
        tsEl.className = "ts"; tsEl.textContent = ts;
        const tyEl = document.createElement("span");
        tyEl.className = "type"; tyEl.textContent = ev.type;
        head.appendChild(tsEl); head.appendChild(tyEl);
        div.appendChild(head);
        const pre = document.createElement("pre");
        pre.textContent = JSON.stringify(ev.payload, null, 2);
        div.appendChild(pre);
        stream.insertBefore(div, stream.firstChild);
        capStream();
      };

      const renderLocalChat = (kind, text) => {
        const logEmpty = document.getElementById("log-empty");
        if (logEmpty && firstEvent) {
          // 대화 탭의 빈 상태는 유지하고, 로그 placeholder만 정리합니다.
          logEmpty.remove();
          firstEvent = false;
        }
        localChatCount += 1;
        refreshChatEmpty();
        if (currentView === "overview") setTimeout(showOverview, 0);
        const now = Date.now();
        const div = document.createElement("div");
        div.className = "ev local";
        div.dataset.ts = String(now); // 날짜 구분선 경계 판정용.
        const head = document.createElement("div");
        const tsEl = document.createElement("span");
        tsEl.className = "ts";
        tsEl.textContent = fmtTime(now);
        const tyEl = document.createElement("span");
        tyEl.className = "type";
        const chatLabel = { user: "나", reply: assistantName, error: "오류" };
        tyEl.textContent = chatLabel[kind] || kind;
        head.appendChild(tsEl); head.appendChild(tyEl);
        div.appendChild(head);
        const msg = document.createElement("div");
        msg.className = "chat-message";
        // 봇 답변(reply)만 마크다운, 사용자/오류는 평문(SSE 권위본과 일관).
        setChatBody(msg, text, kind === "reply");
        div.appendChild(msg);
        stream.insertBefore(div, stream.firstChild);
        capStream(); // 센티넬 보존 가지치기(위 helper 재사용).
      };

      for (const btn of document.querySelectorAll(".nav-button")) {
        btn.addEventListener("click", () => {
          const view = btn.dataset.view;
          if (view === "overview") showOverview();
          else if (view === "providers") showProviders();
          else if (view === "inventory") showInventory();
          else if (view === "agents") showAgents();
          else if (view === "projects") showProjects();
          else if (view === "chat") { setActiveNav("chat"); setChatPanel("chat"); setActiveTab("chat"); scrollChatToNewest(); document.getElementById("chat-input").focus(); }
          else if (view === "settings") showSettings();
          if (window.matchMedia("(max-width: 900px)").matches && ["overview","providers","inventory","settings","agents","projects"].includes(view)) setActiveTab("main");
        });
      }

      refreshChatEmpty();
      showOverview();
      fetchProviders();
      setInterval(fetchProviders, 30000);
      fetchInventory();
      setInterval(fetchInventory, 30000);
      fetchProjects();
      setInterval(fetchProjects, 30000);

      const connDot = document.getElementById("conn-dot");
      const connText = document.getElementById("conn-text");
      const setConn = (up) => {
        connDot.className = "dot " + (up ? "up" : "down");
        connText.textContent = up ? "실시간" : "재연결 중…";
      };

      // SSE 연결 — 재연결 가능 클로저. EventSource 는 보통 끊기면 자동 재연결하지만,
      // 비-200 등 치명 에러면 CLOSED 로 영구 종료(자동 재연결 X) → 탭 stale. 그 경우만
      // 수동 재연결한다(데몬 재시작·블립 내성). 서버측 하트비트(: ping)와 함께 동작.
      let es = null;
      const connectStream = () => {
        es = new EventSource("/api/events");
        es.onopen = () => setConn(true);
        es.onmessage = (m) => {
          setConn(true);
          try { renderEvent(JSON.parse(m.data)); } catch (e) { /* skip malformed */ }
        };
        es.onerror = () => {
          setConn(false);
          // CONNECTING(=자동 재연결 중)이면 브라우저에 맡기고, CLOSED(치명)면 수동 재연결.
          if (es.readyState === EventSource.CLOSED) {
            setTimeout(connectStream, 3000);
          }
        };
      };
      // 과거 대화 이력을 먼저 복원한 뒤 SSE 연결(기능 B). dedup Set 이 채워진 상태로
      // 라이브 스트림이 붙어 history replay 중복을 막는다. 이력 로드 실패/지연이 SSE 를
      // 막지 않도록 then 으로 잇되, 실패해도 반드시 connectStream 으로 진행(라이브 무손상).
      loadChatHistory().finally(connectStream);

      const form = document.getElementById("chat-form");
      const input = document.getElementById("chat-input");
      const sendBtn = document.getElementById("chat-send");
      const statusEl = document.getElementById("chat-status");

      // textarea 자동 높이 — 내용에 맞춰 grow(최대 CSS max-height 까지 스크롤). 전송 후 리셋.
      // 매 키 입력마다 height="auto"→scrollHeight 읽기는 강제 동기 리플로우 → SSE 로 DOM 이
      // 계속 바뀌는 대시보드에선 키 입력마다 전체 레이아웃 플러시 = 입력 랙. rAF 로 프레임당
      // 1회만 측정(빠른 연타 coalesce + 키 입력 echo 경로에서 리플로우 분리).
      let growRaf = 0;
      const autoGrowInput = () => {
        if (growRaf) return;
        growRaf = requestAnimationFrame(() => {
          growRaf = 0;
          input.style.height = "auto";
          input.style.height = Math.min(input.scrollHeight, 148) + "px";
        });
      };
      input.addEventListener("input", autoGrowInput);
      input.addEventListener("input", updateActiveChips); // 타이핑/백스페이스에 칩 활성표시 동기화.

      // Enter=전송, Shift+Enter=줄바꿈(기본 동작 유지). IME 조합 중(한글 입력)에는 전송 금지 —
      // isComposing 이면 Enter 가 조합 확정용이라 가로채면 오전송된다.
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          form.requestSubmit();
        }
      });

      // ── 파일 첨부(#2) — 붙여넣기/드롭/파일선택 → base64 큐 → 전송 시 함께 POST. ──
      const ATT_MAX = 10, ATT_MAX_BYTES = 10 * 1024 * 1024;
      let pendingAttachments = []; // [{filename, mimeType, dataBase64, bytes}]
      const attachEl = document.getElementById("chat-attach");
      const fileInput = document.getElementById("chat-file");
      const attachBtn = document.getElementById("chat-attach-btn");
      const fmtBytes = (b) =>
        b < 1024 ? b + "B" : b < 1048576 ? Math.round(b / 1024) + "KB" : (b / 1048576).toFixed(1) + "MB";
      const renderAttachChips = () => {
        attachEl.innerHTML = "";
        pendingAttachments.forEach((a, i) => {
          const isImg = (a.mimeType || "").startsWith("image/");
          const chip = document.createElement("div");
          chip.className = "att-chip" + (isImg ? " att-img" : " att-file");
          chip.title = a.filename + " · " + fmtBytes(a.bytes);
          if (isImg) {
            // 이미지 = 실제 썸네일 미리보기(base64 data URI).
            const img = document.createElement("img");
            img.className = "att-thumb";
            img.src = "data:" + a.mimeType + ";base64," + a.dataBase64;
            img.alt = a.filename;
            chip.appendChild(img);
          } else {
            // 그 외 = 확장자 라벨 + 파일명 카드.
            const ic = document.createElement("div"); ic.className = "att-fileicon";
            ic.textContent = ((a.filename.split(".").pop() || "FILE").slice(0, 4)).toUpperCase();
            const nm = document.createElement("div"); nm.className = "att-fname"; nm.textContent = a.filename;
            chip.appendChild(ic); chip.appendChild(nm);
          }
          const x = document.createElement("button");
          x.type = "button"; x.className = "att-x"; x.textContent = "✕"; x.title = "제거";
          x.addEventListener("click", () => { pendingAttachments.splice(i, 1); renderAttachChips(); });
          chip.appendChild(x);
          attachEl.appendChild(chip);
        });
      };
      const readAsBase64 = (file) => new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => { const s = String(r.result); const c = s.indexOf(","); resolve(c >= 0 ? s.slice(c + 1) : s); };
        r.onerror = () => reject(r.error || new Error("read failed"));
        r.readAsDataURL(file);
      });
      const addFiles = async (files) => {
        for (const f of files) {
          if (pendingAttachments.length >= ATT_MAX) { showToast(`첨부는 최대 ${ATT_MAX}개까지`, "warn"); break; }
          if (f.size > ATT_MAX_BYTES) { showToast(`'${f.name}' 이(가) 10MB 초과 — 제외`, "warn"); continue; }
          try {
            const dataBase64 = await readAsBase64(f);
            pendingAttachments.push({ filename: f.name || "file", mimeType: f.type || "application/octet-stream", dataBase64, bytes: f.size });
          } catch { showToast(`'${f.name}' 읽기 실패`, "bad"); }
        }
        renderAttachChips();
      };
      attachBtn.addEventListener("click", () => fileInput.click());
      fileInput.addEventListener("change", () => { if (fileInput.files && fileInput.files.length) addFiles([...fileInput.files]); fileInput.value = ""; });
      // 붙여넣기 — 클립보드에 파일(이미지 등)이 있으면 첨부. 텍스트 붙여넣기는 기본 동작 유지.
      input.addEventListener("paste", (e) => {
        const files = e.clipboardData && e.clipboardData.files ? [...e.clipboardData.files] : [];
        if (files.length) { e.preventDefault(); addFiles(files); }
      });
      // 드래그&드롭 — 채팅 패널(#right) 어디든. Files 타입일 때만 가로챈다.
      const dropZone = document.getElementById("right") || document.getElementById("chat");
      const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files");
      const clearDragOver = () => dropZone.classList.remove("drag-over");
      dropZone.addEventListener("dragover", (e) => { if (hasFiles(e)) { e.preventDefault(); dropZone.classList.add("drag-over"); } });
      // ★relatedTarget = 드래그가 *들어가는* 요소. dropZone 밖(또는 null=창 밖)으로 나갈 때만
      // 해제. 기존 `e.target === dropZone` 는 자식 요소 위로 나가면 안 떠서 점선이 stuck 됐다.
      dropZone.addEventListener("dragleave", (e) => {
        if (!e.relatedTarget || !dropZone.contains(e.relatedTarget)) clearDragOver();
      });
      dropZone.addEventListener("drop", (e) => {
        clearDragOver();
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) { e.preventDefault(); addFiles([...e.dataTransfer.files]); }
      });
      // 안전망 — 드래그 취소(Esc)·dropZone 밖 드롭·창 밖 종료 등 dragleave 가 안 오는 경우에도
      // stuck 점선을 확실히 해제(전역 drop/dragend).
      window.addEventListener("drop", clearDragOver);
      window.addEventListener("dragend", clearDragOver);

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (text.length === 0 && pendingAttachments.length === 0) return;
        // 큐 스냅샷 후 즉시 비움(전송 중 사용자가 새 첨부 추가 가능 — 다음 메시지로).
        const atts = pendingAttachments;
        pendingAttachments = [];
        renderAttachChips();
        input.value = "";
        input.style.height = "auto"; // 전송 후 한 줄 높이로 리셋.
        input.focus();
        // 공용 전송 — "작업 중…" 표시 + 긴 턴 가짜 timeout 방지(답은 SSE). 비차단: 워커
        // 발사 등을 기다리며 입력을 막지 않는다(전송 버튼 상시 활성 — 이어서 말 걸 수 있게).
        await sendChatMessage(text, atts);
      });
    </script>
  </body>
</html>
