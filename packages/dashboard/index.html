<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>티구클로 대시보드</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23080a0f'/%3E%3Cpath d='M14 42V18h10c7 0 12 4 12 10s-5 10-12 10h-4v4h-6zm6-12h4c3 0 5-1 5-4s-2-4-5-4h-4v8z' fill='%237dd3fc'/%3E%3Cpath d='M38 18h12v6h-6v18h-6V18z' fill='%23a78bfa'/%3E%3Ccircle cx='45' cy='45' r='5' fill='%2334d399'/%3E%3C/svg%3E" />
    <style>
      * { box-sizing: border-box; }
      /* 항상 보이는 스크롤바 — macOS 기본(스크롤 시에만 표시=오버레이 자동숨김)을 우회해
         채팅(#stream)·스크롤 패널(사이드바·상세·드로어·잡목록)에서 스크롤바가 늘 보이게.
         WebKit(Chrome/Edge/Safari) 커스텀 + Firefox scrollbar-* 폴백. 다크테마 색. */
      * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.22) transparent; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.18);
        border-radius: 8px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.32); background-clip: padding-box; }
      :root {
        color-scheme: dark;
        --bg: #080a0f;
        --bg-soft: #0d1118;
        --panel: rgba(16, 20, 29, 0.84);
        --panel-solid: #10141d;
        --card: rgba(255,255,255,0.045);
        --card-hover: rgba(255,255,255,0.075);
        --border: rgba(255,255,255,0.09);
        --border-strong: rgba(255,255,255,0.16);
        --text: #f4f7fb;
        --text-mute: #9aa7b7;
        --text-dim: #657286;
        --accent: #7dd3fc;
        --accent-2: #a78bfa;
        --good: #34d399;
        --warn: #fbbf24;
        --bad: #fb7185;
        --info: #60a5fa;
        --purple: #c084fc;
        --teal: #2dd4bf;
        --shadow: 0 20px 70px rgba(0,0,0,0.42);
        --radius: 18px;
      }
      html { min-height: 100%; background: var(--bg); }
      body {
        margin: 0;
        min-height: 100%;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background:
          radial-gradient(circle at 12% -8%, rgba(125,211,252,0.18), transparent 34%),
          radial-gradient(circle at 78% 0%, rgba(167,139,250,0.16), transparent 30%),
          linear-gradient(180deg, #080a0f 0%, #0a0d13 100%);
        color: var(--text);
        font-size: 13px;
        line-height: 1.45;
        overflow: hidden;
      }
      button, input { font: inherit; }
      header {
        display: flex; align-items: center; gap: 14px;
        height: 64px;
        padding: 0 22px;
        background: rgba(8,10,15,0.72);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(18px);
      }
      header .brand { display:flex; align-items:center; gap:10px; font-weight: 800; font-size: 16px; letter-spacing: -0.02em; }
      header .brand .emoji { display:grid; place-items:center; width:32px; height:32px; border-radius: 11px; background: linear-gradient(135deg, rgba(125,211,252,.22), rgba(167,139,250,.2)); border: 1px solid var(--border); }
      header .sub { color: var(--text-mute); font-size: 12px; }
      header .spacer { flex: 1; }
      header .live { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-mute); }
      header .live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); }
      header .live .dot.up { background: var(--good); box-shadow: 0 0 14px rgba(52,211,153,0.65); }
      header .live .dot.down { background: var(--bad); }
      header .meter { color: var(--text-dim); font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; }

      #tab-bar { display: none; background: rgba(8,10,15,0.9); border-bottom: 1px solid var(--border); }
      #tab-bar .tab { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:9px 4px; background:transparent; border:0; color:var(--text-mute); cursor:pointer; }
      #tab-bar .tab .ic { font-size: 16px; line-height: 1; }
      #tab-bar .tab.active { color: var(--accent); background: rgba(125,211,252,0.08); }

      main {
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr);
        gap: 14px;
        height: calc(100vh - 64px);
        padding: 14px;
      }
      #sidebar, #workbench, #right {
        min-width: 0;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
        overflow: hidden;
      }

      #sidebar { padding: 14px 12px; overflow-y: auto; display:flex; flex-direction:column; gap:14px; }
      #sidebar h3, .panel-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-dim); margin: 0; font-weight: 800; }
      .nav-brand { padding:4px 6px 8px; }
      .nav-kicker { color:var(--text-dim); font-size:10px; text-transform:uppercase; letter-spacing:.13em; font-weight:850; margin-bottom:6px; }
      .nav-title { color:var(--text); font-size:18px; font-weight:880; letter-spacing:-.04em; }
      .nav-sub { margin-top:3px; color:var(--text-mute); font-size:11px; }
      .nav-section { display:grid; gap:5px; }
      .nav-button { width:100%; display:flex; align-items:center; gap:10px; padding:10px 11px; border:1px solid transparent; border-radius:13px; background:transparent; color:var(--text-mute); cursor:pointer; text-align:left; }
      .nav-button:hover { background:var(--card-hover); color:var(--text); }
      .nav-button.active { background:rgba(125,211,252,.12); border-color:rgba(125,211,252,.28); color:var(--text); }
      .nav-button .ic { width:18px; text-align:center; font-size:15px; }
      .nav-button .label { flex:1; font-weight:750; }
      .nav-button .hint { color:var(--text-dim); font-size:10px; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
      .nav-divider { height:1px; background:var(--border); margin:2px 4px; }
      .nav-note { margin-top:auto; padding:11px; border:1px solid var(--border); border-radius:14px; background:var(--card); color:var(--text-mute); font-size:11px; }
      .nav-note strong { color:var(--text); }
      .cat { margin: 5px 0; }
      .cat-head { display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius: 12px; cursor:pointer; user-select:none; }
      .cat-head:hover { background: var(--card-hover); }
      .cat-head .icon { width:18px; text-align:center; }
      .cat-head .label { flex:1; color:var(--text); font-weight:650; }
      .cat-head .count { font-family: ui-monospace,"SF Mono",Menlo,monospace; font-size:10px; color:var(--text-mute); background:var(--card); border:1px solid var(--border); padding:2px 8px; border-radius:999px; }
      .cat-head .caret { color:var(--text-dim); font-size:9px; transition: transform .15s; }
      .cat.open .caret { transform: rotate(90deg); }
      .cat-body { display:none; padding:4px 0 6px 30px; }
      .cat.open .cat-body { display:block; }
      .cat-item { font-size:11px; color:var(--text-mute); padding:3px 4px; font-family: ui-monospace,"SF Mono",Menlo,monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .cat-item .layer-tag { font-size:9px; padding:1px 5px; border-radius:6px; background:var(--card); color:var(--text-dim); margin-right:5px; }

      #workbench { display:block; }
      #providers-panel { min-width:0; height:100%; background: transparent; overflow-y:auto; display:none; flex-direction:column; }
      #workbench.show-providers #providers-panel { display:flex; }
      #workbench.show-providers #detail-panel { display:none; }
      #providers-head { display:flex; align-items:center; gap:10px; padding:16px 16px 12px; border-bottom:1px solid var(--border); position:sticky; top:0; background:rgba(16,20,29,.92); backdrop-filter: blur(14px); z-index:1; }
      #providers-head h1 { font-size:12px; margin:0; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--text-dim); }
      #providers-head .count { margin-left:auto; font-family: ui-monospace,"SF Mono",Menlo,monospace; font-size:11px; color:var(--text-mute); }
      #providers-list { padding:10px; flex:1; }
      .provider-item { position:relative; background:var(--card); border:1px solid transparent; border-radius:14px; padding:12px 12px 12px 14px; margin-bottom:8px; cursor:pointer; transition: background .12s, border-color .12s, transform .12s; }
      .provider-item:hover { background:var(--card-hover); border-color:var(--border); transform: translateY(-1px); }
      .provider-item.selected { background:rgba(125,211,252,.11); border-color:rgba(125,211,252,.38); }
      .provider-item::before { content:""; position:absolute; left:0; top:12px; bottom:12px; width:3px; border-radius:99px; background:var(--text-dim); }
      .provider-item.s-active::before { background:var(--good); }
      .provider-item.s-degraded::before { background:var(--warn); }
      .provider-item.s-error::before { background:var(--bad); }
      .pi-head { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
      .pi-name { font-size:13px; font-weight:800; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .pi-kind { font-size:9px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); padding:2px 6px; background:rgba(255,255,255,.045); border-radius:6px; }
      .pi-status-dot { margin-left:auto; width:8px; height:8px; border-radius:50%; background:var(--text-dim); }
      .pi-status-dot.active { background:var(--good); box-shadow:0 0 8px rgba(52,211,153,.55); }
      .pi-status-dot.degraded { background:var(--warn); }
      .pi-status-dot.error { background:var(--bad); }
      .pi-summary { color:var(--text-mute); font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .content-stack { display:grid; gap:14px; }
      .subpanel { border:1px solid var(--border); border-radius:18px; background:rgba(255,255,255,.032); padding:14px; min-width:0; }
      .subpanel-head { display:flex; align-items:center; gap:10px; margin-bottom:11px; }
      .subpanel-title { margin:0; color:var(--text); font-size:13px; font-weight:850; letter-spacing:-.015em; }
      .subpanel-desc { margin:3px 0 0; color:var(--text-mute); font-size:11px; }
      .subpanel-count { margin-left:auto; color:var(--text-dim); font-size:10px; font-family:ui-monospace,"SF Mono",Menlo,monospace; padding:3px 8px; border-radius:999px; background:var(--card); border:1px solid var(--border); }
      .provider-layout { display:grid; grid-template-columns:minmax(320px,.95fr) minmax(360px,1.05fr); gap:12px; align-items:start; }
      .provider-sections { display:grid; gap:12px; }
      .provider-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
      .provider-card { width:100%; text-align:left; color:inherit; position:relative; padding:15px 15px 14px 17px; border:1px solid var(--border); border-radius:17px; background:var(--card); cursor:pointer; transition:background .12s,border-color .12s,transform .12s; }
      .provider-card:hover { background:var(--card-hover); border-color:var(--border-strong); transform:translateY(-1px); }
      .provider-card.selected { background:rgba(125,211,252,.12); border-color:rgba(125,211,252,.36); }
      .provider-card::before { content:""; position:absolute; left:0; top:14px; bottom:14px; width:4px; border-radius:99px; background:var(--text-dim); }
      .provider-card.s-active::before { background:var(--good); } .provider-card.s-degraded::before { background:var(--warn); } .provider-card.s-error::before { background:var(--bad); }
      .provider-card-head { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
      .provider-card-name { color:var(--text); font-weight:850; font-size:15px; letter-spacing:-.02em; }
      .provider-card-kind { color:var(--text-dim); font-size:10px; padding:2px 7px; border-radius:999px; background:var(--card); text-transform:uppercase; letter-spacing:.06em; }
      .provider-card-summary { color:var(--text-mute); font-size:12px; min-height:18px; }
      .provider-card-meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:11px; }
      .provider-chip { color:var(--text-mute); font-size:10px; padding:3px 7px; border:1px solid var(--border); border-radius:999px; background:rgba(255,255,255,.035); }

      #detail-panel { min-width:0; height:100%; overflow-y:auto; padding:18px; background:transparent; }
      #detail-empty { color:var(--text-dim); padding:44px 20px; text-align:center; }
      .summary-grid { display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:10px; margin-bottom:16px; }
      .summary-card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:13px 14px; }
      .summary-label { color:var(--text-dim); font-size:10px; text-transform:uppercase; letter-spacing:.1em; font-weight:800; }
      .summary-value { margin-top:5px; font-size:22px; line-height:1; font-weight:850; letter-spacing:-.04em; }
      .summary-hint { margin-top:5px; color:var(--text-mute); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .detail-head { display:flex; align-items:center; gap:12px; padding:18px; margin-bottom:14px; border:1px solid var(--border); border-radius:18px; background:linear-gradient(135deg, rgba(125,211,252,.10), rgba(167,139,250,.08)); }
      .detail-accent { width:4px; height:32px; border-radius:99px; background:var(--text-dim); }
      .detail-accent.active { background:var(--good); } .detail-accent.degraded { background:var(--warn); } .detail-accent.error { background:var(--bad); }
      .detail-name { font-size:22px; font-weight:850; color:var(--text); letter-spacing:-.035em; }
      .detail-kind { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); padding:3px 8px; background:var(--card); border-radius:7px; }
      .detail-status { margin-left:auto; font-size:11px; text-transform:uppercase; letter-spacing:.06em; padding:5px 11px; border-radius:999px; background:var(--card); color:var(--text-mute); font-weight:800; }
      .detail-status.active { background:rgba(52,211,153,.14); color:var(--good); } .detail-status.degraded { background:rgba(251,191,36,.15); color:var(--warn); } .detail-status.error { background:rgba(251,113,133,.15); color:var(--bad); }
      .detail-summary { color:var(--text-mute); font-size:13px; margin:0 0 14px; }
      .detail-meta { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
      .detail-cap { font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:10px; color:var(--text-mute); padding:4px 8px; border-radius:999px; background:var(--card); border:1px solid var(--border); }
      .views { display:grid; gap:10px; }
      .view { padding:12px; background:var(--card); border-radius:15px; border:1px solid var(--border); }
      .view-title { font-size:11px; font-weight:800; color:var(--text); text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px; }
      .kv { display:grid; grid-template-columns:minmax(90px,28%) 1fr; gap:6px 12px; font-size:12px; }
      .kv-key { color:var(--text-mute); }
      .kv-val { color:var(--text); word-break:break-word; font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:11px; }
      .provider-table { width:100%; border-collapse:collapse; font-size:11px; }
      .provider-table th { color:var(--text-mute); text-align:left; border-bottom:1px solid var(--border); padding:6px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; font-size:10px; }
      .provider-table td { color:var(--text); border-bottom:1px solid rgba(255,255,255,.055); padding:6px; vertical-align:top; word-break:break-word; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
      .detail-card { display:grid; gap:12px; }
      .detail-card .summary-grid { margin-bottom:0; }
      .detail-card .detail-head { margin-bottom:0; }
      .detail-card .detail-summary { margin:0; }
      .action { display:flex; align-items:center; gap:8px; margin:5px 0; font-size:11px; }
      .action button { background:var(--card); color:var(--text-mute); border:1px solid var(--border); border-radius:8px; padding:5px 10px; cursor:not-allowed; }
      .danger-safe { color:var(--good); } .danger-gray { color:var(--warn); } .danger-danger { color:var(--bad); }
      .more { font-size:10px; color:var(--text-dim); margin-top:5px; }
      .empty { color:var(--text-dim); padding:18px; text-align:center; background:var(--card); border-radius:14px; border:1px dashed var(--border); }

      .page-view { min-height:100%; }
      .overview { display:grid; gap:14px; }
      .hero-card { padding:22px; border:1px solid var(--border); border-radius:20px; background:linear-gradient(135deg, rgba(125,211,252,.12), rgba(167,139,250,.09)); }
      .hero-card h1 { margin:0; font-size:28px; letter-spacing:-.055em; line-height:1.05; }
      .hero-card p { margin:8px 0 0; color:var(--text-mute); font-size:13px; max-width:680px; }
      .quick-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
      .quick-card { padding:14px; border:1px solid var(--border); border-radius:16px; background:var(--card); }
      .quick-label { color:var(--text-dim); font-size:10px; text-transform:uppercase; letter-spacing:.1em; font-weight:850; }
      .quick-value { margin-top:6px; font-size:24px; font-weight:880; letter-spacing:-.045em; }
      .quick-hint { margin-top:4px; color:var(--text-mute); font-size:11px; }
      .section-head { display:flex; align-items:center; gap:10px; margin:4px 0 0; }
      .section-head h2 { margin:0; font-size:12px; text-transform:uppercase; letter-spacing:.12em; color:var(--text-dim); }
      .overview-layout { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr); gap:12px; align-items:start; }
      .status-list { display:grid; gap:8px; }
      .status-row { display:flex; align-items:center; gap:10px; padding:11px 12px; border:1px solid var(--border); border-radius:14px; background:var(--card); }
      .status-dot { width:9px; height:9px; border-radius:50%; background:var(--text-dim); flex:0 0 auto; }
      .status-dot.good { background:var(--good); box-shadow:0 0 12px rgba(52,211,153,.45); }
      .status-dot.warn { background:var(--warn); }
      .status-dot.bad { background:var(--bad); }
      .status-main { min-width:0; flex:1; }
      .status-title { color:var(--text); font-weight:820; font-size:12px; }
      .status-desc { color:var(--text-mute); font-size:11px; margin-top:2px; }
      .health-pill { color:var(--text-mute); font-size:10px; font-weight:850; padding:4px 8px; border:1px solid var(--border); border-radius:999px; background:rgba(255,255,255,.035); white-space:nowrap; }
      .health-pill.good { color:var(--good); background:rgba(52,211,153,.11); border-color:rgba(52,211,153,.25); }
      .health-pill.warn { color:var(--warn); background:rgba(251,191,36,.11); border-color:rgba(251,191,36,.24); }
      .health-pill.bad { color:var(--bad); background:rgba(251,113,133,.12); border-color:rgba(251,113,133,.25); }
      .home-actions { display:grid; gap:8px; }
      .home-action { display:flex; align-items:center; gap:10px; width:100%; padding:12px; border:1px solid var(--border); border-radius:14px; background:var(--card); color:var(--text); text-align:left; cursor:pointer; }
      .home-action:hover { background:var(--card-hover); border-color:var(--border-strong); }
      .home-action .ic { width:22px; text-align:center; font-size:16px; }
      .home-action strong { display:block; font-size:12px; }
      .home-action span:last-child { color:var(--text-mute); font-size:11px; display:block; margin-top:2px; }
      .inventory-shell { display:grid; gap:6px; }
      .developer-copy { color:var(--text-mute); margin:0 0 12px; }
      #right { display:none; flex-direction:column; }
      body[data-main="stream"] #workbench { display:none; }
      body[data-main="stream"] #right { display:flex; }
      body[data-view="chat"] #stream { flex:1; }
      @media (max-width: 900px) {
        body[data-main="stream"] #right { display:none; }
        body[data-main="stream"][data-tab="chat"] #right { display:flex; }
      }
      #stream-bar { display:grid; gap:10px; padding:13px 14px; border-bottom:1px solid var(--border); }
      .chat-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
      .chat-title { margin:0; color:var(--text); font-size:16px; font-weight:880; letter-spacing:-.035em; }
      .chat-desc { margin:3px 0 0; color:var(--text-mute); font-size:11px; }
      .chat-tabs { display:flex; gap:6px; padding:4px; border:1px solid var(--border); border-radius:13px; background:rgba(255,255,255,.035); }
      .chat-tab { border:0; border-radius:10px; padding:7px 10px; background:transparent; color:var(--text-mute); cursor:pointer; font-size:11px; font-weight:800; }
      .chat-tab.active { background:rgba(125,211,252,.13); color:var(--text); }
      .log-tools { display:none; align-items:center; gap:10px; }
      body[data-chat-panel="log"] .log-tools { display:flex; }
      #ev-filter { background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:8px 10px; flex:1; min-width:0; font-size:12px; }
      #ev-filter:focus, #chat-input:focus { outline:none; border-color:rgba(125,211,252,.55); }
      #stream { flex:1; overflow-y:auto; padding:10px; }
      /* 대화 패널: 표준 채팅 — 최신이 맨 아래, 열면 하단 고정. 스트림은 prepend(최신=firstChild)
         이라 column-reverse 로 시각만 뒤집어 오래된 것=위·최신=아래. scrollTop=0(=시각 하단)이
         브라우저 기본이라 열면 최신이 보인다. 위→아래 = 과거→최신(표준 채팅 순서). 그룹 내부
         (스텝→답변)는 그룹이 단일 flex 아이템이라 영향 없음. 로그 패널은 기존대로. */
      body[data-chat-panel="chat"] #stream { display:flex; flex-direction:column-reverse; }
      /* 채팅 패널: 일반 이벤트는 숨기되, 턴 그룹(스텝 리스트+답변)은 대화 흐름에 인터리빙. */
      body[data-chat-panel="chat"] .ev:not(.local):not(.in-group) { display:none !important; }
      /* 로그 패널: 로컬 채팅 버블·턴 그룹 래퍼는 숨기고, 그룹 안 turn-card 만 펼침 표시. */
      body[data-chat-panel="log"] .ev.local,
      body[data-chat-panel="log"] .chat-empty { display:none !important; }
      body[data-chat-panel="log"] .turn-group { display:contents; }
      /* 날짜 구분선 — 날짜가 바뀌는 첫(그 날짜의 최신) 메시지 위. 채팅 패널 전용. */
      .date-divider { display:flex; align-items:center; gap:8px; margin:16px 4px 7px; color:var(--text-dim); font-size:10px; }
      .date-divider::before, .date-divider::after { content:""; flex:1; height:1px; background:var(--border); }
      .date-divider span { font-family:ui-monospace,"SF Mono",Menlo,monospace; letter-spacing:.04em; white-space:nowrap; }
      body[data-chat-panel="log"] .date-divider { display:none !important; }
      .ev { padding:8px 10px; margin:7px 0; border:1px solid var(--border); border-left:3px solid var(--text-dim); background:var(--card); border-radius:12px; font-size:11px; word-break:break-word; }
      .ev .ts { color:var(--text-dim); font-size:10px; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
      .ev .type { font-weight:800; margin-left:6px; font-size:11px; }
      .ev pre { display:none; margin:6px 0 0; white-space:pre-wrap; color:var(--text-mute); font-size:10px; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
      .ev:hover pre, .ev.expanded pre { display:block; }
      .ev.local { padding:10px 12px; }
      .ev.local pre { display:block; font-size:12px; color:var(--text); line-height:1.5; }
      .ev.local .type { text-transform:none; }
      .chat-message { margin-top:7px; white-space:pre-wrap; color:var(--text); font-size:13px; line-height:1.55; font-family:inherit; }
      /* 마크다운 렌더(봇 답변만). 평문 버블은 white-space:pre-wrap 유지, 마크다운 버블은 normal 로 흐름. */
      .chat-message.md { white-space:normal; }
      .chat-message.md > :first-child { margin-top:0; }
      .chat-message.md > :last-child { margin-bottom:0; }
      .chat-message.md p { margin:0 0 7px; }
      .chat-message.md ul, .chat-message.md ol { margin:4px 0 7px; padding-left:20px; }
      .chat-message.md li { margin:2px 0; }
      .chat-message.md blockquote { margin:6px 0; padding:2px 10px; border-left:3px solid var(--border-strong); color:var(--text-mute); }
      .chat-message.md a { color:var(--info); text-decoration:underline; }
      .chat-message.md code { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; background:rgba(255,255,255,.07); padding:1px 5px; border-radius:5px; }
      .chat-message.md pre { margin:7px 0; padding:10px 12px; background:rgba(0,0,0,.32); border:1px solid var(--border); border-radius:10px; overflow-x:auto; }
      .chat-message.md pre code { display:block; background:none; padding:0; white-space:pre; line-height:1.5; }
      .chat-message.md table { border-collapse:collapse; margin:7px 0; font-size:12px; }
      .chat-message.md th, .chat-message.md td { border:1px solid var(--border); padding:4px 8px; }
      .chat-message.md hr { border:none; border-top:1px solid var(--border); margin:9px 0; }
      .chat-empty { margin:10px; padding:22px; border:1px dashed var(--border); border-radius:16px; background:rgba(255,255,255,.03); color:var(--text-mute); text-align:center; }
      .chat-empty strong { display:block; color:var(--text); font-size:14px; margin-bottom:5px; }
      .t-channel { border-left-color:var(--info); } .t-channel .type { color:var(--info); }
      .t-region { border-left-color:var(--good); } .t-region .type { color:var(--good); }
      .t-memory { border-left-color:var(--warn); } .t-memory .type { color:var(--warn); }
      .t-sched { border-left-color:var(--purple); } .t-sched .type { color:var(--purple); }
      .t-error { border-left-color:var(--bad); } .t-error .type { color:var(--bad); }
      .t-other { border-left-color:var(--text-dim); } .t-other .type { color:var(--text); }
      .ev.local { border-left-color:var(--accent); background:rgba(125,211,252,.08); }
      .ev.local .type { color:var(--accent); }
      .ev.activity { border-left-color:var(--good); background:rgba(52,211,153,.08); }
      .ev.prompt-options { border-left-color:var(--accent-2); background:rgba(167,139,250,.08); }
      .ev.prompt-options .type { color:var(--accent-2); }
      .prompt-note { margin-top:5px; color:var(--text-mute); font-size:11px; }
      .prompt-buttons { display:flex; flex-wrap:wrap; gap:7px; margin-top:9px; }
      .prompt-option-btn { background:var(--card); color:var(--text); border:1px solid var(--border-strong); border-radius:11px; padding:8px 13px; font-size:12px; font-weight:750; cursor:pointer; transition:background .12s, border-color .12s, transform .12s; }
      .prompt-option-btn:hover:not(:disabled) { background:var(--card-hover); border-color:var(--accent-2); transform:translateY(-1px); }
      .prompt-option-btn:disabled { opacity:.5; cursor:default; }
      .prompt-option-btn.picked { background:rgba(167,139,250,.18); border-color:var(--accent-2); color:var(--text); opacity:1; }
      .act-line { display:flex; align-items:center; gap:8px; padding:2px 0; }
      .act-badge { font-size:10px; font-weight:800; padding:2px 7px; border-radius:999px; text-transform:uppercase; letter-spacing:.04em; }
      .act-claude { background:rgba(52,211,153,.14); color:var(--good); } .act-codex { background:rgba(192,132,252,.16); color:var(--purple); } .act-openai { background:rgba(45,212,191,.14); color:var(--teal); } .act-other { background:var(--card); color:var(--text-mute); }
      .act-icon { font-size:13px; } .act-label { color:var(--text); font-weight:700; flex:none; } .act-meta { color:var(--text-dim); font-size:10px; margin-left:auto; white-space:nowrap; font-family:ui-monospace,"SF Mono",Menlo,monospace; flex:none; }
      .act-detail { color:var(--text-dim); font-size:10px; font-family:ui-monospace,"SF Mono",Menlo,monospace; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      .turn-card { padding:0; overflow:hidden; }
      .turn-head { display:flex; align-items:center; gap:8px; padding:8px 10px; cursor:pointer; user-select:none; }
      .turn-head:hover { background:rgba(255,255,255,.04); }
      .turn-caret { color:var(--text-dim); font-size:9px; width:10px; }
      .turn-thread { color:var(--text-mute); font-size:11px; font-family:ui-monospace,"SF Mono",Menlo,monospace; }
      .agent-badge { font-size:10px; font-weight:800; padding:2px 7px; border-radius:999px; background:rgba(167,139,250,.16); color:#c4b5fd; white-space:nowrap; }
      .turn-count { color:var(--text-dim); font-size:10px; margin-left:auto; }
      .turn-body { padding:2px 10px 8px 28px; }
      /* P3 축2 — 순차 스텝 그룹: 같은 턴의 스텝 리스트(접이식) + 답변 버블을 한 묶음으로. */
      .turn-group { margin:7px 0; }
      .turn-group > .turn-card { margin:0 0 6px; }
      /* 스텝 한 줄 = 클릭 가능(P4 사이드바 자리 예약). 진행 중엔 펼침, 완료 후 접힘. */
      .act-line.act-step { cursor:pointer; border-radius:8px; padding:3px 6px; }
      .act-line.act-step:hover { background:rgba(255,255,255,.05); }
      /* 채팅 패널 전용: 마지막 라벨 미리보기(접힘 시 헤더에 노출). */
      .turn-last { color:var(--text-dim); font-size:10px; font-style:italic; margin-left:8px; max-width:60%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
      body[data-chat-panel="log"] .turn-last { display:none; }
      /* 완료 표시(답변 도착 시 회색 점). */
      .turn-card.done .turn-count { color:var(--good); }
      /* 수동 접힘(.collapsed) = 두 패널 공통(기존 로그 패널 토글 보존). */
      .turn-card.collapsed .turn-body { display:none; }
      /* 완료 자동접힘(.done-collapsed) = 채팅 패널만. 로그 패널은 펼친 채 유지(회귀 0). */
      body[data-chat-panel="chat"] .turn-card.done-collapsed .turn-body { display:none; }
      /* 선택된 스텝 하이라이트(P4 마스터-디테일). */
      .act-line.act-step.selected { background:rgba(125,211,252,.16); box-shadow:inset 0 0 0 1px rgba(125,211,252,.4); }
      /* P5 L3 — 진행(타이핑) 버블: 델타 누적 중엔 평문 + 깜빡이는 커서, out 도착 시 마크다운 전체본으로 승격. */
      .chat-message.streaming::after { content:"▌"; color:var(--accent-2); animation:tg-cursor-blink 1s step-start infinite; margin-left:1px; }
      @keyframes tg-cursor-blink { 50% { opacity:0; } }
      /* P4 축3 — 스텝 클릭 → 상세 사이드바(마스터-디테일). #right 안에서 슬라이드 오버레이.
         기존 #right 용도(stream/chat)와 충돌 0: 닫혀 있으면 transform 으로 화면 밖, pointer-events 차단. */
      #step-detail {
        position:absolute; top:0; right:0; bottom:0; width:320px; max-width:86%;
        display:flex; flex-direction:column; background:var(--panel);
        border-left:1px solid var(--border-strong); box-shadow:-12px 0 30px rgba(0,0,0,.36);
        transform:translateX(100%); transition:transform .18s ease; z-index:8;
        pointer-events:none; visibility:hidden;
      }
      #right { position:relative; }
      body.step-detail-open #step-detail { transform:translateX(0); pointer-events:auto; visibility:visible; }
      .sd-head { display:flex; align-items:center; gap:8px; padding:13px 14px; border-bottom:1px solid var(--border); }
      .sd-head h3 { flex:1; }
      .sd-close { border:0; background:var(--card); color:var(--text-mute); cursor:pointer; border-radius:9px; width:26px; height:26px; font-size:14px; line-height:1; }
      .sd-close:hover { background:var(--card-hover); color:var(--text); }
      .sd-body { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:12px; }
      .sd-row { display:flex; flex-direction:column; gap:3px; }
      .sd-row .sd-k { font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-dim); font-weight:800; }
      .sd-row .sd-v { font-size:13px; color:var(--text); word-break:break-word; }
      .sd-detail { white-space:pre-wrap; font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:12px; line-height:1.5; color:var(--text); background:rgba(0,0,0,.28); border:1px solid var(--border); border-radius:10px; padding:10px 12px; }
      .sd-detail.empty { font-family:inherit; color:var(--text-mute); font-style:italic; background:transparent; border-style:dashed; }
      /* Step2 (2026-06-30) — 백그라운드 작업 드로어. #step-detail 슬라이드 패턴 차용.
         PC=우측 고정폭 드로어(웹앱식, 백드롭 없음·채팅 계속 보임), 모바일=넓게 슬라이드인+백드롭. */
      #bg-toggle { position:relative; border:1px solid var(--border); border-radius:11px; padding:7px 11px; background:rgba(255,255,255,.035); color:var(--text-mute); cursor:pointer; font-size:11px; font-weight:800; display:flex; align-items:center; gap:7px; white-space:nowrap; }
      #bg-toggle:hover { color:var(--text); background:var(--card-hover); }
      #bg-toggle .bg-badge { min-width:17px; height:17px; padding:0 5px; border-radius:9px; background:var(--accent-2); color:#04121f; font-size:10px; font-weight:900; display:none; align-items:center; justify-content:center; line-height:1; }
      #bg-toggle .bg-badge.show { display:inline-flex; }
      #bg-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:18; display:none; }
      #bg-panel {
        position:fixed; top:0; right:0; bottom:0; width:380px; max-width:88vw;
        display:flex; flex-direction:column; background:var(--panel);
        border-left:1px solid var(--border-strong); box-shadow:-14px 0 36px rgba(0,0,0,.4);
        transform:translateX(100%); transition:transform .2s ease; z-index:19;
        pointer-events:none; visibility:hidden;
      }
      body.bg-open #bg-panel { transform:translateX(0); pointer-events:auto; visibility:visible; }
      @media (max-width:900px) { body.bg-open #bg-backdrop { display:block; } }
      .bg-head { display:flex; align-items:center; gap:8px; padding:14px; border-bottom:1px solid var(--border); }
      .bg-head h3 { flex:1; margin:0; }
      .bg-list { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
      .bg-empty { color:var(--text-mute); font-style:italic; font-size:12px; padding:20px 6px; text-align:center; }
      .bg-job { border:1px solid var(--border); border-left:3px solid var(--text-dim); border-radius:12px; padding:10px 12px; background:var(--card); display:flex; flex-direction:column; gap:5px; }
      .bg-job.running { border-left-color:var(--accent-2); }
      .bg-job.done { border-left-color:#34d399; }
      .bg-job.failed { border-left-color:#f87171; }
      .bg-job.cancelled { border-left-color:var(--text-dim); opacity:.85; }
      .bg-job-top { display:flex; align-items:flex-start; gap:8px; }
      .bg-job-label { flex:1; font-weight:800; font-size:12px; color:var(--text); word-break:break-word; }
      .bg-job-status { font-size:10px; font-weight:800; white-space:nowrap; color:var(--text-mute); }
      .bg-job-meta { font-size:10px; color:var(--text-dim); font-family:ui-monospace,"SF Mono",Menlo,monospace; }
      .bg-job-err { font-size:11px; color:#fca5a5; word-break:break-word; }
      /* Step3 — 잡 카드 접이식 상세(작업 + 스텝 타임라인 + 결과). */
      .bg-job.has-detail .bg-job-top { cursor:pointer; }
      .bg-job-chev { font-size:10px; color:var(--text-dim); white-space:nowrap; user-select:none; }
      .bg-job-detail { display:none; flex-direction:column; gap:7px; margin-top:6px; border-top:1px solid var(--border); padding-top:8px; }
      .bg-job.open .bg-job-detail { display:flex; }
      .bg-job-task { font-size:11px; color:var(--text-mute); white-space:pre-wrap; word-break:break-word; line-height:1.45; }
      .bg-job-result { font-size:11px; color:var(--text); white-space:pre-wrap; word-break:break-word; line-height:1.5; max-height:240px; overflow-y:auto; background:rgba(0,0,0,.22); border:1px solid var(--border); border-radius:8px; padding:8px 10px; }
      .bg-job-steps { display:flex; flex-direction:column; gap:3px; }
      .bg-step { display:flex; align-items:baseline; gap:6px; font-size:11px; color:var(--text-mute); line-height:1.4; }
      .bg-step-icon { flex:none; font-size:10px; }
      .bg-step-label { font-weight:700; color:var(--text); flex:none; }
      .bg-step-detail { color:var(--text-dim); font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:10px; word-break:break-all; }
      #chat { border-top:1px solid var(--border); padding:12px; background:rgba(8,10,15,.42); }
      #chat-form { display:flex; gap:8px; }
      #chat-input { flex:1; min-width:0; background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:10px 11px; font-size:12px; }
      #chat-send { background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#061018; border:0; border-radius:12px; padding:10px 14px; font-weight:850; cursor:pointer; }
      #chat-send:disabled { filter:grayscale(1); opacity:.55; cursor:not-allowed; }
      #chat-status { color:var(--text-mute); font-size:10px; margin-top:6px; min-height:12px; }
      #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); z-index:50; max-width:90vw; padding:11px 16px; border-radius:13px; background:rgba(13,17,24,.96); border:1px solid var(--border-strong); box-shadow:var(--shadow); color:var(--text); font-size:12px; font-weight:700; opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; }
      #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
      #toast.warn { border-color:rgba(251,191,36,.45); } #toast.bad { border-color:rgba(251,113,133,.5); } #toast.good { border-color:rgba(52,211,153,.45); }
      .home-action.danger:hover { border-color:rgba(251,113,133,.4); }
      .home-action .ic.warn { color:var(--warn); }

      @media (max-width: 1440px) { main { grid-template-columns: 220px minmax(0,1fr); gap:12px; padding:12px; } }
      @media (max-width: 1180px) { main { grid-template-columns: 210px minmax(0,1fr); } }
      @media (max-width: 900px) {
        html, body { min-height:100%; overflow-x:hidden; overflow-y:auto; }
        header { position:sticky; top:0; z-index:20; height:46px; padding:0 12px; } header .sub, header .meter { display:none; }
        header .brand { font-size:15px; }
        #tab-bar { position:sticky; top:46px; z-index:19; display:flex; }
        #tab-bar .tab { padding:5px 4px; gap:1px; } #tab-bar .tab .ic { font-size:15px; } #tab-bar .tab .label { font-size:10px; }
        main { display:block; min-height:calc(100svh - 56px - 50px); height:auto; padding:0; overflow:visible; }
        #sidebar, #workbench, #right { display:none; width:100%; min-height:calc(100svh - 56px - 50px); height:auto; border:0; border-radius:0; box-shadow:none; overflow:visible; }
        body[data-tab="menu"] #sidebar { display:flex; }
        body[data-tab="main"] #workbench { display:block; }
        body[data-tab="chat"] #right { display:flex; }
        body[data-main="stream"][data-tab="main"] #workbench { display:none; }
        body[data-main="stream"][data-tab="chat"] #right { display:flex; }
        #sidebar { overflow:visible; padding-bottom:76px; }
        #providers-panel { border-right:0; height:auto; overflow:visible; }
        #detail-panel { height:auto; min-height:calc(100svh - 56px - 50px); overflow:visible; padding:14px 14px 70px; }
        #right { min-height:calc(100svh - 56px - 50px); }
        #stream { min-height:calc(100svh - 56px - 50px - 126px); overflow:visible; }
        .summary-grid { grid-template-columns:repeat(3,1fr); gap:8px; }
        .quick-grid, .provider-layout, .overview-layout { grid-template-columns:1fr; }
        .provider-grid { grid-template-columns:1fr; }
        .summary-card { padding:11px; } .summary-value { font-size:19px; }
        .detail-head { padding:15px; } .detail-name { font-size:19px; }
        .pi-summary { white-space:normal; }
        #chat-input { font-size:16px; }
        /* 모바일 채팅 — 헤더 작게(부제 숨김) + 본문만 스크롤. #right 를 뷰포트 높이(헤더56+
           탭바56=112 제외)로 묶고 #stream 만 내부 스크롤 → 스트림바·입력은 위/아래 고정,
           메시지만 흐른다. (page-scroll 모델에선 sticky 가 불안정해 내부 스크롤로 확정.) */
        #stream-bar { padding:7px 12px; gap:4px; }
        .chat-desc { display:none; }
        .chat-title { font-size:14px; }
        body[data-tab="chat"] #right { height:calc(100svh - 92px); min-height:0; overflow:hidden; }
        body[data-tab="chat"] #stream { overflow-y:auto; min-height:0; }
      }

    </style>
    <!-- vendored 마크다운 파서 (marked v4, 단일파일·외부 의존 0·CDN 0). 봇 답변 렌더에만 사용. -->

      <div class="bg-head">
        <h3 class="panel-title">백그라운드 작업</h3>
        <button class="sd-close" id="bg-close" type="button" aria-label="닫기" title="닫기">✕</button>
      </div>
      <div class="bg-list" id="bg-list">
        <div class="bg-empty" id="bg-empty">실행 중인 백그라운드 작업이 없습니다.</div>
      </div>
    </aside>
    <script>
      const CATEGORIES = ["channel", "external_plugin", "skill", "agent", "mcp"];
      const CATEGORY_LABEL = {
        channel: "채널",
        external_plugin: "플러그인",
        skill: "스킬",
        agent: "에이전트",
        mcp: "mcp",
      };
      const CATEGORY_ICON = {
        channel: "📡",
        external_plugin: "🔌",
        skill: "🛠",
        agent: "🤖",
        mcp: "🧩",
      };
      const LAYERS = ["meta_infra", "in_tree", "discovered"];
      const MAX_EVENTS = 200;
      const THREAD_KEY = "dashboard:default";

      let toastTimer = null;
      const showToast = (msg, tone) => {
        const el = document.getElementById("toast");
        if (!el) return;
        el.textContent = msg;
        el.className = "show" + (tone ? " " + tone : "");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { el.className = el.className.replace("show", "").trim(); }, 4200);
      };

      // 데몬 재시작 — POST /api/restart (bridge POST /restart, admin 토큰 server-side 주입).
      // 메시지 큐를 타지 않는 아웃오브밴드 제어라 턴이 멈춰도 동작. 오발 방지 확인 다이얼로그.
      let restartInFlight = false;
      const restartDaemon = async () => {
        if (restartInFlight) return;
        if (!window.confirm("데몬을 재시작할까요? 진행 중인 작업이 중단되고 잠시 후 자동 복귀합니다.")) return;
        restartInFlight = true;
        showToast("재시작 요청 중…", "warn");
        try {
          const r = await fetch("/api/restart", { method: "POST" });
          if (r.ok || r.status === 202) {
            showToast("재시작 중… 잠시 후 복귀합니다.", "good");
          } else {
            const data = await r.json().catch(() => ({}));
            showToast("재시작 실패: " + (data.error || ("HTTP " + r.status)), "bad");
          }
        } catch (err) {
          // 데몬이 즉시 종료되면 응답 전에 연결이 끊길 수 있음 — 정상 흐름으로 안내.
          showToast("재시작 신호 전송됨 (응답 끊김) — 잠시 후 복귀합니다.", "warn");
        } finally {
          setTimeout(() => { restartInFlight = false; }, 6000);
        }
      };

      const formatValue = (value) => {
        if (value === null || value === undefined) return "";
        if (typeof value === "object") return JSON.stringify(value);
        return String(value);
      };

      const appendKv = (root, data) => {
        const kv = document.createElement("div");
        kv.className = "kv";
        const entries = data && typeof data === "object" && !Array.isArray(data)
          ? Object.entries(data)
          : [["value", data]];
        for (const [key, value] of entries) {
          const k = document.createElement("div");
          k.className = "kv-key"; k.textContent = key;
          const v = document.createElement("div");
          v.className = "kv-val"; v.textContent = formatValue(value);
          kv.appendChild(k); kv.appendChild(v);
        }
        root.appendChild(kv);
      };

      const kindLabel = (kind) => {
        const map = {
          provider: "프로바이더",
          core: "코어",
          plugin: "플러그인",
          runtime: "런타임",
          system: "시스템",
          daemon: "데몬",
          memory: "메모리",
          schedule: "스케줄",
        };
        return map[kind] || kind || "프로바이더";
      };

      const statusLabel = (status) => {
        const map = { active: "정상", degraded: "주의", error: "오류", unknown: "알 수 없음" };
        return map[status] || status || "알 수 없음";
      };

      const dangerLabel = (danger) => {
        const map = { safe: "안전", gray: "확인 필요", danger: "위험" };
        return map[danger] || danger || "안전";
      };

      const isCoreProvider = (provider) => {
        const id = provider.id || "";
        const kind = provider.kind || "";
        return id.startsWith("core.") || kind === "core" || ["daemon", "memory", "schedule", "plugin-registry"].some((key) => id.includes(key));
      };

      const renderProviderView = (view) => {
        const div = document.createElement("div");
        div.className = "view";
        const title = document.createElement("div");
        title.className = "view-title";
        title.textContent = view.title || view.id || "화면";
        div.appendChild(title);
        const data = view.data || {};
        if (view.kind === "table" && Array.isArray(data.rows)) {
          const table = document.createElement("table");
          table.className = "provider-table";
          const columns = Array.isArray(data.columns) ? data.columns : [];
          const thead = document.createElement("thead");
          const hr = document.createElement("tr");
          for (const col of columns) {
            const th = document.createElement("th"); th.textContent = col;
            hr.appendChild(th);
          }
          thead.appendChild(hr); table.appendChild(thead);
          const tbody = document.createElement("tbody");
          for (const row of data.rows.slice(0, 20)) {
            const tr = document.createElement("tr");
            for (const col of columns) {
              const td = document.createElement("td");
              td.textContent = formatValue(row ? row[col] : "");
              tr.appendChild(td);
            }
            tbody.appendChild(tr);
          }
          table.appendChild(tbody); div.appendChild(table);
          if (data.rows.length > 20) {
            const more = document.createElement("div");
            more.className = "more"; more.textContent = "+ " + (data.rows.length - 20) + "개 행 더 있음";
            div.appendChild(more);
          }
        } else if (view.kind === "action-panel" && Array.isArray(data.actions)) {
          for (const action of data.actions) {
            const line = document.createElement("div");
            line.className = "action";
            const btn = document.createElement("button");
            btn.textContent = action.label || action.id;
            btn.disabled = true;
            const danger = document.createElement("span");
            danger.className = "danger-" + (action.danger || "safe");
            danger.textContent = dangerLabel(action.danger || "safe");
            line.appendChild(btn); line.appendChild(danger);
            div.appendChild(line);
          }
        } else {
          appendKv(div, data);
        }
        return div;
      };

      let providersCache = [];
      let inventoryCache = null;
      let selectedProviderId = null;
      let currentView = "overview";

      // 타임스탬프 — 로컬. 기존 toISOString().slice 는 UTC(한국이면 9h 어긋남)+밀리초였다.
      const tsPad = (n) => String(n).padStart(2, "0");
      // 메시지 버블 = 시각만(HH:MM:SS). 날짜는 날짜 구분선(date-divider)이 담당.
      const fmtTime = (ms) => {
        const d = new Date(ms);
        return `${tsPad(d.getHours())}:${tsPad(d.getMinutes())}:${tsPad(d.getSeconds())}`;
      };
      // 날짜 경계 판정 키(로컬 YYYY-MM-DD) + 구분선 표시 라벨(요일 포함).
      const dateKey = (ms) => {
        const d = new Date(ms);
        return `${d.getFullYear()}-${tsPad(d.getMonth() + 1)}-${tsPad(d.getDate())}`;
      };
      const fmtDate = (ms) => {
        const d = new Date(ms);
        const w = ["일", "월", "화", "수", "목", "금", "토"][d.getDay()];
        return `${dateKey(ms)} (${w})`;
      };

      const setActiveNav = (view) => {
        currentView = view;
        document.body.dataset.view = view;
        document.body.dataset.main = view === "chat" ? "stream" : "workbench";
        for (const btn of document.querySelectorAll(".nav-button")) {
          btn.classList.toggle("active", btn.dataset.view === view);
        }
      };

      const showOverview = () => {
        setActiveNav("overview");
        setChatPanel("chat");
        document.getElementById("workbench").classList.remove("show-providers");
        const root = document.getElementById("detail-panel");
        const active = providersCache.filter((p) => (p.status || "unknown") === "active").length;
        const degraded = providersCache.filter((p) => ["degraded", "error"].includes(p.status || "unknown")).length;
        const errors = providersCache.filter((p) => (p.status || "unknown") === "error").length;
        const invTotal = inventoryCache
          ? CATEGORIES.reduce((sum, cat) => sum + ((inventoryCache[cat] || []).length), 0)
          : "…";
        const healthClass = errors > 0 ? "bad" : degraded > 0 ? "warn" : "good";
        const healthText = errors > 0 ? "오류" : degraded > 0 ? "주의" : "정상";
        const healthDesc = providersCache.length === 0
          ? "프로바이더 정보를 불러오는 중입니다."
          : degraded > 0
            ? "점검이 필요한 프로바이더가 " + degraded + "개 있습니다."
            : "모든 프로바이더가 정상 상태입니다.";
        root.innerHTML = "";
        const wrap = document.createElement("div");
        wrap.className = "page-view overview";

        const hero = document.createElement("div");
        hero.className = "hero-card";
        hero.innerHTML = '<h1>오늘의 운영 상태</h1><p>자주 보는 상태와 다음 행동만 모았습니다. 자세한 런타임 정보는 프로바이더와 인벤토리에서 확인하세요.</p>';
        wrap.appendChild(hero);

        const quick = document.createElement("div");
        quick.className = "quick-grid";
        const metrics = [
          ["상태", healthText, healthDesc],
          ["프로바이더", String(providersCache.length), active + "개 정상"],
          ["이벤트", String(evCount), "채팅의 활동 로그에서 확인"],
        ];
        for (const [label, value, hint] of metrics) {
          const card = document.createElement("div");
          card.className = "quick-card";
          card.innerHTML = '<div class="quick-label">' + label + '</div><div class="quick-value">' + value + '</div><div class="quick-hint">' + hint + '</div>';
          quick.appendChild(card);
        }
        wrap.appendChild(quick);

        const layout = document.createElement("div");
        layout.className = "overview-layout";
        const statusPanel = document.createElement("section");
        statusPanel.className = "subpanel";
        statusPanel.innerHTML = '<div class="subpanel-head"><div><h2 class="subpanel-title">상태 요약</h2><p class="subpanel-desc">지금 확인해야 할 운영 신호입니다.</p></div><span class="health-pill ' + healthClass + '">' + healthText + '</span></div>';
        const statusList = document.createElement("div");
        statusList.className = "status-list";
        const rows = [
          [healthClass, "프로바이더 상태", healthDesc, active + "/" + providersCache.length],
          [localChatCount > 0 ? "good" : "warn", "대화", localChatCount > 0 ? "최근 대화가 대화 탭에 표시됩니다." : "아직 대화가 없습니다.", localChatCount + "개"],
          [inventoryCache ? "good" : "warn", "런타임 인벤토리", inventoryCache ? "채널·플러그인·스킬·에이전트를 불러왔습니다." : "인벤토리를 불러오는 중입니다.", String(invTotal)],
        ];
        for (const [tone, title, desc, meta] of rows) {
          const row = document.createElement("div");
          row.className = "status-row";
          row.innerHTML = '<span class="status-dot ' + tone + '"></span><div class="status-main"><div class="status-title">' + title + '</div><div class="status-desc">' + desc + '</div></div><span class="health-pill ' + tone + '">' + meta + '</span>';
          statusList.appendChild(row);
        }
        statusPanel.appendChild(statusList);
        layout.appendChild(statusPanel);

        const actionPanel = document.createElement("section");
        actionPanel.className = "subpanel";
        actionPanel.innerHTML = '<div class="subpanel-head"><div><h2 class="subpanel-title">빠른 이동</h2><p class="subpanel-desc">자주 쓰는 화면으로 바로 들어갑니다.</p></div></div>';
        const actions = document.createElement("div");
        actions.className = "home-actions";
        const actionData = [
          ["providers", "📦", "프로바이더 보기", "카테고리별 패널과 상세 상태 확인"],
          ["chat", "💬", "돌쇠와 대화", "대화와 활동 로그를 한 화면에서 확인"],
          ["inventory", "🧩", "런타임 인벤토리", "설치·발견된 capability 점검"],
          ["restart", "🔄", "데몬 재시작", "멈춘 작업까지 정리하고 자동 복귀"],
        ];
        for (const [view, icon, title, desc] of actionData) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "home-action" + (view === "restart" ? " danger" : "");
          const iconCls = view === "restart" ? "ic warn" : "ic";
          btn.innerHTML = '<span class="' + iconCls + '">' + icon + '</span><span><strong>' + title + '</strong><span>' + desc + '</span></span>';
          btn.addEventListener("click", () => {
            if (view === "providers") showProviders();
            else if (view === "chat") { setActiveNav("chat"); setChatPanel("chat"); setActiveTab("chat"); scrollChatToNewest(); document.getElementById("chat-input").focus(); }
            else if (view === "inventory") showInventory();
            else if (view === "restart") { restartDaemon(); return; }
            if (window.matchMedia("(max-width: 900px)").matches && view !== "chat") setActiveTab("main");
          });
          actions.appendChild(btn);
        }
        actionPanel.appendChild(actions);
        layout.appendChild(actionPanel);
        wrap.appendChild(layout);
        root.appendChild(wrap);
      };

      const showInventory = () => {
        setActiveNav("inventory");
        setChatPanel("chat");
        document.getElementById("workbench").classList.remove("show-providers");
        const root = document.getElementById("detail-panel");
        root.innerHTML = "";
        const wrap = document.createElement("div");
        wrap.className = "page-view";
        wrap.innerHTML = '<div class="detail-head"><div class="detail-accent active"></div><div class="detail-name">런타임 인벤토리</div><span class="detail-kind">관리</span></div><p class="developer-copy">설치/발견된 채널, 플러그인, 스킬, 에이전트, MCP를 확인하는 관리용 레지스트리입니다. 평소 작업 흐름에서는 숨겨둡니다.</p><div id="inventory" class="inventory-shell"><div class="empty">불러오는 중…</div></div>';
        root.appendChild(wrap);
        if (inventoryCache) renderInventory(inventoryCache);
      };

      const showSettings = () => {
        setActiveNav("settings");
        setChatPanel("chat");
        document.getElementById("workbench").classList.remove("show-providers");
        const root = document.getElementById("detail-panel");
        root.innerHTML = '<div class="page-view"><div class="detail-head"><div class="detail-accent"></div><div class="detail-name">설정</div><span class="detail-kind">준비 중</span></div><div class="empty">설정 화면은 다음 단계에서 연결합니다.</div></div>';
      };

      const showProviders = () => {
        setActiveNav("providers");
        setChatPanel("chat");
        document.getElementById("workbench").classList.remove("show-providers");
        if (!selectedProviderId && providersCache.length > 0) selectedProviderId = providersCache[0].id;
        renderProviderHub();
      };

      const renderProviderCard = (provider) => {
        const status = provider.status || "unknown";
        const card = document.createElement("button");
        card.type = "button";
        card.className = "provider-card s-" + status + (provider.id === selectedProviderId ? " selected" : "");
        const caps = Array.isArray(provider.capabilities) ? provider.capabilities : [];
        card.innerHTML = '<div class="provider-card-head"><span class="provider-card-name">' + (provider.name || provider.id) + '</span><span class="provider-card-kind">' + kindLabel(provider.kind) + '</span><span class="pi-status-dot ' + status + '"></span></div><div class="provider-card-summary">' + (provider.summary || "상태 정보 없음") + '</div>';
        const meta = document.createElement("div");
        meta.className = "provider-card-meta";

      const renderedMsgKeys = new Set();

      // ── P4 축3 — 스텝 클릭 → 상세 사이드바(마스터-디테일) ─────────────────

      // ── Step2/3 (2026-06-30) — 백그라운드 작업 드로어 + 잡 카드 + 스텝 타임라인 ──
      // worker.* lifecycle(Step1)로 잡 카드 생성·상태(payload.status: running/done/failed/

      // 토글 드로어(PC 우측 고정·모바일 슬라이드인+백드롭). 배지 = 실행 중 잡 수.
      const bgPanel = document.getElementById("bg-panel");

      const jobCards = new Map(); // jobId -> { el, labelEl, statusEl, chevEl, stepsEl, errEl, status, stepCount }
      const openBg = () => { document.body.classList.add("bg-open"); bgPanel.setAttribute("aria-hidden", "false"); };
