    <script>
      const CATEGORIES = ["channel", "external_plugin", "skill", "agent", "mcp"];
      const CATEGORY_LABEL = {
        channel: "채널",
        external_plugin: "플러그인",
        skill: "스킬",
        agent: "에이전트",
        mcp: "mcp",
      };
      const CATEGORY_ICON = {
        channel: "📡",
        external_plugin: "🔌",
        skill: "🛠",
        agent: "🤖",
        mcp: "🧩",
      };
      const LAYERS = ["meta_infra", "in_tree", "discovered"];
      const MAX_EVENTS = 200;
      const THREAD_KEY = "dashboard:default";

      let toastTimer = null;
      const showToast = (msg, tone) => {
        const el = document.getElementById("toast");
        if (!el) return;
        el.textContent = msg;
        el.className = "show" + (tone ? " " + tone : "");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => { el.className = el.className.replace("show", "").trim(); }, 4200);
      };

      // 데몬 재시작 — POST /api/restart (bridge POST /restart, admin 토큰 server-side 주입).
      // 메시지 큐를 타지 않는 아웃오브밴드 제어라 턴이 멈춰도 동작. 오발 방지 확인 다이얼로그.
      let restartInFlight = false;
      const restartDaemon = async () => {
        if (restartInFlight) return;
        if (!window.confirm("데몬을 재시작할까요? 진행 중인 작업이 중단되고 잠시 후 자동 복귀합니다.")) return;
        restartInFlight = true;
        showToast("재시작 요청 중…", "warn");
        try {
          const r = await fetch("/api/restart", { method: "POST" });
          if (r.ok || r.status === 202) {
            showToast("재시작 중… 잠시 후 복귀합니다.", "good");
          } else {
            const data = await r.json().catch(() => ({}));
            showToast("재시작 실패: " + (data.error || ("HTTP " + r.status)), "bad");
          }
        } catch (err) {
          // 데몬이 즉시 종료되면 응답 전에 연결이 끊길 수 있음 — 정상 흐름으로 안내.
          showToast("재시작 신호 전송됨 (응답 끊김) — 잠시 후 복귀합니다.", "warn");
        } finally {
          setTimeout(() => { restartInFlight = false; }, 6000);
        }
      };

      const formatValue = (value) => {
        if (value === null || value === undefined) return "";
        if (typeof value === "object") return JSON.stringify(value);
        return String(value);
      };

      const appendKv = (root, data) => {
        const kv = document.createElement("div");
        kv.className = "kv";
        const entries = data && typeof data === "object" && !Array.isArray(data)
          ? Object.entries(data)
          : [["value", data]];
        for (const [key, value] of entries) {
          const k = document.createElement("div");
          k.className = "kv-key"; k.textContent = key;
          const v = document.createElement("div");
          v.className = "kv-val"; v.textContent = formatValue(value);
          kv.appendChild(k); kv.appendChild(v);
        }
        root.appendChild(kv);
      };

      const kindLabel = (kind) => {
        const map = {
          provider: "프로바이더",
          core: "코어",
          plugin: "플러그인",
          runtime: "런타임",
          system: "시스템",
          daemon: "데몬",
          memory: "메모리",
          schedule: "스케줄",
        };
        return map[kind] || kind || "프로바이더";
      };

      const statusLabel = (status) => {
        const map = { active: "정상", degraded: "주의", error: "오류", unknown: "알 수 없음" };
        return map[status] || status || "알 수 없음";
      };

      const dangerLabel = (danger) => {
        const map = { safe: "안전", gray: "확인 필요", danger: "위험" };
        return map[danger] || danger || "안전";
      };

      const isCoreProvider = (provider) => {
        const id = provider.id || "";
        const kind = provider.kind || "";
        return id.startsWith("core.") || kind === "core" || ["daemon", "memory", "schedule", "plugin-registry"].some((key) => id.includes(key));
      };

      const renderProviderView = (view) => {
        const div = document.createElement("div");
        div.className = "view";
        const title = document.createElement("div");
        title.className = "view-title";
        title.textContent = view.title || view.id || "화면";
        div.appendChild(title);
        const data = view.data || {};
        if (view.kind === "table" && Array.isArray(data.rows)) {
          const table = document.createElement("table");
          table.className = "provider-table";
          const columns = Array.isArray(data.columns) ? data.columns : [];
          const thead = document.createElement("thead");
          const hr = document.createElement("tr");
          for (const col of columns) {
            const th = document.createElement("th"); th.textContent = col;
            hr.appendChild(th);
          }
          thead.appendChild(hr); table.appendChild(thead);
          const tbody = document.createElement("tbody");
          for (const row of data.rows.slice(0, 20)) {
            const tr = document.createElement("tr");
            for (const col of columns) {
              const td = document.createElement("td");
              td.textContent = formatValue(row ? row[col] : "");
              tr.appendChild(td);
            }
            tbody.appendChild(tr);
          }
          table.appendChild(tbody); div.appendChild(table);
          if (data.rows.length > 20) {
            const more = document.createElement("div");
            more.className = "more"; more.textContent = "+ " + (data.rows.length - 20) + "개 행 더 있음";
            div.appendChild(more);
          }
        } else if (view.kind === "action-panel" && Array.isArray(data.actions)) {
          for (const action of data.actions) {
            const line = document.createElement("div");
            line.className = "action";
            const btn = document.createElement("button");
            btn.textContent = action.label || action.id;
            btn.disabled = true;
            const danger = document.createElement("span");
            danger.className = "danger-" + (action.danger || "safe");
            danger.textContent = dangerLabel(action.danger || "safe");
            line.appendChild(btn); line.appendChild(danger);
            div.appendChild(line);
          }
        } else {
          appendKv(div, data);
        }
        return div;
      };

      let providersCache = [];
      let inventoryCache = null;
      let assistantName = "tiguclaw"; // 비서 표시 이름(AGENT.md 이름 → chat-history 응답, 폴백 tiguclaw).
      let selectedProviderId = null;
      let currentView = "overview";

      // 타임스탬프 — 로컬. 기존 toISOString().slice 는 UTC(한국이면 9h 어긋남)+밀리초였다.
      const tsPad = (n) => String(n).padStart(2, "0");
      // 메시지 버블 = 시각만(HH:MM:SS). 날짜는 날짜 구분선(date-divider)이 담당.
      const fmtTime = (ms) => {
        const d = new Date(ms);
        return `${tsPad(d.getHours())}:${tsPad(d.getMinutes())}:${tsPad(d.getSeconds())}`;
      };
      // 날짜 경계 판정 키(로컬 YYYY-MM-DD) + 구분선 표시 라벨(요일 포함).
      const dateKey = (ms) => {
        const d = new Date(ms);
        return `${d.getFullYear()}-${tsPad(d.getMonth() + 1)}-${tsPad(d.getDate())}`;
      };
      const fmtDate = (ms) => {
        const d = new Date(ms);
        const w = ["일", "월", "화", "수", "목", "금", "토"][d.getDay()];
        return `${dateKey(ms)} (${w})`;
      };

      const setActiveNav = (view) => {
        currentView = view;
        document.body.dataset.view = view;
        document.body.dataset.main = view === "chat" ? "stream" : "workbench";
        for (const btn of document.querySelectorAll(".nav-button")) {
          btn.classList.toggle("active", btn.dataset.view === view);
        }
      };

      const showOverview = () => {
        setActiveNav("overview");
        setChatPanel("chat");
        document.getElementById("workbench").classList.remove("show-providers");
        const root = document.getElementById("detail-panel");
        const active = providersCache.filter((p) => (p.status || "unknown") === "active").length;
        const degraded = providersCache.filter((p) => ["degraded", "error"].includes(p.status || "unknown")).length;
        const errors = providersCache.filter((p) => (p.status || "unknown") === "error").length;
        const invTotal = inventoryCache
          ? CATEGORIES.reduce((sum, cat) => sum + ((inventoryCache[cat] || []).length), 0)
          : "…";
        const healthClass = errors > 0 ? "bad" : degraded > 0 ? "warn" : "good";
        const healthText = errors > 0 ? "오류" : degraded > 0 ? "주의" : "정상";
        const healthDesc = providersCache.length === 0
          ? "프로바이더 정보를 불러오는 중입니다."
          : degraded > 0
            ? "점검이 필요한 프로바이더가 " + degraded + "개 있습니다."
            : "모든 프로바이더가 정상 상태입니다.";
        root.innerHTML = "";
        const wrap = document.createElement("div");
        wrap.className = "page-view overview";

        const hero = document.createElement("div");
        hero.className = "hero-card";
        hero.innerHTML = '<h1>오늘의 운영 상태</h1><p>자주 보는 상태와 다음 행동만 모았습니다. 자세한 런타임 정보는 프로바이더와 인벤토리에서 확인하세요.</p>';
        wrap.appendChild(hero);

        const quick = document.createElement("div");
        quick.className = "quick-grid";
        const metrics = [
          ["상태", healthText, healthDesc],
          ["프로바이더", String(providersCache.length), active + "개 정상"],
          ["이벤트", String(evCount), "채팅의 활동 로그에서 확인"],
        ];
        for (const [label, value, hint] of metrics) {
          const card = document.createElement("div");
          card.className = "quick-card";
          card.innerHTML = '<div class="quick-label">' + label + '</div><div class="quick-value">' + value + '</div><div class="quick-hint">' + hint + '</div>';
          quick.appendChild(card);
        }
        wrap.appendChild(quick);

        const layout = document.createElement("div");
        layout.className = "overview-layout";
        const statusPanel = document.createElement("section");
        statusPanel.className = "subpanel";
        statusPanel.innerHTML = '<div class="subpanel-head"><div><h2 class="subpanel-title">상태 요약</h2><p class="subpanel-desc">지금 확인해야 할 운영 신호입니다.</p></div><span class="health-pill ' + healthClass + '">' + healthText + '</span></div>';
        const statusList = document.createElement("div");
        statusList.className = "status-list";
        const rows = [
          [healthClass, "프로바이더 상태", healthDesc, active + "/" + providersCache.length],
          [localChatCount > 0 ? "good" : "warn", "대화", localChatCount > 0 ? "최근 대화가 대화 탭에 표시됩니다." : "아직 대화가 없습니다.", localChatCount + "개"],
          [inventoryCache ? "good" : "warn", "런타임 인벤토리", inventoryCache ? "채널·플러그인·스킬·에이전트를 불러왔습니다." : "인벤토리를 불러오는 중입니다.", String(invTotal)],
        ];
        for (const [tone, title, desc, meta] of rows) {
          const row = document.createElement("div");
          row.className = "status-row";
          row.innerHTML = '<span class="status-dot ' + tone + '"></span><div class="status-main"><div class="status-title">' + title + '</div><div class="status-desc">' + desc + '</div></div><span class="health-pill ' + tone + '">' + meta + '</span>';
          statusList.appendChild(row);
        }
        statusPanel.appendChild(statusList);
        layout.appendChild(statusPanel);

        const actionPanel = document.createElement("section");
        actionPanel.className = "subpanel";
        actionPanel.innerHTML = '<div class="subpanel-head"><div><h2 class="subpanel-title">빠른 이동</h2><p class="subpanel-desc">자주 쓰는 화면으로 바로 들어갑니다.</p></div></div>';
        const actions = document.createElement("div");
        actions.className = "home-actions";
        const actionData = [
          ["providers", "📦", "프로바이더 보기", "카테고리별 패널과 상세 상태 확인"],
          ["chat", "💬", assistantName + "와 대화", "대화와 활동 로그를 한 화면에서 확인"],
          ["inventory", "🧩", "런타임 인벤토리", "설치·발견된 capability 점검"],
          ["restart", "🔄", "데몬 재시작", "멈춘 작업까지 정리하고 자동 복귀"],
        ];
        for (const [view, icon, title, desc] of actionData) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "home-action" + (view === "restart" ? " danger" : "");
          const iconCls = view === "restart" ? "ic warn" : "ic";
          btn.innerHTML = '<span class="' + iconCls + '">' + icon + '</span><span><strong>' + title + '</strong><span>' + desc + '</span></span>';
          btn.addEventListener("click", () => {
            if (view === "providers") showProviders();
            else if (view === "chat") { setActiveNav("chat"); setChatPanel("chat"); setActiveTab("chat"); scrollChatToNewest(); document.getElementById("chat-input").focus(); }
            else if (view === "inventory") showInventory();
            else if (view === "restart") { restartDaemon(); return; }
            if (window.matchMedia("(max-width: 900px)").matches && view !== "chat") setActiveTab("main");
          });
          actions.appendChild(btn);
        }
        actionPanel.appendChild(actions);
        layout.appendChild(actionPanel);
        wrap.appendChild(layout);
        root.appendChild(wrap);
      };

      const showInventory = () => {
        setActiveNav("inventory");
        setChatPanel("chat");
        document.getElementById("workbench").classList.remove("show-providers");
        const root = document.getElementById("detail-panel");
        root.innerHTML = "";
        const wrap = document.createElement("div");
        wrap.className = "page-view";
        wrap.innerHTML = '<div class="detail-head"><div class="detail-accent active"></div><div class="detail-name">런타임 인벤토리</div><span class="detail-kind">관리</span></div><p class="developer-copy">설치/발견된 채널, 플러그인, 스킬, 에이전트, MCP를 확인하는 관리용 레지스트리입니다. 평소 작업 흐름에서는 숨겨둡니다.</p><div id="inventory" class="inventory-shell"><div class="empty">불러오는 중…</div></div>';
        root.appendChild(wrap);
        if (inventoryCache) renderInventory(inventoryCache);
      };

      const showSettings = () => {
        setActiveNav("settings");
        setChatPanel("chat");
        document.getElementById("workbench").classList.remove("show-providers");
        const root = document.getElementById("detail-panel");
        root.innerHTML = '<div class="page-view"><div class="detail-head"><div class="detail-accent"></div><div class="detail-name">설정</div><span class="detail-kind">준비 중</span></div><div class="empty">설정 화면은 다음 단계에서 연결합니다.</div></div>';
      };

      // ── 에이전트 뷰(왼쪽 nav 1급 destination) ──────────────────────────────
      // 오른쪽 백그라운드 드로어와 "동일한" jobCards 데이터를 읽어 크게 렌더한다(별도 데이터
      // 모델·엔드포인트 없음). 진행 중/전체 토글·경과시간·마지막 스텝 로직 재사용. worker.*
      // lifecycle / llm.activity(worker:|agent:) 가 들어올 때마다 renderAgentsView 가 (뷰가
      // 열려 있으면) 목록을 jobCards 스냅샷으로 다시 그린다. capBgList 로 카드가 정리되면 여기서도 사라진다.
      let agentsFilter = "running"; // "running" | "all" — 오른쪽 드로어 필터와 독립(각자 뷰).
      const agentElapsedEls = new Map(); // jobId -> elapsed span (틱 갱신용, 뷰 재렌더마다 재구성).
      const AGENT_KIND_BADGE = { agent: "🤖 서브에이전트", worker: "📦 워커" };
      // 카운트/빈상태 동기화 — refreshBgBadge 가 매 이벤트마다 호출(뷰 안 열려도 안전).
      const syncAgentsCounts = (running, total) => {
        const rc = document.getElementById("agents-count-running");
        const ac = document.getElementById("agents-count-all");
        if (rc) rc.textContent = String(running);
        if (ac) ac.textContent = String(total);
      };
      // 잡 카드 1개 빌드(공유) — 에이전트 뷰 + 프로젝트 상세가 동일 카드를 재사용(단일 소스).
      // elapsedRegistry 에 running 카드의 경과 span 을 등록(호출자별 틱 맵). jobCards entry(e)
      // 를 그대로 읽어 상태·티어·작업요약·현재 스텝·펼침 상세까지 동일 렌더.
      const buildAgentCard = (jobId, e, now, elapsedRegistry) => {
        const card = document.createElement("div");
        card.className = "agent-card " + (e.status || "running") + (e.kind === "agent" ? " agent" : "");
        card.dataset.jobId = jobId;
        const top = document.createElement("div"); top.className = "agent-card-top";
        const kind = document.createElement("span"); kind.className = "agent-card-kind";
        kind.textContent = AGENT_KIND_BADGE[e.kind === "agent" ? "agent" : "worker"];
        top.appendChild(kind);
        if (e.kind === "agent" && e.modelTier) {
          const tier = String(e.modelTier).trim();
          if (tier !== "" && tier.toLowerCase() !== "default") {
            const tierEl = document.createElement("span");
            tierEl.className = "agent-card-tier";
            tierEl.dataset.tier = tier.toLowerCase();
            tierEl.textContent = tier;
            top.appendChild(tierEl);
          }
        }
        const st = document.createElement("span"); st.className = "agent-card-status";
        st.textContent = BG_STATUS[e.status] || e.status || "";
        top.appendChild(st);
        const name = document.createElement("div"); name.className = "agent-card-name";
        name.textContent = (e.labelEl && e.labelEl.textContent) || "(작업)";
        card.appendChild(top); card.appendChild(name);
        if (e.task) {
          const summary = document.createElement("div"); summary.className = "agent-card-summary";
          summary.textContent = e.task;
          card.appendChild(summary);
        }
        const meta = document.createElement("div"); meta.className = "agent-card-meta";
        const el = document.createElement("span"); el.className = "agent-card-elapsed";
        el.textContent = fmtElapsed(now - (e.startTs || now));
        if (e.status === "running" && elapsedRegistry) elapsedRegistry.set(jobId, el);
        meta.appendChild(el);
        const hasDetail = !!(e.task || e.result || e.errorText || e.stepCount > 0);
        let chev = null;
        if (hasDetail) {
          chev = document.createElement("span"); chev.className = "agent-card-chev";
          chev.textContent = e.expanded ? "▾ 접기" : "▸ 자세히";
          meta.appendChild(chev);
        }
        card.appendChild(meta);
        if (e.lastStep) {
          const step = document.createElement("div"); step.className = "agent-card-step";
          const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = "지금";
          const val = document.createElement("span"); val.textContent = e.lastStep;
          step.appendChild(lbl); step.appendChild(val);
          card.appendChild(step);
        }
        if (hasDetail) {
          const detail = document.createElement("div"); detail.className = "agent-card-detail";
          if (e.task) {
            const t = document.createElement("div"); t.className = "agent-card-detail-block";
            const h = document.createElement("div"); h.className = "acd-label"; h.textContent = "작업";
            const b = document.createElement("div"); b.className = "acd-body"; b.textContent = e.task;
            t.appendChild(h); t.appendChild(b); detail.appendChild(t);
          }
          if (e.result) {
            const r = document.createElement("div"); r.className = "agent-card-detail-block";
            const h = document.createElement("div"); h.className = "acd-label"; h.textContent = "결과";
            const b = document.createElement("div"); b.className = "acd-body result"; b.textContent = e.result;
            r.appendChild(h); r.appendChild(b); detail.appendChild(r);
          }
          if (e.errorText) {
            const er = document.createElement("div"); er.className = "agent-card-detail-block";
            const h = document.createElement("div"); h.className = "acd-label"; h.textContent = "에러";
            const b = document.createElement("div"); b.className = "acd-body error"; b.textContent = e.errorText;
            er.appendChild(h); er.appendChild(b); detail.appendChild(er);
          }
          if (e.stepCount > 0 && e.stepsEl) {
            const s = document.createElement("div"); s.className = "agent-card-detail-block";
            const h = document.createElement("div"); h.className = "acd-label"; h.textContent = "단계 (" + e.stepCount + ")";
            const stepsClone = e.stepsEl.cloneNode(true);
            s.appendChild(h); s.appendChild(stepsClone); detail.appendChild(s);
          }
          card.appendChild(detail);
          if (e.expanded) card.classList.add("open");
          card.style.cursor = "pointer";
          card.addEventListener("click", () => {
            e.expanded = !e.expanded;
            card.classList.toggle("open", e.expanded);
            if (chev) chev.textContent = e.expanded ? "▾ 접기" : "▸ 자세히";
          });
        }
        return card;
      };

      // jobCards → 에이전트 그리드 렌더. 뷰가 열려 있지 않으면 즉시 반환(no-op).
      const renderAgentsView = () => {
        if (currentView !== "agents") return;
        const grid = document.getElementById("agents-grid");
        const empty = document.getElementById("agents-empty");
        if (!grid) return;
        grid.innerHTML = "";
        agentElapsedEls.clear();
        const now = Date.now();
        let running = 0, total = 0, shown = 0;
        // 최신 먼저(삽입 순서 역순) — jobCards 는 삽입 순. 진행 중을 위로 정렬(진행 중 우선).
        const entries = [...jobCards.entries()];
        entries.sort((a, b) => {
          const ra = a[1].status === "running" ? 0 : 1;
          const rb = b[1].status === "running" ? 0 : 1;
          if (ra !== rb) return ra - rb;
          return (b[1].startTs || 0) - (a[1].startTs || 0);
        });
        for (const [jobId, e] of entries) {
          total += 1;
          if (e.status === "running") running += 1;
          if (agentsFilter === "running" && e.status !== "running") continue;
          shown += 1;
          const card = buildAgentCard(jobId, e, now, agentElapsedEls);
          grid.appendChild(card);
        }
        syncAgentsCounts(running, total);
        if (empty) {
          empty.style.display = shown === 0 ? "" : "none";
          empty.textContent = agentsFilter === "running"
            ? "진행 중인 에이전트가 없습니다."
            : "실행된 에이전트가 없습니다.";
        }
      };
      // 렌더 throttle — llm.activity/lifecycle 이 초당 여러 개 쏟아질 때 renderAgentsView 가
      // 매번 grid 전체를 innerHTML="" 후 재구성하면 버벅인다. requestAnimationFrame 으로
      // 프레임당 1회로 coalesce(스트림 폭주 → 부드럽게). 뷰 닫혀있으면 큐잉도 안 함.
      let agentsRenderQueued = false;
      const scheduleAgentsRender = () => {
        if (currentView !== "agents" || agentsRenderQueued) return;
        agentsRenderQueued = true;
        requestAnimationFrame(() => {
          agentsRenderQueued = false;
          renderAgentsView();
        });
      };
      const setAgentsFilter = (mode) => {
        agentsFilter = mode === "all" ? "all" : "running";
        const bar = document.getElementById("agents-filter");
        if (bar) for (const b of bar.querySelectorAll(".bg-fbtn")) {
          const on = b.dataset.filter === agentsFilter;
          b.classList.toggle("active", on);
          b.setAttribute("aria-pressed", on ? "true" : "false");
        }
        // ★ grid 의 filter-running CSS 클래스도 토글해야 함 — 안 그러면 "전체" 로 바꿔도
        // CSS `.filter-running .agent-card:not(.running){display:none}` 가 done 카드를 계속
        // 숨겨 카운트만 나오고 화면은 빈다(버그). renderAgentsView 의 JS 필터와 CSS 를 일치.
        const grid = document.getElementById("agents-grid");
        if (grid) grid.classList.toggle("filter-running", agentsFilter === "running");
        renderAgentsView();
      };
      const showAgents = () => {
        setActiveNav("agents");
        setChatPanel("chat");
        document.getElementById("workbench").classList.remove("show-providers");
        const root = document.getElementById("detail-panel");
        root.innerHTML = "";
        const wrap = document.createElement("div");
        wrap.className = "page-view agents-view";
        wrap.innerHTML =
          '<div class="detail-head"><div class="detail-accent active"></div><div class="detail-name">에이전트</div><span class="detail-kind">실시간</span></div>' +
          '<p class="developer-copy">지금 돌고 있는 백그라운드 작업(워커 📦 + 서브에이전트 🤖)을 한눈에. 종류·이름·경과시간·현재 스텝을 실시간으로 표시합니다.</p>' +
          '<div class="agents-toolbar"><div class="bg-filter" id="agents-filter">' +
          '<button class="bg-fbtn active" type="button" data-filter="running" aria-pressed="true">진행 중 <span class="bg-fcount" id="agents-count-running">0</span></button>' +
          '<button class="bg-fbtn" type="button" data-filter="all" aria-pressed="false">전체 <span class="bg-fcount" id="agents-count-all">0</span></button>' +
          '</div><span class="agents-hint">라이브 · 오른쪽 드로어와 동일 소스</span></div>' +
          '<div class="agents-grid filter-running" id="agents-grid"></div>' +
          '<div class="empty" id="agents-empty">진행 중인 에이전트가 없습니다.</div>';
        root.appendChild(wrap);
        // filter=running 클래스는 CSS 보조(카드 렌더 자체가 필터). 토글 버튼 바인딩.
        const bar = wrap.querySelector("#agents-filter");
        for (const b of bar.querySelectorAll(".bg-fbtn")) {
          b.addEventListener("click", () => setAgentsFilter(b.dataset.filter));
        }
        agentsFilter = "running";
        renderAgentsView();
      };

      // ── 프로젝트 뷰(왼쪽 nav 1급 destination — 축3 마스터-디테일) ──────────────
      // GET /api/projects → 그리드 카드(name·status 배지·설명 일부). 카드 클릭 → 뷰 내부
      // 오른쪽 상세 패널에 GET /api/projects/detail?path= 를 렌더(설명 본문 마크다운 +
      // 전용 스킬/에이전트 + related 클릭 이동). 새 프레임워크 0 — 기존 fetch/renderMarkdown 재사용.
      const PROJECT_STATUS_LABEL = { active: "진행 중", paused: "보류", done: "완료" };
      let projectsCache = [];
      let selectedProjectPath = null;

      const showProjects = () => {
        setActiveNav("projects");
        setChatPanel("chat");
        document.getElementById("workbench").classList.remove("show-providers");
        const root = document.getElementById("detail-panel");
        root.innerHTML = "";
        const wrap = document.createElement("div");
        wrap.className = "page-view projects-view";
        wrap.innerHTML =
          '<div class="detail-head"><div class="detail-accent active"></div><div class="detail-name">프로젝트</div><span class="detail-kind">레지스트리</span></div>' +
          '<p class="developer-copy">등록된 프로젝트(폴더 + PROJECT.md)를 카드로 봅니다. 카드를 누르면 오른쪽에 설명·전용 스킬/에이전트·연관 프로젝트가 열립니다.</p>' +
          '<div class="projects-split no-detail" id="projects-split">' +
          '<div class="projects-grid" id="projects-grid"><div class="empty">불러오는 중…</div></div>' +
          '</div>';
        root.appendChild(wrap);
        selectedProjectPath = null;
        fetchProjects();
      };

      const fetchProjects = async () => {
        try {
          const r = await fetch("/api/projects");
          const data = await r.json();
          projectsCache = Array.isArray(data) ? data : [];
        } catch (e) {
          projectsCache = [];
        }
        const nav = document.getElementById("nav-project-count");
        if (nav) nav.textContent = String(projectsCache.length);
        if (currentView === "projects") renderProjectsGrid();
        renderContextTags(); // 입력창 위 컨텍스트 태그 바 갱신.
      };

      // ── 컨텍스트 태그 바 ─────────────────────────────────────────────────
      // 등록 프로젝트를 칩으로. 클릭 시 `#<이름>` 태그를 입력창에 껴넣어 "그 프로젝트 얘기"임을
      // 티구클로가 바로 알게 한다(SYSTEM.md 텍스트 컨벤션 — 채널·LLM 무관). 최근 클릭 순 정렬.
      const CTX_RECENT_KEY = "tgctx_recent";
      const ctxRecent = () => { try { return JSON.parse(localStorage.getItem(CTX_RECENT_KEY) || "[]"); } catch { return []; } };
      const ctxBumpRecent = (name) => {
        try { const r = ctxRecent().filter((n) => n !== name); r.unshift(name); localStorage.setItem(CTX_RECENT_KEY, JSON.stringify(r.slice(0, 30))); } catch {}
      };
      const ctxUnlearn = (name) => { // 학습 칩 제거 — recent 에서 뺀다.
        try { localStorage.setItem(CTX_RECENT_KEY, JSON.stringify(ctxRecent().filter((n) => n !== name))); } catch {}
        renderContextTags();
      };
      // 해석 가능한 태그 이름 집합 = 등록 프로젝트 ∪ 인벤토리 스킬·에이전트. 실제 뭔가를 가리키는지 표시용.
      const resolvableNames = () => {
        const s = new Set();
        for (const p of (Array.isArray(projectsCache) ? projectsCache : [])) if (p && p.name) s.add(p.name);
        const inv = inventoryCache || {};
        for (const cat of ["skill", "agent"]) for (const it of (inv[cat] || [])) if (it && it.name) s.add(it.name);
        return s;
      };
      // 칩 클릭 = 입력창에서 그 태그 토글(없으면 삽입, 있으면 제거 → "현재 걸린 태그도 지움").
      const insertContextTag = (name) => {
        const ta = document.getElementById("chat-input");
        if (!ta) return;
        const core = "#" + name;
        if (ta.value.includes(core)) {
          // 제거 — "#name " 우선, 없으면 "#name". 이중 공백 정리.
          ta.value = ta.value.split(core + " ").join("").split(core).join("").replace(/[ \t]{2,}/g, " ").replace(/^\s+/, "");
        } else {
          const tag = core + " ";
          const s = ta.selectionStart != null ? ta.selectionStart : ta.value.length;
          const e = ta.selectionEnd != null ? ta.selectionEnd : ta.value.length;
          ta.value = ta.value.slice(0, s) + tag + ta.value.slice(e);
          const pos = s + tag.length; ta.setSelectionRange(pos, pos);
          ctxBumpRecent(name);
        }
        ta.focus();
        ta.dispatchEvent(new Event("input", { bubbles: true })); // autogrow.
        renderContextTags();
      };
      // 타이핑한 태그 학습 — 보낸 메시지에서 `#태그` 를 뽑아 recent 에 기록(다음부터 칩으로 뜸).
      const recordTypedTags = (text) => {
        if (typeof text !== "string" || text.indexOf("#") === -1) return;
        let t = text;
        for (const p of (Array.isArray(projectsCache) ? projectsCache : [])) {
          if (p && p.name && t.includes("#" + p.name)) { ctxBumpRecent(p.name); t = t.split("#" + p.name).join(" "); }
        }
        const m = t.match(/#([^\s#]{1,40})/g) || [];
        for (const tag of m) ctxBumpRecent(tag.slice(1));
        renderContextTags();
      };
      // 입력창의 현재 값 기준으로 각 칩의 활성(걸림) 표시만 갱신(재렌더 없이 저비용).
      const updateActiveChips = () => {
        const ta = document.getElementById("chat-input");
        const val = ta ? ta.value : "";
        document.querySelectorAll("#chat-context .ctx-chip").forEach((chip) => {
          const n = chip.dataset.tag;
          chip.classList.toggle("active", !!n && val.includes("#" + n));
        });
      };
      const CTX_EXPANDED_KEY = "tgctx_expanded";
      const ctxBarExpanded = () => { try { return localStorage.getItem(CTX_EXPANDED_KEY) === "1"; } catch { return false; } };
      const setCtxBarExpanded = (v) => { try { localStorage.setItem(CTX_EXPANDED_KEY, v ? "1" : "0"); } catch {} renderContextTags(); };
      const renderContextTags = () => {
        const bar = document.getElementById("chat-context");
        if (!bar) return;
        bar.innerHTML = "";
        const projs = Array.isArray(projectsCache) ? projectsCache.filter((p) => p && p.name) : [];
        const projByName = new Map(projs.map((p) => [p.name, p]));
        const resolvable = resolvableNames();
        // 후보 = 최근 사용 태그 ∪ 등록 프로젝트(시드). 최근 먼저.
        const names = []; const seen = new Set();
        for (const n of ctxRecent()) { if (n && !seen.has(n)) { seen.add(n); names.push(n); } }
        for (const p of projs) { if (!seen.has(p.name)) { seen.add(p.name); names.push(p.name); } }
        if (names.length === 0) { bar.classList.remove("expanded"); return; } // 없으면 바 숨김(:empty).
        const expanded = ctxBarExpanded();
        bar.classList.toggle("expanded", expanded);
        // 토글 — 접힘 1줄 / 펼침 다줄+스크롤. caret + "컨텍스트" + 개수.
        const toggle = document.createElement("button");
        toggle.type = "button"; toggle.className = "ctx-toggle";
        toggle.title = expanded ? "컨텍스트 태그 접기" : "컨텍스트 태그 펼치기(" + names.length + ")";
        const caret = document.createElement("span");
        caret.className = "ctx-tcaret"; caret.textContent = expanded ? "▾" : "▸";
        toggle.appendChild(caret); toggle.appendChild(document.createTextNode(" 컨텍스트 "));
        const cnt = document.createElement("span");
        cnt.className = "ctx-count"; cnt.textContent = String(names.length);
        toggle.appendChild(cnt);
        toggle.addEventListener("click", () => setCtxBarExpanded(!expanded));
        bar.appendChild(toggle);
        // 칩 컨테이너
        const chipWrap = document.createElement("div");
        chipWrap.className = "ctx-chips";
        for (const name of names.slice(0, 50)) {
          const p = projByName.get(name);
          const status = p && ["active", "paused", "done"].includes(p.status) ? p.status : null;
          const isResolved = p || resolvable.has(name);
          const chip = document.createElement("span");
          chip.className = "ctx-chip" + (p ? " s-" + status : " ctx-generic") + (isResolved ? "" : " ctx-unresolved");
          chip.dataset.tag = name;
          chip.title = (p ? "프로젝트" : isResolved ? "스킬/에이전트" : "태그(미해석)") + " → 클릭: #" + name + " 넣기/빼기";
          const hash = document.createElement("span");
          hash.className = "ctx-hash"; hash.textContent = "#";
          chip.appendChild(hash); chip.appendChild(document.createTextNode(name));
          chip.addEventListener("click", () => insertContextTag(name));
          // 학습 칩(프로젝트 시드 아님)은 × 로 제거 가능. 프로젝트는 registry 관리라 × 없음.
          if (!p) {
            const x = document.createElement("span");
            x.className = "ctx-x"; x.textContent = "×"; x.title = "이 태그 칩 제거";
            x.addEventListener("click", (e) => { e.stopPropagation(); ctxUnlearn(name); });
            chip.appendChild(x);
          }
          chipWrap.appendChild(chip);
        }
        bar.appendChild(chipWrap);
        updateActiveChips();
      };

      const renderProjectsGrid = () => {
        const grid = document.getElementById("projects-grid");
        if (!grid) return;
        grid.innerHTML = "";
        if (projectsCache.length === 0) {
          grid.innerHTML = '<div class="empty">등록된 프로젝트가 없습니다. ' + assistantName + ' 에게 "이거 프로젝트로 만들어줘"라고 말해보세요.</div>';
          return;
        }
        for (const p of projectsCache) {
          const status = ["active", "paused", "done"].includes(p.status) ? p.status : "active";
          const card = document.createElement("button");
          card.type = "button";
          card.className = "project-card s-" + status + (p.path === selectedProjectPath ? " selected" : "");
          const head = document.createElement("div");
          head.className = "project-card-head";
          const name = document.createElement("span");
          name.className = "project-card-name";
          name.textContent = p.name || "(이름 없음)";
          head.appendChild(name);
          // 상태 뱃지 — active(기본)는 모든 카드에 붙어 노이즈라 생략. 보류/완료만 표시(의미 신호).
          if (status !== "active") {
            const st = document.createElement("span");
            st.className = "project-status " + status;
            st.textContent = PROJECT_STATUS_LABEL[status] || status;
            head.appendChild(st);
          }
          // 실행 중 에이전트 배지 — "지금 어디가 바쁜지" 한눈에(브리지 runningAgents).
          if (p.runningAgents > 0) {
            const rb = document.createElement("span");
            rb.className = "project-run-badge";
            rb.textContent = "🤖 " + p.runningAgents + " 실행 중";
            head.appendChild(rb);
          }
          const summary = document.createElement("div");
          summary.className = "project-card-summary";
          summary.textContent = p.description || "설명 없음";
          const pathEl = document.createElement("div");
          pathEl.className = "project-card-path";
          pathEl.textContent = p.path;
          card.appendChild(head); card.appendChild(summary); card.appendChild(pathEl);
          card.addEventListener("click", () => openProjectDetail(p.path));
          grid.appendChild(card);
        }
      };

      const closeProjectDetail = () => {
        selectedProjectPath = null;
        projectAgentsBox = null; // 라이브 재렌더 훅 중단.
        const split = document.getElementById("projects-split");
        if (split) {
          split.classList.add("no-detail");
          const existing = document.getElementById("project-detail");
          if (existing) existing.remove();
        }
        renderProjectsGrid();
      };

      const openProjectDetail = async (projectPath) => {
        selectedProjectPath = projectPath;
        renderProjectsGrid();
        const split = document.getElementById("projects-split");
        if (!split) return;
        split.classList.remove("no-detail");
        let panel = document.getElementById("project-detail");
        if (!panel) {
          panel = document.createElement("aside");
          panel.id = "project-detail";
          panel.className = "project-detail";
          split.appendChild(panel);
        }
        panel.innerHTML = '<div class="empty">불러오는 중…</div>';
        let detail;
        try {
          const r = await fetch("/api/projects/detail?path=" + encodeURIComponent(projectPath));
          if (!r.ok) {
            const err = await r.json().catch(() => ({}));
            panel.innerHTML = '';
            const msg = document.createElement("div");
            msg.className = "empty";
            msg.textContent = r.status === 404
              ? "PROJECT.md 를 찾을 수 없습니다 (폴더/파일 부재)."
              : ("상세를 불러오지 못했습니다: " + (err.error || r.status));
            panel.appendChild(msg);
            return;
          }
          detail = await r.json();
        } catch (e) {
          panel.innerHTML = '';
          const msg = document.createElement("div");
          msg.className = "empty";
          msg.textContent = "상세를 불러오지 못했습니다.";
          panel.appendChild(msg);
          return;
        }
        // 현재 선택이 바뀌었으면(빠른 연속 클릭) 렌더 폐기.
        if (selectedProjectPath !== projectPath) return;
        renderProjectDetail(panel, projectPath, detail);
      };

      // ── 프로젝트 상세: 라이브 에이전트 섹션(에이전트 뷰 카드 재사용) ──────────────
      let projectAgentsBox = null;               // 현재 열린 상세의 에이전트 컨테이너.
      const projectAgentElapsedEls = new Map();  // jobId -> elapsed span (상세 틱용).
      const pathNorm = (s) => String(s || "").replace(/\/+$/, "");
      const renderProjectAgentSections = (box, projectPath) => {
        box.innerHTML = "";
        projectAgentElapsedEls.clear();
        const now = Date.now();
        const target = pathNorm(projectPath);
        const mine = [...jobCards.entries()].filter(([, e]) => e.cwd && pathNorm(e.cwd) === target);
        const running = mine.filter(([, e]) => e.status === "running");
        const rest = mine.filter(([, e]) => e.status !== "running")
          .sort((a, b) => (b[1].startTs || 0) - (a[1].startTs || 0));
        const section = (title, entries, emptyMsg) => {
          if (entries.length === 0 && !emptyMsg) return; // 최근 섹션은 비면 생략.
          const sec = document.createElement("div");
          sec.className = "pd-section";
          const t = document.createElement("div"); t.className = "pd-section-title"; t.textContent = title;
          sec.appendChild(t);
          if (entries.length === 0) {
            const e = document.createElement("div"); e.className = "pd-empty"; e.textContent = emptyMsg;
            sec.appendChild(e);
          } else {
            const grid = document.createElement("div"); grid.className = "pd-agents-grid";
            for (const [jobId, e] of entries) grid.appendChild(buildAgentCard(jobId, e, now, projectAgentElapsedEls));
            sec.appendChild(grid);
          }
          box.appendChild(sec);
        };
        section("진행 중 에이전트 (" + running.length + ")", running, "지금 이 프로젝트에서 작업 중인 에이전트가 없습니다.");
        section("최근 에이전트 (" + rest.length + ")", rest, null);
      };
      let projectAgentsRenderQueued = false;
      const scheduleProjectAgentsRender = () => {
        if (!projectAgentsBox || !selectedProjectPath || projectAgentsRenderQueued) return;
        projectAgentsRenderQueued = true;
        requestAnimationFrame(() => {
          projectAgentsRenderQueued = false;
          if (projectAgentsBox && selectedProjectPath) renderProjectAgentSections(projectAgentsBox, selectedProjectPath);
        });
      };

      const renderProjectDetail = (panel, projectPath, detail) => {
        const meta = detail.meta || {};
        const status = ["active", "paused", "done"].includes(meta.status) ? meta.status : "active";
        panel.innerHTML = "";

        const head = document.createElement("div");
        head.className = "project-detail-head";
        const name = document.createElement("div");
        name.className = "project-detail-name";
        name.textContent = meta.name || "(이름 없음)";
        const st = document.createElement("span");
        st.className = "project-status " + status;
        st.textContent = PROJECT_STATUS_LABEL[status] || status;
        const close = document.createElement("button");
        close.type = "button";
        close.className = "project-detail-close";
        close.setAttribute("aria-label", "닫기");
        close.textContent = "✕";
        close.addEventListener("click", closeProjectDetail);
        head.appendChild(name); head.appendChild(st); head.appendChild(close);
        panel.appendChild(head);

        const pathEl = document.createElement("div");
        pathEl.className = "project-detail-path";
        pathEl.textContent = projectPath;
        panel.appendChild(pathEl);

        // ★라이브 에이전트 — 에이전트 뷰와 *동일한* 라이브 카드(buildAgentCard)를 이 프로젝트
        // (cwd) 로 필터해 재사용(단일 소스·일관). 컨테이너를 보관해 SSE 이벤트마다 이 섹션만
        // 재렌더(경과·현재 스텝 라이브). 진행 중 / 최근 섹션 분리.
        const agentsBox = document.createElement("div");
        agentsBox.id = "project-agents-box";
        panel.appendChild(agentsBox);
        projectAgentsBox = agentsBox;
        renderProjectAgentSections(agentsBox, projectPath);

        // 설명 본문(마크다운 렌더). body 비면 description 폴백.
        const bodySrc = (meta.body && meta.body.trim() !== "") ? meta.body : (meta.description || "");
        const bodySec = document.createElement("div");
        bodySec.className = "pd-section";
        const bodyInner = document.createElement("div");
        bodyInner.className = "pd-body";
        if (bodySrc.trim() === "") {
          bodyInner.classList.add("pd-empty");
          bodyInner.textContent = "설명이 없습니다.";
        } else if (typeof window.marked !== "undefined") {
          try { bodyInner.innerHTML = renderMarkdown(bodySrc); bodyInner.classList.add("md"); }
          catch (e) { bodyInner.textContent = bodySrc; }
        } else {
          bodyInner.textContent = bodySrc;
        }
        bodySec.appendChild(bodyInner);
        panel.appendChild(bodySec);

        const listSection = (title, items) => {
          const sec = document.createElement("div");
          sec.className = "pd-section";
          const t = document.createElement("div");
          t.className = "pd-section-title";
          t.textContent = title;
          sec.appendChild(t);
          if (!Array.isArray(items) || items.length === 0) {
            const e = document.createElement("div");
            e.className = "pd-empty";
            e.textContent = "없음";
            sec.appendChild(e);
          } else {
            const list = document.createElement("div");
            list.className = "pd-list";
            for (const it of items) {
              const row = document.createElement("div");
              row.className = "pd-item";
              const n = document.createElement("div");
              n.className = "pd-item-name";
              n.textContent = it.name || "(이름 없음)";
              // 모델 티어(에이전트 명세) — 있으면 이름 옆 뱃지. 스킬·MCP 는 없어 생략.
              if (it.model) {
                const m = document.createElement("span");
                m.className = "pd-item-model";
                m.textContent = it.model;
                n.appendChild(m);
              }
              row.appendChild(n);
              if (it.description) {
                const d = document.createElement("div");
                d.className = "pd-item-desc";
                d.textContent = it.description;
                row.appendChild(d);
              }
              list.appendChild(row);
            }
            sec.appendChild(list);
          }
          panel.appendChild(sec);
        };

        listSection("전용 스킬", detail.skills);
        listSection("전용 에이전트", detail.agents);
        // 전용 MCP — 이 프로젝트로 위임할 때만 노출되는 프로젝트 스코프 MCP(<project>/.mcp.json).
        listSection(
          "전용 MCP",
          (detail.mcp || []).map((m) => ({ name: m.name, description: m.desc })),
        );

        // 연관 프로젝트 — path 있으면 클릭 이동, 없으면 텍스트 칩.
        const relSec = document.createElement("div");
        relSec.className = "pd-section";
        const relTitle = document.createElement("div");
        relTitle.className = "pd-section-title";
        relTitle.textContent = "연관 프로젝트";
        relSec.appendChild(relTitle);
        const related = Array.isArray(detail.related) ? detail.related : [];
        if (related.length === 0) {
          const e = document.createElement("div");
          e.className = "pd-empty";
          e.textContent = "없음";

      // ── 대화 이력 dedup (기능 B) ─────────────────────────────────────────

      // 겹치지 않게. 키 = ts|threadKey|seq (라이브 activity·영속 activity 동일).
      const renderedActivityKeys = new Set();
      const actKey = (ts, threadKey, seq) => String(ts) + "|" + (threadKey || "") + "|" + (seq == null ? "" : seq);

      const refreshChatEmpty = () => {
        const chatEmpty = document.getElementById("chat-empty");
        if (chatEmpty) chatEmpty.style.display = localChatCount === 0 ? "" : "none";
      };

      filterEl.addEventListener("input", () => {
        filterText = filterEl.value.trim().toLowerCase();
        for (const child of stream.children) {
          const t = child.dataset.type || "";
          child.style.display =
            filterText === "" || t.includes(filterText) ? "" : "none";
        }
      });

      const ADAPTERS = ["claude", "codex", "openai"];
      const cardByThread = new Map();

      // ── P4 축3 — 스텝 클릭 → 상세 사이드바(마스터-디테일) ─────────────────
      // 마스터 데이터: llm.activity 전체 payload 를 "threadKey␟seq" 키로 저장.
      // 스텝 클릭 시 data-threadkey/data-seq 로 이 맵을 조회해 우측 사이드바에 상세 표시.
      const activityByStep = new Map();
      const stepKey = (thread, seq) => (thread ?? "?") + "␟" + (seq == null ? "" : String(seq));
      let selectedStepEl = null;

      const closeStepDetail = () => {
        document.body.classList.remove("step-detail-open");
        if (selectedStepEl) { selectedStepEl.classList.remove("selected"); selectedStepEl = null; }
        const sd = document.getElementById("step-detail");
        if (sd) sd.setAttribute("aria-hidden", "true");
      };

      // 상세 1행 추가(키/값). value 는 항상 textContent → XSS 0(detail 은 비서·도구 유래).
      const sdRow = (body, k, v) => {
        const row = document.createElement("div");
        row.className = "sd-row";
        const ke = document.createElement("span"); ke.className = "sd-k"; ke.textContent = k;
        const ve = document.createElement("span"); ve.className = "sd-v"; ve.textContent = v;
        row.appendChild(ke); row.appendChild(ve);
        body.appendChild(row);
      };

      const openStepDetail = (p, lineEl) => {
        const body = document.getElementById("sd-body");
        if (!body) return;
        body.textContent = "";
        sdRow(body, "label", p.label || p.kind || "activity");
        sdRow(body, "kind", p.kind || "—");
        sdRow(body, "adapter", p.adapter || "—");
        if (p.model) sdRow(body, "model", p.model);
        sdRow(body, "seq", p.seq == null ? "—" : String(p.seq));
        // detail = 중립 상세 요약(file_path=… / command=…). 여러 줄 가능 → pre-wrap.
        const dRow = document.createElement("div");
        dRow.className = "sd-row";
        const dk = document.createElement("span"); dk.className = "sd-k"; dk.textContent = "detail";
        const dv = document.createElement("div");
        if (p.detail != null && String(p.detail).trim() !== "") {
          dv.className = "sd-detail";
          dv.textContent = String(p.detail); // ← textContent: XSS 0(마크다운 렌더 불요).
        } else {
          dv.className = "sd-detail empty";
          dv.textContent = "상세 정보 없음";
        }
        dRow.appendChild(dk); dRow.appendChild(dv);
        body.appendChild(dRow);

        // 선택 하이라이트 전환.
        if (selectedStepEl && selectedStepEl !== lineEl) selectedStepEl.classList.remove("selected");
        selectedStepEl = lineEl;
        lineEl.classList.add("selected");
        document.body.classList.add("step-detail-open");
        const sd = document.getElementById("step-detail");
        if (sd) sd.setAttribute("aria-hidden", "false");
      };

      // 사이드바 닫기(버튼 + Esc). 정의 직후 바인딩 — TDZ 회피.
      const sdCloseBtn = document.getElementById("sd-close");
      if (sdCloseBtn) sdCloseBtn.addEventListener("click", closeStepDetail);
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && document.body.classList.contains("step-detail-open")) closeStepDetail();
      });

      // ── Step2/3 (2026-06-30) — 백그라운드 작업 드로어 + 잡 카드 + 스텝 타임라인 ──
      // worker.* lifecycle(Step1)로 잡 카드 생성·상태(payload.status: running/done/failed/
      // cancelled). 워커 llm.activity(threadKey=worker:<jobId>)는 그 잡 카드 안 접이식
      // 스텝으로(Step3) — 채팅으로 새지 않게 dispatch 에서 가로채 여기로 보낸다.
      // 토글 드로어(PC 우측 고정·모바일 슬라이드인+백드롭). 배지 = 실행 중 잡 수.
      const bgPanel = document.getElementById("bg-panel");
      const bgList = document.getElementById("bg-list");
      const bgEmpty = document.getElementById("bg-empty");
      const bgBadge = document.getElementById("bg-badge");
      const BG_STATUS = {
        running: "🟡 진행 중", done: "✅ 완료", failed: "⚠️ 실패", cancelled: "⏹ 취소",
      };
      const BG_MAX = 50; // 카드 상한(메모리 바운드). 오래된 끝난 잡부터 제거.
      const jobCards = new Map(); // jobId -> { el, labelEl, statusEl, chevEl, stepsEl, errEl, status, stepCount }

      // 도구 실행시간(#3) — phase:"end" 활동이 같은 seq 의 시작 스텝에 durationMs 뱃지를 붙인다.
      // 잡 카드 스텝(.bg-step, worker:/agent: 좌표)과 메인 스트림 라인(.act-line) 양쪽 커버.
      const fmtDur = (ms) => {
        if (ms == null) return "";
        if (ms < 1000) return Math.round(ms) + "ms";
        const s = ms / 1000;
        if (s < 10) return s.toFixed(1) + "s";
        if (s < 60) return Math.round(s) + "s";
        const m = Math.floor(s / 60), rs = Math.round(s % 60);
        return m + "m " + rs + "s";
      };
      const applyDurationBadge = (el, ms) => {
        if (!el) return;
        let b = el.querySelector(":scope > .dur-badge");
        if (!b) { b = document.createElement("span"); b.className = "dur-badge"; el.appendChild(b); }
        b.textContent = fmtDur(ms);
        if (ms >= 90000) b.classList.add("slow"); // tool-slow 임계 이상 = warn 틴트.
        b.title = "도구 실행시간 " + fmtDur(ms);
      };
      const annotateToolDuration = (ap) => {
        if (ap.seq == null) return;
        const tk = ap.threadKey || "";
        // 사이드바 상세도 실행시간·출력 보이게 — 저장된 시작 payload 에 병합(있으면).
        const stored = activityByStep.get(stepKey(tk, ap.seq));
        if (stored) {
          if (ap.durationMs != null) stored.durationMs = ap.durationMs;
          if (ap.output) stored.output = ap.output;
        }
        // 리치 출력(Bash/Read/Grep/Glob, phase:end) — 시작 스텝 라인에 접이식 블록 append.
        // (메인 스트림 스텝만; 잡 카드 스텝은 durationMs 뱃지만 — 아래 (a) 에서 return.)
        if (ap.output && (tk.indexOf("worker:") !== 0 && tk.indexOf("agent:") !== 0)) {
          const oLines = stream.querySelectorAll('.act-line[data-seq="' + ap.seq + '"][data-threadkey="' + tk + '"]');
          for (let i = oLines.length - 1; i >= 0; i--) {
            if (!oLines[i].querySelector(":scope > .act-output")) {
              oLines[i].appendChild(buildOutputBlock(ap.output));
              break;
            }
          }
        }
        if (ap.durationMs == null) return;
        // (a) 잡 카드 스텝 — worker:/agent: 좌표면 그 카드 stepsEl 에서 seq 로 찾아 주석.
        if (tk.indexOf("worker:") === 0 || tk.indexOf("agent:") === 0) {
          const jobId = tk.slice(tk.indexOf(":") + 1);
          const card = jobCards.get(jobId);
          if (card && card.stepsEl) {
            applyDurationBadge(card.stepsEl.querySelector('.bg-step[data-seq="' + ap.seq + '"]'), ap.durationMs);
          }
          return;
        }
        // (b) 메인 스트림 활동 라인 — threadKey+seq 매칭. seq 는 턴마다 리셋(0,1,2…)이라
        // 스트림에 같은 seq 라인이 누적될 수 있으므로, 아직 실행시간이 안 붙은 가장 최근 라인을
        // 고른다(방금 끝난 도구 = 그 스텝). 전부 붙었으면 마지막. threadKey 엔 따옴표 없어 안전.
        const lines = stream.querySelectorAll('.act-line[data-seq="' + ap.seq + '"][data-threadkey="' + tk + '"]');
        if (lines.length) {
          let target = null;
          for (let i = lines.length - 1; i >= 0; i--) {
            if (!lines[i].querySelector(":scope > .dur-badge")) { target = lines[i]; break; }
          }
          applyDurationBadge(target || lines[lines.length - 1], ap.durationMs);
        }
      };

      const openBg = () => { document.body.classList.add("bg-open"); bgPanel.setAttribute("aria-hidden", "false"); };
      const closeBg = () => { document.body.classList.remove("bg-open"); bgPanel.setAttribute("aria-hidden", "true"); };
      const bgToggleBtn = document.getElementById("bg-toggle");
      if (bgToggleBtn) bgToggleBtn.addEventListener("click", () => {
        document.body.classList.contains("bg-open") ? closeBg() : openBg();
      });
      const bgCloseBtn = document.getElementById("bg-close");
      if (bgCloseBtn) bgCloseBtn.addEventListener("click", closeBg);
      const bgBackdrop = document.getElementById("bg-backdrop");
      if (bgBackdrop) bgBackdrop.addEventListener("click", closeBg);

      // 진행 중 필터(기본 "running") — status 클래스 기반 CSS 로 카드 숨김/표시. 라이브 이벤트가
      // status 를 바꾸면 CSS 가 즉시 재평가 → 잡 등장/사라짐이 별도 재렌더 없이 자동 반영.
      const bgFilterEl = document.getElementById("bg-filter");
      const bgCountRunning = document.getElementById("bg-count-running");
      const bgCountAll = document.getElementById("bg-count-all");
      let bgFilter = "running"; // "running" | "all"
      const setBgFilter = (mode) => {
        bgFilter = mode === "all" ? "all" : "running";
        bgList.classList.toggle("filter-running", bgFilter === "running");
        if (bgFilterEl) for (const b of bgFilterEl.querySelectorAll(".bg-fbtn")) {
          const on = b.dataset.filter === bgFilter;
          b.classList.toggle("active", on);
          b.setAttribute("aria-pressed", on ? "true" : "false");
        }
        refreshBgBadge();
      };
      if (bgFilterEl) for (const b of bgFilterEl.querySelectorAll(".bg-fbtn")) {
        b.addEventListener("click", () => setBgFilter(b.dataset.filter));
      }

      const refreshBgBadge = () => {
        let running = 0;
        for (const e of jobCards.values()) if (e.status === "running") running += 1;
        const total = jobCards.size;
        if (bgBadge) {
          bgBadge.textContent = String(running);
          bgBadge.classList.toggle("show", running > 0);
        }
        if (bgCountRunning) bgCountRunning.textContent = String(running);
        if (bgCountAll) bgCountAll.textContent = String(total);
        // 왼쪽 nav "에이전트" 항목 카운트 뱃지 = 진행 중 개수(라이브).
        const navAgentCount = document.getElementById("nav-agent-count");
        if (navAgentCount) navAgentCount.textContent = String(running);
        // 에이전트 메인 뷰 자체 카운트/빈상태도 함께 갱신(열려 있을 때만 렌더).
        if (typeof syncAgentsCounts === "function") syncAgentsCounts(running, total);
        // 빈 메시지 — 활성 필터 기준. running 필터면 "진행 중 없음", 전체면 "작업 없음".
        const visible = bgFilter === "running" ? running : total;
        if (bgEmpty) {
          bgEmpty.style.display = visible === 0 ? "" : "none";
          bgEmpty.textContent = bgFilter === "running"
            ? "진행 중인 작업이 없습니다."
            : "백그라운드 작업이 없습니다.";
        }
      };
      const capBgList = () => {
        while (jobCards.size > BG_MAX) {
          let removed = false;
          for (let node = bgList.lastElementChild; node; node = node.previousElementSibling) {
            const jid = node.dataset ? node.dataset.jobId : null;
            if (!jid) continue;
            const entry = jobCards.get(jid);
            if (entry && entry.status !== "running") { node.remove(); jobCards.delete(jid); removed = true; break; }
          }
          if (!removed) break; // 전부 running 이면 중단.
        }
      };
      // 펼침 어포던스 — 작업(task)/스텝/결과(result) 중 하나라도 있으면 카드를 펼칠 수 있다.
      // (도구 안 쓴 잡은 스텝 0 이어도 task/result 로 내용을 보여줘 "눌러도 빈" 문제 해소.)
      const updateChev = (entry) => {
        const hasDetail = entry.stepCount > 0 || entry.hasTask || entry.hasResult;
        if (!hasDetail) { entry.chevEl.style.display = "none"; entry.el.classList.remove("has-detail"); return; }
        entry.chevEl.style.display = "";
        entry.el.classList.add("has-detail");
        const open = entry.el.classList.contains("open");
        entry.chevEl.textContent = (open ? "▾ " : "▸ ") + (entry.stepCount > 0 ? entry.stepCount + "단계" : "자세히");
      };
      // 잡 카드 확보(없으면 생성). label/task 는 worker.started, result 는 worker.done 이 채운다.
      const ensureJobCard = (jobId, opts) => {
        let entry = jobCards.get(jobId);
        if (!entry) {
          const el = document.createElement("div");
          el.className = "bg-job running";
          el.dataset.jobId = jobId;
          const top = document.createElement("div"); top.className = "bg-job-top";
          const label = document.createElement("span"); label.className = "bg-job-label";
          label.textContent = (opts && opts.label) || "(작업)";
          // 서브에이전트 배지(kind==="agent") — 워커와 시각적 구분. status 뱃지와 별개 축.
          const kindBadge = document.createElement("span"); kindBadge.className = "bg-job-kind";
          kindBadge.textContent = "🤖 서브에이전트"; kindBadge.style.display = "none";
          // 모델 티어 칩 — kind==="agent" 이고 modelTier 있을 때만(default 제외). kindBadge 옆에.
          const tierBadge = document.createElement("span"); tierBadge.className = "bg-job-tier"; tierBadge.style.display = "none";
          const st = document.createElement("span"); st.className = "bg-job-status";
          // 기본 상태 텍스트 — 활동(activity)으로만 생성된 카드(대시보드가 worker.started 를
          // 놓친 경우: 워커 실행 중 새로고침 등)도 상태 뱃지가 비지 않게. 라이프사이클 이벤트
          // 오면 handleWorkerEvent 가 실제 상태로 갱신. entry.status 기본값("running")과 일치.
          st.textContent = BG_STATUS.running;
          const chev = document.createElement("span"); chev.className = "bg-job-chev"; chev.style.display = "none";
          top.appendChild(label); top.appendChild(kindBadge); top.appendChild(tierBadge); top.appendChild(st); top.appendChild(chev);
          const meta = document.createElement("div"); meta.className = "bg-job-meta";
          meta.textContent = ((opts && opts.ts) || "") + (opts && opts.threadKey ? " · " + opts.threadKey : "");
          // 항상 보이는 한 줄 작업 요약(이름 아래·1줄 truncate) — 같은 이름 서브 여러 개도 구분되게.
          // 전문은 펼침 영역(bg-job-task)에. task 없으면 숨김.
          const summary = document.createElement("div"); summary.className = "bg-job-summary"; summary.style.display = "none";
          // 진행 중 라이브 줄 — 경과시간 + 마지막 스텝(현재 작업). 펼치지 않아도 "지금 뭘 하나" 즉시.
          const live = document.createElement("div"); live.className = "bg-job-live";
          const elapsed = document.createElement("span"); elapsed.className = "bg-job-elapsed"; elapsed.textContent = "0s";
          const laststep = document.createElement("span"); laststep.className = "bg-job-laststep";
          live.appendChild(elapsed); live.appendChild(laststep);
          const err = document.createElement("div"); err.className = "bg-job-err"; err.style.display = "none";
          // 펼침 영역(open 시 표시): 작업 + 스텝 + 결과.
          const detail = document.createElement("div"); detail.className = "bg-job-detail";
          const task = document.createElement("div"); task.className = "bg-job-task"; task.style.display = "none";
          const steps = document.createElement("div"); steps.className = "bg-job-steps";
          const result = document.createElement("div"); result.className = "bg-job-result"; result.style.display = "none";
          detail.appendChild(task); detail.appendChild(steps); detail.appendChild(result);
          el.appendChild(top); el.appendChild(meta); el.appendChild(summary); el.appendChild(live); el.appendChild(err); el.appendChild(detail);
          top.addEventListener("click", () => {
            if (entry.el.classList.contains("has-detail")) { el.classList.toggle("open"); updateChev(entry); }
          });
          bgList.insertBefore(el, bgList.firstChild); // 최신=위(bgEmpty 는 size>0 면 숨김).
          entry = {
            el, labelEl: label, statusEl: st, chevEl: chev, taskEl: task, stepsEl: steps,
            resultEl: result, errEl: err, kindBadgeEl: kindBadge,
            liveEl: live, elapsedEl: elapsed, lastStepEl: laststep, tierBadgeEl: tierBadge, summaryEl: summary,
            startTs: Date.now(), // 경과시간 기준(카드 최초 관측 시각 — lifecycle/activity 어느 쪽이 먼저든).
            lastStep: "", // 마지막 활동 라벨(문자열) — DOM 과 별개로 보관, 에이전트 뷰가 DOM 결합 없이 읽음.
            modelTier: "", // 서브에이전트 모델 티어(low/mid/high 등) — lifecycle payload.modelTier. 에이전트 뷰도 읽음.
            cwd: "", // 실행 폴더(cwd) — worker.started payload.cwd. 프로젝트 상세가 이걸로 필터/귀속.
            task: "", result: "", errorText: "", // 작업 지시/결과/에러 원문(문자열) — DOM 과 별개 보관. 에이전트 뷰가 한 줄 요약·펼침 상세에 읽음.
            expanded: false, // 에이전트 뷰 카드 펼침 상태(jobId 별) — 리렌더돼도 유지. 드로어는 .open 클래스로 별도 관리.
            status: "running", kind: "worker", stepCount: 0, hasTask: false, hasResult: false,
            seenSteps: new Set(), // ★스텝 dedup — SSE replay(새로고침 재연결)가 같은 활동을 재전송해도 중복 append 방지.
          };
          jobCards.set(jobId, entry);
          // 활동으로만 생성된 카드도 헤더 '백그라운드 N' 개수 뱃지·bgEmpty 를 즉시 반영
          // (기존엔 handleWorkerEvent 만 refreshBgBadge 호출 → 활동-only 카드는 개수 누락).
          refreshBgBadge();
        }
        // 서브에이전트 마킹(멱등) — lifecycle(kind:"agent")이 활동보다 먼저/나중 어느 쪽으로 와도
        // 카드를 서브로 승격. 배지 표시 + .agent 클래스. 워커(kind 미지정/"worker")는 무영향.
        if (opts && opts.kind === "agent" && entry.kind !== "agent") {
          entry.kind = "agent";
          entry.el.classList.add("agent");
          entry.kindBadgeEl.style.display = "";
        }
        // 에이전트명 채우기 — 활동-선도 카드는 activity 시엔 agentName 이 없어 라벨이 "(작업)".
        // lifecycle 이 agentName 을 실어 오면(먼저든 나중이든) 라벨을 "🤖 <name>" 로. 이미 채웠으면 무영향.
        if (entry.kind === "agent" && opts && opts.agentName) {
          const want = "🤖 " + opts.agentName;
          if (entry.labelEl.textContent !== want) entry.labelEl.textContent = want;
        }
        // 모델 티어(멱등) — kind==="agent" 이고 modelTier 있을 때만. "default"/빈값은 표시 생략.
        // lifecycle 이 실어 오면(먼저/나중 무관) entry.modelTier 저장 + 드로어 칩 갱신. 에이전트 뷰는 renderAgentsView 가 읽음.
        if (entry.kind === "agent" && opts && opts.modelTier != null) {
          const tier = String(opts.modelTier).trim();
          entry.modelTier = tier;
          const show = tier !== "" && tier.toLowerCase() !== "default";
          if (entry.tierBadgeEl) {
            entry.tierBadgeEl.textContent = tier;
            entry.tierBadgeEl.dataset.tier = tier.toLowerCase();
            entry.tierBadgeEl.style.display = show ? "" : "none";
          }
        }
