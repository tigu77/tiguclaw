      const bgCloseBtn = document.getElementById("bg-close");
      if (bgCloseBtn) bgCloseBtn.addEventListener("click", closeBg);
      const bgBackdrop = document.getElementById("bg-backdrop");
      if (bgBackdrop) bgBackdrop.addEventListener("click", closeBg);

      const refreshBgBadge = () => {
        let running = 0;
        for (const e of jobCards.values()) if (e.status === "running") running += 1;
        if (bgBadge) {
          bgBadge.textContent = String(running);
          bgBadge.classList.toggle("show", running > 0);
        }
        if (bgEmpty) bgEmpty.style.display = jobCards.size === 0 ? "" : "none";
      };
      const capBgList = () => {
        while (jobCards.size > BG_MAX) {
          let removed = false;
          for (let node = bgList.lastElementChild; node; node = node.previousElementSibling) {
            const jid = node.dataset ? node.dataset.jobId : null;
            if (!jid) continue;
            const entry = jobCards.get(jid);
            if (entry && entry.status !== "running") { node.remove(); jobCards.delete(jid); removed = true; break; }
          }
          if (!removed) break; // 전부 running 이면 중단.
        }
      };
      // 펼침 어포던스 — 작업(task)/스텝/결과(result) 중 하나라도 있으면 카드를 펼칠 수 있다.
      // (도구 안 쓴 잡은 스텝 0 이어도 task/result 로 내용을 보여줘 "눌러도 빈" 문제 해소.)
      const updateChev = (entry) => {
        const hasDetail = entry.stepCount > 0 || entry.hasTask || entry.hasResult;
        if (!hasDetail) { entry.chevEl.style.display = "none"; entry.el.classList.remove("has-detail"); return; }
        entry.chevEl.style.display = "";
        entry.el.classList.add("has-detail");
        const open = entry.el.classList.contains("open");
        entry.chevEl.textContent = (open ? "▾ " : "▸ ") + (entry.stepCount > 0 ? entry.stepCount + "단계" : "자세히");
      };
      // 잡 카드 확보(없으면 생성). label/task 는 worker.started, result 는 worker.done 이 채운다.
      const ensureJobCard = (jobId, opts) => {
        let entry = jobCards.get(jobId);
        if (!entry) {
          const el = document.createElement("div");
          el.className = "bg-job running";
          el.dataset.jobId = jobId;
          const top = document.createElement("div"); top.className = "bg-job-top";
          const label = document.createElement("span"); label.className = "bg-job-label";
          label.textContent = (opts && opts.label) || "(작업)";
          const st = document.createElement("span"); st.className = "bg-job-status";
          const chev = document.createElement("span"); chev.className = "bg-job-chev"; chev.style.display = "none";
          top.appendChild(label); top.appendChild(st); top.appendChild(chev);
          const meta = document.createElement("div"); meta.className = "bg-job-meta";
          meta.textContent = ((opts && opts.ts) || "") + (opts && opts.threadKey ? " · " + opts.threadKey : "");
          const err = document.createElement("div"); err.className = "bg-job-err"; err.style.display = "none";
          // 펼침 영역(open 시 표시): 작업 + 스텝 + 결과.
          const detail = document.createElement("div"); detail.className = "bg-job-detail";
          const task = document.createElement("div"); task.className = "bg-job-task"; task.style.display = "none";
          const steps = document.createElement("div"); steps.className = "bg-job-steps";
          const result = document.createElement("div"); result.className = "bg-job-result"; result.style.display = "none";
          detail.appendChild(task); detail.appendChild(steps); detail.appendChild(result);
          el.appendChild(top); el.appendChild(meta); el.appendChild(err); el.appendChild(detail);
          top.addEventListener("click", () => {
            if (entry.el.classList.contains("has-detail")) { el.classList.toggle("open"); updateChev(entry); }
          });
          bgList.insertBefore(el, bgList.firstChild); // 최신=위(bgEmpty 는 size>0 면 숨김).
          entry = {
            el, labelEl: label, statusEl: st, chevEl: chev, taskEl: task, stepsEl: steps,
            resultEl: result, errEl: err, status: "running", stepCount: 0, hasTask: false, hasResult: false,
          };
          jobCards.set(jobId, entry);
        }
        if (opts && opts.label && entry.labelEl.textContent === "(작업)") entry.labelEl.textContent = opts.label;
        if (opts && opts.task && !entry.hasTask) {
          entry.taskEl.textContent = "작업 · " + opts.task;
          entry.taskEl.style.display = ""; entry.hasTask = true; updateChev(entry);
        }
        return entry;
      };
      const handleWorkerEvent = (p, ts) => {
        if (!p.jobId) return;
        const status = p.status || "running";
        const entry = ensureJobCard(p.jobId, { label: p.label, task: p.task, ts, threadKey: p.threadKey });
        entry.status = status;
        entry.el.classList.remove("running", "done", "failed", "cancelled");
        entry.el.classList.add(status); // open/has-detail 보존.
        entry.statusEl.textContent = BG_STATUS[status] || status;
        if ((status === "failed" || status === "cancelled") && p.error) {
          entry.errEl.textContent = p.error;
          entry.errEl.style.display = "";
        }
        if (status === "done" && p.result) {
          entry.resultEl.textContent = "결과 · " + p.result;
          entry.resultEl.style.display = ""; entry.hasResult = true; updateChev(entry);
        }
        capBgList();
        refreshBgBadge();
      };
      // Step3 — 워커 활동(threadKey=worker:<jobId>)을 그 잡 카드 안 스텝으로. true=처리됨.
      const handleWorkerActivity = (p, ts) => {
        const tk = typeof p.threadKey === "string" ? p.threadKey : "";
        if (tk.indexOf("worker:") !== 0) return false;
        const jobId = tk.slice("worker:".length);
        const entry = ensureJobCard(jobId, { ts, threadKey: tk });
        const line = document.createElement("div");
        line.className = "bg-step";
        const icon = document.createElement("span"); icon.className = "bg-step-icon";
        icon.textContent = p.kind === "tool" ? "🔧" : "▶";
        const lab = document.createElement("span"); lab.className = "bg-step-label";
        lab.textContent = p.label || p.kind || "활동";
        line.appendChild(icon); line.appendChild(lab);
        if (p.detail) {
          const d = document.createElement("span"); d.className = "bg-step-detail";
          d.textContent = p.detail; line.appendChild(d);
        }
        entry.stepsEl.appendChild(line);
        entry.stepCount += 1;
        updateChev(entry);
        return true;
      };

      const applyFilter = (el) => {
        if (filterText !== "" && !(el.dataset.type || "").includes(filterText)) {
          el.style.display = "none";
        }
      };
      // 사용자가 라이브(최신)를 보고 있는지 판정. column-reverse 라 최신=시각 하단=scrollTop≈0
      // (위로 스크롤하면 음수). |scrollTop| < 80px = near-newest(하단 근처). prune 보류·older
      // 로드 스킵 판정에 쓰인다. (이름 isNearBottom = 최신=하단 이라 문자 그대로.)
      const NEAR_BOTTOM_PX = 80;
      const isNearBottom = () => Math.abs(stream.scrollTop) < NEAR_BOTTOM_PX;

      // 채팅을 최신(맨아래)으로 고정. column-reverse 라 scrollTop=0=시각 하단=최신. 초기 이력
      // 로드/뷰 진입 시 브라우저 앵커 드리프트를 명시 보정(증상: 열면 엉뚱한 위치). rAF 2회 =
      // 레이아웃·마크다운·날짜구분선 반영 후 확정.
      const scrollChatToNewest = () => {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => { stream.scrollTop = 0; });
        });
      };

      // ── 날짜 구분선(date-divider) ────────────────────────────────────────
      // 최신=맨아래(column-reverse)라 시각 위→아래 = 과거→최신. 날짜가 바뀌는 첫(=그 날짜의
      // 가장 오래된) 메시지 위에
      // "YYYY-MM-DD (요일)" 구분선을 둔다(메시지 버블엔 시각만). 증분 유지 대신 매 변경 후
      // 전체 재계산(메시지 ≤ MAX_EVENTS 라 저렴·견고). 모든 삽입 경로(라이브·이력·페이지네이션
      // ·prune)는 MutationObserver 단일 훅이 커버 — 호출처 산재 0.
      const childTsOf = (el) => {
        if (el.classList && el.classList.contains("date-divider")) return null;
        if (el.dataset && el.dataset.ts) return Number(el.dataset.ts);
        const inner = el.querySelector ? el.querySelector("[data-ts]") : null; // 턴 그룹 내부 메시지.
        return inner && inner.dataset.ts ? Number(inner.dataset.ts) : null;
      };
      let refreshingDividers = false;
      const refreshDateDividers = () => {
        refreshingDividers = true;
        try {
          for (const d of stream.querySelectorAll(".date-divider")) d.remove();
          // column-reverse: DOM child[0]=최신=시각 하단. 시각 top→bottom = DOM 역순(오래된→최신).
          // 각 날짜의 시각-첫(=가장 오래된) 메시지 '위'에 구분선 — column-reverse 에선 그 메시지
          // DOM '뒤(nextSibling 앞)' 에 삽입해야 시각적으로 위에 온다.
          const msgs = Array.from(stream.children).filter(
            (c) => c !== historySentinel && childTsOf(c) !== null,
          );
          let prevKey = null;
          for (let i = msgs.length - 1; i >= 0; i--) {
            const child = msgs[i];
            const ts = childTsOf(child);
            const k = dateKey(ts);
            if (k !== prevKey) {
              const div = document.createElement("div");
              div.className = "date-divider";
              const span = document.createElement("span");
              span.textContent = fmtDate(ts);
              div.appendChild(span);
              stream.insertBefore(div, child.nextSibling); // DOM after child = 시각적으로 위.
              prevKey = k;
            }
          }
        } finally {
          refreshingDividers = false;
        }
      };
      let dividerRaf = 0;
      const scheduleDividerRefresh = () => {
        if (dividerRaf) return;
        dividerRaf = requestAnimationFrame(() => { dividerRaf = 0; refreshDateDividers(); });
      };
      // childList 변경 감시 — 실 메시지(비-divider) 추가/제거 시에만 재계산(내 divider 변형은
      // 무시 → 무한루프 0). 단일 훅이라 삽입 경로마다 호출 박을 필요 없음.
      const dividerObserver = new MutationObserver((muts) => {
        if (refreshingDividers) return;
        let relevant = false;
        for (const m of muts) {
          for (const n of m.addedNodes)
            if (n.nodeType === 1 && !(n.classList && n.classList.contains("date-divider"))) relevant = true;
          for (const n of m.removedNodes)
            if (n.nodeType === 1 && !(n.classList && n.classList.contains("date-divider"))) relevant = true;
        }
        if (relevant) scheduleDividerRefresh();
      });
      dividerObserver.observe(stream, { childList: true });

      // 시각 최상단(DOM 끝)부터 가지치기 — MAX_EVENTS 초과분 제거(메모리 바운드).
      // ★페이지네이션 충돌 회피: 사용자가 스크롤업해 과거 이력을 보는 중이면 prune 을 스킵해야
      //   방금 로드한 과거가 잘려나가지 않는다. 따라서 near-bottom(라이브 보는 중)일 때만 prune.
      // 센티넬(DOM 끝 상주)은 절대 제거하지 않는다(observer 누수/단절 방지): 센티넬이
      // lastChild 면 그 바로 앞(실제 최古 메시지)을 제거한다.
      const capStream = () => {
        if (!isNearBottom()) return; // 이력 보는 중 → prune 보류(보던 것 보존).
        stream.scrollTop = 0; // 최신(맨위) 보는 중 → 새 메시지(top prepend) 도착 시 앵커 드리프트 방지.
        let pruned = false;
        while (stream.children.length > MAX_EVENTS) {
          let victim = stream.lastChild;
          if (victim === historySentinel) {
            victim = victim.previousSibling; // 센티넬 앞 = 실제 시각 최古.
          }
          if (victim === null || victim === historySentinel) break; // 안전.
          // dedup Set 정리 — 잘린 메시지의 key 를 제거해, 나중에 다시 스크롤업하면
          // older 재로드 시 dedup 에 막히지 않고 재렌더된다(보던 이력 복원 가능).
          if (victim.dataset && victim.dataset.ts) {
            const t = parseInt(victim.dataset.ts, 10);
            const ty = victim.dataset.type || "";
            if (Number.isFinite(t) && ty.indexOf("channel.message") === 0) {
              const role = ty.endsWith(".out") ? "assistant" : "user";
              renderedMsgKeys.delete(msgKey(t, role));
            }
          }
          stream.removeChild(victim);
          pruned = true;
        }
        // prune 으로 과거(최古)가 잘렸으면 페이지네이션 커서가 stale → 갱신 필수.
        // (a) oldestLoadedTs 를 DOM 에 남은 실제 최古 chat 노드 ts 로 재설정 → 다음 beforeTs 정합.
        // (b) reachedOldest 리셋 + 센티넬 observer 재가동 → 다시 스크롤업하면 그 지점부터 older 재로드.
        if (pruned) refreshOldestCursorAfterPrune();
      };

      // prune 후 호출 — DOM 끝(센티넬 제외)에서 거슬러 올라가 dataset.ts 가 있는 첫 노드
      // (= 남은 시각 최古 메시지)의 ts 로 커서를 갱신한다. 페이지네이션 상태(아래 선언)는
      // 런타임(이벤트 핸들러)에서만 평가되므로 TDZ 무관(forward 참조 안전).
      const refreshOldestCursorAfterPrune = () => {
        let node = historySentinel !== null && stream.lastChild === historySentinel
          ? historySentinel.previousSibling
          : stream.lastChild;
        let foundTs = null;
        while (node !== null) {
          if (node !== historySentinel && node.dataset && node.dataset.ts) {
            const n = parseInt(node.dataset.ts, 10);
            if (Number.isFinite(n)) { foundTs = n; break; }
          }
          node = node.previousSibling;
        }
        if (foundTs === null) return; // ts 가진 chat 노드 0(이론상) → 커서 유지.
        oldestLoadedTs = foundTs;
        // 과거가 잘렸으니 그 앞이 더 있을 수 있음 → 재로드 가능 상태로.
        if (reachedOldest) reachedOldest = false;
        if (olderObserver === null) setupOlderObserver();
      };

      const buildActivityLine = (p) => {
        const line = document.createElement("div");
        // 스텝 = 클릭 가능 요소(P4 사이드바 상세가 여기 붙는다). 지금은 자리 예약만(no-op).
        line.className = "act-line act-step";
        line.dataset.threadkey = p.threadKey || "?";
        if (p.seq != null) line.dataset.seq = String(p.seq);
        const icon = document.createElement("span");
        icon.className = "act-icon";
        icon.textContent = p.kind === "tool" ? "🔧" : "▶";
        const label = document.createElement("span");
        label.className = "act-label";
        label.textContent = p.label || p.kind || "activity";
        // 인라인 상세(중립 detail = path=…, cmd: … 등). 클릭 안 해도 무슨 일인지 보이게.
        // 길면 CSS 가 한 줄로 자르고(…), 전체본은 클릭→사이드바.
        const detail = p.detail
          ? Object.assign(document.createElement("span"), {
              className: "act-detail", textContent: p.detail,
            })
          : null;
        const meta = document.createElement("span");
        meta.className = "act-meta";
        meta.textContent = (p.model ? p.model + " · " : "") + "#" + (p.seq ?? "");
        line.appendChild(icon); line.appendChild(label);
        if (detail) line.appendChild(detail);
        line.appendChild(meta);
        // P4 — 클릭 시 data-threadkey/data-seq 로 마스터 payload 조회 → 우측 사이드바 상세.
        line.addEventListener("click", () => {
          const stored = activityByStep.get(stepKey(line.dataset.threadkey, line.dataset.seq));
          // 저장본 우선(전체 payload). 누락 시 렌더 시점 p 로 폴백.
          openStepDetail(stored || p, line);
        });
        return line;
      };

      // 서브에이전트 threadKey = `${부모}::sub::<name>::<ts>` (agent-registry spawn_agent).
      // → 에이전트명 추출(없으면 null). 멀티에이전트 턴에서 "누가 무엇을" 구분 라벨용.
      const agentOfThread = (thread) => {
        const m = /::sub::(.+?)::/.exec(thread || "");
        return m ? m[1] : null;
      };

      // 턴 그룹 = 스텝 리스트(접이식 turn-card) + 답변 버블을 한 묶음으로 잡는 컨테이너.
      // 그룹 자체가 stream 에 삽입되고, 그 안에 스텝 카드 → (도착 시) 답변 버블 순으로 쌓인다.
      const createTurnCard = (p, ts, adapter, thread) => {
        const group = document.createElement("div");
        group.className = "turn-group";
        group.dataset.threadkey = thread;
        // 로그 패널 필터(stream 직속 자식의 dataset.type 매칭)와 일관되도록 그룹에도 타입 표기.
        group.dataset.type = "llm.activity";

        applyFilter(group);
        const el = document.createElement("div");
        el.className = "ev turn-card in-group";
        el.dataset.type = "llm.activity";
        el.dataset.threadkey = thread;
        const head = document.createElement("div");
        head.className = "turn-head";
        const caret = document.createElement("span");
        caret.className = "turn-caret"; caret.textContent = "▼";
        const badge = document.createElement("span");
        badge.className = "act-badge act-" + adapter;
        badge.textContent = p.adapter || "?";
        const th = document.createElement("span");
        th.className = "turn-thread"; th.textContent = thread;
        const tsEl = document.createElement("span");
        tsEl.className = "ts"; tsEl.textContent = ts;
        const lastEl = document.createElement("span");
        lastEl.className = "turn-last"; lastEl.textContent = "";
        const countEl = document.createElement("span");
        countEl.className = "turn-count"; countEl.textContent = "0단계";
        head.appendChild(caret); head.appendChild(badge);
        // 서브에이전트면 "🤖 <name>" 라벨 — 누가 하는 작업인지 한눈에. raw threadKey 는 숨김.
        const agentName = agentOfThread(thread);
        if (agentName) {
          const ab = document.createElement("span");
          ab.className = "agent-badge";
          ab.textContent = "🤖 " + agentName;
          head.appendChild(ab);
          th.style.display = "none";
        }
        head.appendChild(th);
        head.appendChild(tsEl); head.appendChild(lastEl); head.appendChild(countEl);
        const body = document.createElement("div");
        body.className = "turn-body";
        // 수동 접힘(.collapsed) = 두 패널 공통(헤더 클릭, 기존 로그 토글 보존).
        // 완료 자동접힘(.done-collapsed) = 채팅 패널만(로그 패널 회귀 0). 수동 클릭이 우선.
        const setOpen = (open) => {
          el.classList.toggle("collapsed", !open);
          el.classList.remove("done-collapsed"); // 수동 조작이 자동접힘을 해제.
          caret.textContent = open ? "▼" : "▶";
        };
        head.addEventListener("click", () => setOpen(
          el.classList.contains("collapsed") || el.classList.contains("done-collapsed"),
        ));
        el.appendChild(head); el.appendChild(body);
        group.appendChild(el);
        // replyBubble = 이 턴의 진행(타이핑) 답변 슬롯(P5). 첫 delta 때 생성, out 도착 시 승격.
        return {
          group, el, body, countEl, lastEl, setOpen,
          lastSeq: -1, count: 0, closed: false,
          replyBubble: null, replyMsg: null, replyRaw: "",
        };
      };

      // delta-only 턴(스텝 활동 없이 토큰만 오는 경우)용 경량 그룹 — 진행 버블만 담는다.
      // 이후 activity 가 오면 renderActivity 의 isNewTurn 판정(seq 리셋/closed)으로 자연 정리.
      const createDeltaGroup = (p, ts, adapter, thread) => {
        const group = document.createElement("div");
        group.className = "turn-group";
        group.dataset.threadkey = thread;
        group.dataset.type = "channel.message.out";
        applyFilter(group);
        return {
          group, el: null, body: null, countEl: null, lastEl: null,
          setOpen: () => {}, lastSeq: -1, count: 0, closed: false,
          replyBubble: null, replyMsg: null, replyRaw: "",
        };
      };

      // 진행(타이핑) 버블을 그 턴 그룹 안(스텝 카드 아래)에 생성. 평문 누적용 빈 버블.
      const ensureReplyBubble = (card, ts) => {
        if (card.replyBubble) return card.replyBubble;
        const div = document.createElement("div");
        div.className = "ev local channel-chat";
        div.dataset.type = "channel.message.out";
        const head = document.createElement("div");
        const tsEl = document.createElement("span");
        tsEl.className = "ts"; tsEl.textContent = ts;
        const tyEl = document.createElement("span");
        tyEl.className = "type"; tyEl.textContent = "돌쇠";
        head.appendChild(tsEl); head.appendChild(tyEl);
        div.appendChild(head);
        const msg = document.createElement("div");
        // streaming = 평문 + 깜빡이는 커서. out 도착 시 마크다운 전체본으로 승격(streaming 제거).
        msg.className = "chat-message streaming";
        div.appendChild(msg);
        card.group.appendChild(div); // 스텝 카드(있으면) 다음 = 라이브 답변 슬롯.
        card.replyBubble = div;
        card.replyMsg = msg;
        card.replyRaw = "";
        return div;
      };

      // ── P5 L3 — 토큰 델타 증분 렌더 ───────────────────────────────────────
      // 같은 threadKey 의 진행 버블에 delta 를 순서대로 평문 append(미완성 마크다운 깜빡임 회피).
      // 스텝 그룹(P3)이 진행 중이면 그 그룹의 답변 슬롯으로, 없으면 경량 delta 그룹을 새로 만든다.
      // 최종 권위는 channel.message.out — 도착 시 이 버블을 마크다운 전체본으로 승격(renderChannelMessage).
      const renderDelta = (p, ts) => {
        const delta = String(p.delta || "");
        if (delta === "") return;
        const thread = p.threadKey || THREAD_KEY;
        const adapter = ADAPTERS.includes(p.adapter) ? p.adapter : "other";
        let card = cardByThread.get(thread);
        // 진행 버블을 붙일 그룹이 없거나 이미 닫힌(답변 완료) 턴이면 새 경량 그룹 시작.
        if (!card || !card.group.isConnected || card.closed) {
          card = createDeltaGroup(p, ts, adapter, thread);
          cardByThread.set(thread, card);
          stream.insertBefore(card.group, stream.firstChild);
          capStream();
        }
        ensureReplyBubble(card, ts);
        // 평문 누적(textContent) — 스트리밍 중 부분 마크다운/미완 코드펜스 위험·깜빡임 회피.
        card.replyRaw += delta;
        card.replyMsg.textContent = card.replyRaw;
        // firstEvent/evCount 는 renderEvent 진입부에서 이미 처리됨(델타도 이벤트 1건).
        refreshChatEmpty();
        if (currentView === "overview") setTimeout(showOverview, 0);
      };

      const renderActivity = (p, ts) => {
        const thread = p.threadKey || "?";
        // 마스터 데이터 저장: 전체 payload 를 threadKey+seq 키로(클릭 시 상세 조회).
        activityByStep.set(stepKey(thread, p.seq), p);
        const adapter = ADAPTERS.includes(p.adapter) ? p.adapter : "other";
        let card = cardByThread.get(thread);
        // 새 턴 = 카드 없음 / 제거됨 / seq 리셋 / 이미 답변으로 닫힌 턴 / 스텝카드 없는 delta-only 그룹.
        const isNewTurn =
          !card || !card.group.isConnected || card.closed || !card.el || (p.seq ?? 0) <= card.lastSeq;
        if (isNewTurn) {
          card = createTurnCard(p, ts, adapter, thread);
          cardByThread.set(thread, card);
          stream.insertBefore(card.group, stream.firstChild);
          capStream();
        }
        card.body.appendChild(buildActivityLine(p));
        card.lastSeq = p.seq ?? 0;
        card.count += 1;
        card.countEl.textContent = card.count + "단계";
        // 진행 중/접힘 시 헤더 미리보기 — 도구명 + 상세(무슨 파일/명령인지 한눈에).
        card.lastEl.textContent =
          (p.label || p.kind || "") + (p.detail ? " · " + p.detail : "");
        card.setOpen(true); // 진행 중엔 펼쳐서 라이브로 보이게.
      };

      // 답변(channel.message.out) 도착 시, 같은 threadKey 의 진행 중 턴 그룹을 마무리한다.
      // 답변 버블을 그 그룹 안(스텝 아래)에 배치 + 스텝 카드를 "n단계 완료" 로 접는다.
      // 진행 중 그룹이 없으면 null 반환 → 호출부가 기존 단독 버블로 렌더(회귀 0).
      const completeTurnGroup = (thread) => {
        const card = cardByThread.get(thread);
        if (!card || !card.group.isConnected || card.closed) return null;
        card.closed = true;
        // delta-only 경량 그룹(스텝 카드 없음)은 접을 카드가 없다 — 그룹만 반환.
        if (!card.el) return card.group;
        card.countEl.textContent = card.count + "단계 완료";
        card.el.classList.add("done");
        // 완료 자동접힘(채팅 패널만). caret 도 접힘 표시. 수동 클릭 시 해제됨.
        card.el.classList.add("done-collapsed");
        card.el.querySelector(".turn-caret").textContent = "▶";
        return card.group;
      };

      // ── 마크다운 렌더(봇 답변 전용) ──────────────────────────────────────
      // 봇 출력은 신뢰경계 밖(모델이 <script>·onerror·javascript: 토해낼 수 있음).
      // marked 는 sanitize 안 함 → DOMParser 화이트리스트 재구성으로 안전 태그/속성만 통과.
      // 구멍 우려 시 DOMPurify(min) 1파일 동봉으로 승격: marked.parse→DOMPurify.sanitize 로 교체.
      const MD_ALLOWED_TAGS = new Set([
        "p","br","strong","em","b","i","code","pre","ul","ol","li",
        "blockquote","h1","h2","h3","h4","h5","h6","a","hr","del","s",
        "table","thead","tbody","tr","th","td","span",
      ]);
      const MD_SAFE_HREF = /^(https?:|mailto:)/i;
      // 미닫힌 코드펜스(``` 홀수) 봉합 — 답변에 ``` 하나만 있어도 깨진 HTML 방지(렌더용 복사본만).
      const sealFences = (src) => {
        const fences = (src.match(/^```/gm) || []).length;
        return fences % 2 === 1 ? src + "\n```" : src;
      };
      const sanitizeMarkdownHtml = (html) => {
        const doc = new DOMParser().parseFromString(html, "text/html");
        const walk = (node) => {
          // 자식 스냅샷(순회 중 교체로 인한 라이브 컬렉션 변동 방지).
          for (const child of Array.from(node.childNodes)) {
            if (child.nodeType === 1) {
              const tag = child.tagName.toLowerCase();
              if (!MD_ALLOWED_TAGS.has(tag)) {
                // 미허용 태그 = unwrap(자식 텍스트/노드는 보존, 통째 drop 아님).
                walk(child);
                while (child.firstChild) node.insertBefore(child.firstChild, child);
                node.removeChild(child);
                continue;
              }
              // 모든 속성 제거 후, a.href 만 안전 프로토콜로 복원.
              const href = tag === "a" ? child.getAttribute("href") : null;
              for (const attr of Array.from(child.attributes)) {
                child.removeAttribute(attr.name);
              }
              if (tag === "a") {
                if (href && MD_SAFE_HREF.test(href.trim())) {
                  child.setAttribute("href", href.trim());
                  child.setAttribute("target", "_blank");
                  child.setAttribute("rel", "noopener noreferrer");
                }
              }
              walk(child);
            } else if (child.nodeType !== 3) {
              // 텍스트(3) 외 코멘트/기타 노드 제거.
              node.removeChild(child);
            }
          }
        };
        walk(doc.body);
        return doc.body.innerHTML;
      };
      const renderMarkdown = (src) => {
        // marked·sanitize 실패 시 평문 폴백(happy-path 금지).
        return sanitizeMarkdownHtml(
          window.marked.parse(sealFences(src), { gfm: true, breaks: true }),
        );
      };
      // 봇 답변=마크다운(innerHTML, sanitize 후), 사용자/오류=평문(textContent).
      const setChatBody = (msgEl, text, asMarkdown) => {
        const src = String(text || "");
        if (asMarkdown && typeof window.marked !== "undefined") {
          try {
            msgEl.innerHTML = renderMarkdown(src);
            msgEl.classList.add("md");
            return;
          } catch (e) {
            // 폴백: 평문.
          }
        }
        msgEl.classList.remove("md");
        msgEl.textContent = src;
      };

      const renderChannelMessage = (ev, ts) => {
        const payload = ev.payload || {};
        const isOut = ev.type === "channel.message.out";
        const thread = payload.threadKey || THREAD_KEY;

        // ── P5 진행 버블 승격 ──────────────────────────────────────────────
        // out(봇 답변)이고 같은 threadKey 에 스트리밍 진행 버블이 있으면, 새 버블을 만들지
        // 말고 그 진행 버블을 "최종 권위 전체본 + 마크다운"으로 승격(중복 버블 생성 금지).
        // 누적 평문 델타는 폐기되고 out 전체본으로 치환 = 부분 렌더 오차 자가치유.
        if (isOut) {
          const card = cardByThread.get(thread);
          if (card && card.replyBubble && card.replyBubble.isConnected) {
            setChatBody(card.replyMsg, payload.text, true);     // 평문 델타 → 마크다운 전체본 1회.
            card.replyMsg.classList.remove("streaming");        // 타이핑 커서 off.
            card.replyBubble = null; card.replyMsg = null; card.replyRaw = "";
            completeTurnGroup(thread);                          // 스텝 카드 "n단계 완료"로 접기.
            localChatCount += 1;
            refreshChatEmpty();
            if (currentView === "overview") setTimeout(showOverview, 0);
            capStream();
            return;
          }
        }

        const div = document.createElement("div");
        div.className = "ev local channel-chat";
        div.dataset.type = (ev.type || "").toLowerCase();
        if (ev.ts != null) div.dataset.ts = String(ev.ts); // prune 후 커서 복구용 수치 ts.
        const head = document.createElement("div");
        const tsEl = document.createElement("span");
        tsEl.className = "ts";
        tsEl.textContent = ts;
        const tyEl = document.createElement("span");
        tyEl.className = "type";
        tyEl.textContent = isOut ? "돌쇠" : "나";
        head.appendChild(tsEl); head.appendChild(tyEl);
        div.appendChild(head);
        const msg = document.createElement("div");
        msg.className = "chat-message";
        // 봇 출력(돌쇠)만 마크다운, 사용자 입력(나)은 평문 유지.
        setChatBody(msg, payload.text, isOut);
        div.appendChild(msg);
        // 봇 답변(out)이면 같은 턴의 스텝 그룹을 마무리하고 그 그룹 안(스텝 아래)에 버블 배치.
        // 진행 중 그룹이 없으면(또는 사용자 입력) 기존처럼 stream 최상단에 단독 삽입.
        const group = isOut ? completeTurnGroup(thread) : null;
        if (group) {
          group.appendChild(div); // 그룹 내 스텝 카드 다음 = 답변 말풍선.
        } else {
          stream.insertBefore(div, stream.firstChild);
        }
        localChatCount += 1;
        refreshChatEmpty();
        if (currentView === "overview") setTimeout(showOverview, 0);
        capStream();
      };

      // ── 과거 대화 이력 렌더(기능 B) ──────────────────────────────────────
      // chat_log 에서 온 과거 메시지를 단순 채팅 버블로 렌더한다. 라이브 경로(renderChannelMessage)
      // 와 달리 스텝 카드·도구 활동·턴 그룹화가 없다(이벤트 미영속 = 설계 한계, 메시지 버블만).
      // 사용자=평문·비서=마크다운(setChatBody) 으로 라이브 버블과 동일 모양.
      // 순서: 호출자가 오래된→최신 순으로 넘기고 매번 stream.firstChild 앞에 삽입한다.
      // column-reverse 라 child[0]=시각 최하단(=최신). 오래된 것이 먼저 들어가 깊은 DOM
      // 인덱스(=시각 아래)로 밀리고 최신 과거가 child[0](시각 맨위)에 온다.
      // 버블 div 생성만(삽입은 호출자). 초기 로드는 insertBefore(firstChild)=시각 상단 누적,
      // 페이지네이션(더 로드)은 appendChild=시각 하단(=DOM 끝=최古쪽) 누적으로 재사용한다.
      const buildHistoryDiv = (entry) => {
        const isOut = entry.role === "assistant";
        const div = document.createElement("div");
        div.className = "ev local channel-chat";
        div.dataset.type = isOut ? "channel.message.out" : "channel.message.in";
        div.dataset.ts = String(entry.ts); // prune 후 oldestLoadedTs 복구용 수치 ts.
        const head = document.createElement("div");
        const tsEl = document.createElement("span");
        tsEl.className = "ts";
        tsEl.textContent = fmtTime(entry.ts);
        const tyEl = document.createElement("span");
        tyEl.className = "type";
        tyEl.textContent = isOut ? "돌쇠" : "나";
        head.appendChild(tsEl); head.appendChild(tyEl);
        div.appendChild(head);
        const msg = document.createElement("div");
        msg.className = "chat-message";
        setChatBody(msg, entry.text, isOut); // 비서=마크다운, 사용자=평문.
        div.appendChild(msg);
        return div;
      };

      const renderHistoryMessage = (entry) => {
        const div = buildHistoryDiv(entry);
        stream.insertBefore(div, stream.firstChild);
        localChatCount += 1;
      };

      // ── 페이지네이션 상태(기능 2) ────────────────────────────────────────
      // 초기 최근 100 + 위(시각 최上=최古)로 스크롤 시 더 로드(column-reverse). 수동
      // scrollTop 계산 비일관 회피 → IntersectionObserver 센티넬(DOM 끝=최古쪽) 방식.
      const HISTORY_PAGE = 100; // 페이지당 건수(초기·추가 동일).
      let oldestLoadedTs = null; // 현재 로드된 가장 오래된 메시지 ts(다음 beforeTs).
      let loadingOlder = false; // 동시 로드 가드.
      let reachedOldest = false; // 빈 배치 → 더 없음(센티넬 observe 해제).
      let olderObserver = null; // IntersectionObserver 핸들(누수 0 위해 disconnect 추적).
      let historySentinel = null; // 시각 최下단(=DOM 끝=최古쪽) 센티넬 요소. (이름은 관습 유지.)

      // 센티넬을 항상 DOM 끝(= 시각 최하단 = 최古쪽)에 유지한다. 더 로드로 메시지를
      // appendChild 하면 센티넬보다 앞에 들어가므로, 매 로드 후 다시 끝으로 옮긴다.
      const ensureSentinelAtTop = () => {
        if (historySentinel === null) {
          historySentinel = document.createElement("div");
          historySentinel.id = "history-sentinel";
          historySentinel.setAttribute("aria-hidden", "true");
          // 보이지 않는 0높이 마커 — 레이아웃·스크롤에 영향 0.
          historySentinel.style.cssText = "height:1px;margin:0;padding:0;pointer-events:none;";
        }
        stream.appendChild(historySentinel); // DOM 끝 = 시각 최하단(최古쪽).
      };

      // 과거 배치(ASC: 최古→최新)를 시각 최상단(기존 최古 위)에 쌓는다(column-reverse: DOM 끝=시각 위).
      // DOM 끝=시각 하단 → 배치를 **내림차순(최新→최古)으로 appendChild** 해야 시각
      // top-to-bottom 이 [… 기존最古, 배치最新 … 배치最古] 로 올바르게 쌓인다(위=최신 유지).
      // dedup: 이미 렌더된 key 는 스킵. 반환 = 실제 추가된 가장 오래된 ts.
      const prependOlderBatch = (entries) => {
        // 내림차순 순회(배열은 ASC 라 뒤에서 앞으로) → appendChild(시각 최상단 누적)로
        // 시각 top-to-bottom 이 [배치最古 … 배치最新] 순이 되게.
        for (let i = entries.length - 1; i >= 0; i--) {
          const e = entries[i];
          const role = e.role === "assistant" ? "assistant" : "user";
          const key = msgKey(e.ts, role);
          if (renderedMsgKeys.has(key)) continue; // dedup.
          renderedMsgKeys.add(key);
          const div = buildHistoryDiv({ ts: e.ts, role, text: e.text });
          stream.appendChild(div); // DOM 끝 = 시각 최상단으로 누적.
          localChatCount += 1;
        }
        // 전부 dedup 이어도 배치 最古(entries[0].ts)로 커서를 전진시켜
        // 같은 묶음 무한 재요청을 막는다.
        return entries[0].ts;
      };

      // 더 로드 — 시각 최古까지 스크롤업 트리거(센티넬 가시). try/catch 로 라이브 무손상.
      const loadOlderHistory = async () => {
        if (loadingOlder || reachedOldest || oldestLoadedTs === null) return;
        // ★하단(라이브/최신)에 있을 땐 older 를 로드하지 않는다. 하단에선 capStream 이
        // near-bottom prune 으로 200 상한을 유지하는데, 거기서 older 를 당기면 "로드→prune"
        // 싸움이 나 observer/cursor 상태가 꼬이고 스크롤업 더보기가 죽는다(헤드리스 검증
        // 2026-06-26). older 는 사용자가 실제로 스크롤업해 이력을 볼 때(=not near-bottom)만.
        if (isNearBottom()) return;
        loadingOlder = true;
        try {
          const r = await fetch(
            "/api/chat-history?limit=" + HISTORY_PAGE + "&beforeTs=" + oldestLoadedTs,
          );
          if (!r.ok) return;
          const data = await r.json().catch(() => ({}));
          const entries = Array.isArray(data.entries) ? data.entries : [];
          if (entries.length === 0) {
            reachedOldest = true; // 더 없음 → 센티넬 해제.
            if (olderObserver !== null) { olderObserver.disconnect(); olderObserver = null; }
            return;
          }
          // 스크롤 위치 보존: column-reverse 라 older 는 시각 상단(뷰 위)에 append → 현재 보던
          // 위(최신) 위치는 안 흔들린다. 만일을 대비해 scrollTop 보정 기준만 잡아둔다(보통 0).
          const beforeTop = stream.scrollTop;
          oldestLoadedTs = prependOlderBatch(entries);
          ensureSentinelAtTop(); // 센티넬을 다시 DOM 끝(시각 최하단·최古쪽)으로.
          if (entries.length < HISTORY_PAGE) {
            reachedOldest = true; // 페이지 미만 = 마지막 묶음.
            if (olderObserver !== null) { olderObserver.disconnect(); olderObserver = null; }
          }
          // 점프 보정(브라우저 비일관 대비) — 위치가 변했으면 되돌린다.
          if (stream.scrollTop !== beforeTop) stream.scrollTop = beforeTop;
        } catch (err) {
          console.warn("older history load failed:", err && err.message ? err.message : err);
        } finally {
          loadingOlder = false;
        }
      };

      // 센티넬 IntersectionObserver 설정 — 1회. root = 스크롤 컨테이너(#stream).
      // 센티넬(시각 최상단)이 보이면 = 사용자가 최古까지 스크롤업 → 더 로드.
      const setupOlderObserver = () => {
        if (olderObserver !== null || reachedOldest) return;
        ensureSentinelAtTop();
        olderObserver = new IntersectionObserver(
          (obsEntries) => {
            for (const oe of obsEntries) {
              if (oe.isIntersecting) { void loadOlderHistory(); }
            }
          },
          { root: stream, rootMargin: "120px", threshold: 0 },
        );
        olderObserver.observe(historySentinel);
      };

      // SSE 연결 *전에* 과거 이력을 await 로드해 채팅 흐름을 복원한다. 비어있으면 chat-empty
      // 안내가 그대로 유지된다(첫 사용). 실패는 무해 — 라이브 SSE 경로엔 영향 0(과거 로드는 추가).
      // 초기 limit 100(기능 2). 100 미만이면 더 없음(reachedOldest), 아니면 센티넬 관찰 시작.
      const loadChatHistory = async () => {
        try {
          const r = await fetch("/api/chat-history?limit=" + HISTORY_PAGE);
          if (!r.ok) return;
          const data = await r.json().catch(() => ({}));
          const entries = Array.isArray(data.entries) ? data.entries : [];
          if (entries.length === 0) return; // 빈 이력 → chat-empty 유지.
          for (const e of entries) {
            const role = e.role === "assistant" ? "assistant" : "user";
            // 과거 메시지 ts|role 을 dedup Set 에 등록 → 곧 연결될 SSE 의 history replay
            // (같은 ts) 가 중복 버블을 만들지 않게.
            renderedMsgKeys.add(msgKey(e.ts, role));
            renderHistoryMessage({ ts: e.ts, role, text: e.text });
          }
          // 가장 오래된 ts = ASC 배열의 첫 원소 = 다음 페이지의 beforeTs.
          oldestLoadedTs = entries[0].ts;
          if (entries.length < HISTORY_PAGE) {
            reachedOldest = true; // 첫 로드가 페이지 미만 = 더 없음.
          } else {
            setupOlderObserver(); // 더 있을 수 있음 → 위 스크롤 관찰 시작.
          }
          refreshChatEmpty();
          scrollChatToNewest(); // 초기 로드 후 최신(하단) 고정 — 앵커 드리프트 보정.
          if (currentView === "overview") setTimeout(showOverview, 0);
        } catch (err) {
          // 무해 — 라이브 경로 무손상. 콘솔만.
          console.warn("chat-history load failed:", err && err.message ? err.message : err);
        }
      };

      // ── 축1 선택지(버튼 묶음) — 대시보드 채널 렌더 ─────────────────────────
      // http-bridge 가 publish 한 prompt.options 이벤트를 채팅 흐름에 버튼 묶음으로 렌더.
      // 버튼 클릭 = 사용자가 그 value 를 입력한 것과 동치 → 기존 chat-form 과 동일하게
      // POST /api/messages {text:value, threadKey}. 클릭 후 묶음 비활성(중복 클릭 방지).
      // 비차단: 전송은 백그라운드(에러는 status/로컬 오류 버블로 표면화). route() 단일 인격
      // 재진입이라 새 세션/스레드 0 — threadKey 는 페이로드 우선, 없으면 대시보드 기본.
      const submitOptionValue = async (value) => {
        const statusEl = document.getElementById("chat-status");
        if (statusEl) statusEl.textContent = "전송 중...";
        try {
          const r = await fetch("/api/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: value, threadKey: THREAD_KEY }),
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) {
            if (statusEl) statusEl.textContent = "오류: " + (data.error || ("HTTP " + r.status));
            renderLocalChat("error", data.error || ("HTTP " + r.status));
          } else if (statusEl) {
            statusEl.textContent = "";
          }
        } catch (err) {
          if (statusEl) statusEl.textContent = "전송 실패: " + err.message;
          renderLocalChat("error", err.message);
        }
      };

      const renderPromptOptions = (payload, ts) => {
        const options = Array.isArray(payload.options) ? payload.options : [];
        if (options.length === 0) return;
        const logEmpty = document.getElementById("log-empty");
        if (logEmpty && firstEvent) { logEmpty.remove(); firstEvent = false; }
        localChatCount += 1;
        refreshChatEmpty();
        if (currentView === "overview") setTimeout(showOverview, 0);
        const div = document.createElement("div");
        div.className = "ev local prompt-options";
        div.dataset.type = "prompt.options";
        const head = document.createElement("div");
        const tsEl = document.createElement("span");
        tsEl.className = "ts"; tsEl.textContent = ts;
        const tyEl = document.createElement("span");
        tyEl.className = "type"; tyEl.textContent = "돌쇠 · 선택";
        head.appendChild(tsEl); head.appendChild(tyEl);
        div.appendChild(head);
        if (payload.question) {
          const q = document.createElement("div");
          q.className = "chat-message"; q.textContent = String(payload.question);
          div.appendChild(q);
        }
        if (payload.note) {
          const n = document.createElement("div");
          n.className = "prompt-note"; n.textContent = String(payload.note);
          div.appendChild(n);
        }
        const btnWrap = document.createElement("div");
        btnWrap.className = "prompt-buttons";
        let chosen = false;
        for (const opt of options) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "prompt-option-btn";
          btn.textContent = String(opt.label || opt.value || "");
          btn.addEventListener("click", () => {
            if (chosen) return;
            chosen = true;
            // 묶음 전체 비활성 + 선택 버튼 표시(중복 클릭 방지).
            for (const b of btnWrap.querySelectorAll("button")) b.disabled = true;
            btn.classList.add("picked");
            submitOptionValue(String(opt.value != null ? opt.value : (opt.label || "")));
          });
          btnWrap.appendChild(btn);
        }
        div.appendChild(btnWrap);
        stream.insertBefore(div, stream.firstChild);
        capStream();
      };

      const renderEvent = (ev) => {
        if (firstEvent) {
          const logEmpty = document.getElementById("log-empty");
          if (logEmpty) logEmpty.remove();
          firstEvent = false;
        }
        evCount += 1;
        evCountEl.textContent = evCount + "개 이벤트";
        const navEventCount = document.getElementById("nav-event-count");
        if (navEventCount) navEventCount.textContent = String(evCount);
        if (currentView === "overview") setTimeout(showOverview, 0);
        const ts = fmtTime(ev.ts);
        if (ev.type === "channel.message.in" || ev.type === "channel.message.out") {
          // dedup — chat-history 로 이미 그린 과거 메시지면(ts|role 일치) 스킵.
          const role = ev.type === "channel.message.out" ? "assistant" : "user";
          const key = msgKey(ev.ts, role);
          if (renderedMsgKeys.has(key)) return;
          renderedMsgKeys.add(key);
          renderChannelMessage(ev, ts);
          return;
        }
        if (ev.type === "llm.activity") {
          const ap = ev.payload || {};
          // 워커 활동(threadKey=worker:<jobId>)은 백그라운드 잡 카드 스텝으로(채팅 누수 차단).
          if (handleWorkerActivity(ap, ts)) return;
          renderActivity(ap, ts);
          return;
        }
        if (ev.type === "llm.delta") {
          renderDelta(ev.payload || {}, ts);
          return;
        }
        if (ev.type === "prompt.options") {
          renderPromptOptions(ev.payload || {}, ts);
          return;
        }
        if (typeof ev.type === "string" && ev.type.indexOf("worker.") === 0) {
          handleWorkerEvent(ev.payload || {}, ts);
          return;
        }
        const div = document.createElement("div");
        div.className = "ev " + typeClass(ev.type);
        div.dataset.type = (ev.type || "").toLowerCase();
        applyFilter(div);
        const head = document.createElement("div");
        const tsEl = document.createElement("span");
        tsEl.className = "ts"; tsEl.textContent = ts;
        const tyEl = document.createElement("span");
        tyEl.className = "type"; tyEl.textContent = ev.type;
        head.appendChild(tsEl); head.appendChild(tyEl);
        div.appendChild(head);
        const pre = document.createElement("pre");
        pre.textContent = JSON.stringify(ev.payload, null, 2);
        div.appendChild(pre);
        stream.insertBefore(div, stream.firstChild);
        capStream();
      };

      const renderLocalChat = (kind, text) => {
        const logEmpty = document.getElementById("log-empty");
        if (logEmpty && firstEvent) {
          // 대화 탭의 빈 상태는 유지하고, 로그 placeholder만 정리합니다.
          logEmpty.remove();
          firstEvent = false;
        }
        localChatCount += 1;
        refreshChatEmpty();
        if (currentView === "overview") setTimeout(showOverview, 0);
        const now = Date.now();
        const div = document.createElement("div");
        div.className = "ev local";
        div.dataset.ts = String(now); // 날짜 구분선 경계 판정용.
        const head = document.createElement("div");
        const tsEl = document.createElement("span");
        tsEl.className = "ts";
        tsEl.textContent = fmtTime(now);
        const tyEl = document.createElement("span");
        tyEl.className = "type";
        const chatLabel = { user: "나", reply: "돌쇠", error: "오류" };
        tyEl.textContent = chatLabel[kind] || kind;
        head.appendChild(tsEl); head.appendChild(tyEl);
        div.appendChild(head);
        const msg = document.createElement("div");
        msg.className = "chat-message";
        // 봇 답변(reply)만 마크다운, 사용자/오류는 평문(SSE 권위본과 일관).
        setChatBody(msg, text, kind === "reply");
        div.appendChild(msg);
        stream.insertBefore(div, stream.firstChild);
        capStream(); // 센티넬 보존 가지치기(위 helper 재사용).
      };

      for (const btn of document.querySelectorAll(".nav-button")) {
        btn.addEventListener("click", () => {
          const view = btn.dataset.view;
          if (view === "overview") showOverview();
          else if (view === "providers") showProviders();
          else if (view === "inventory") showInventory();
          else if (view === "chat") { setActiveNav("chat"); setChatPanel("chat"); setActiveTab("chat"); scrollChatToNewest(); document.getElementById("chat-input").focus(); }
          else if (view === "settings") showSettings();
          if (window.matchMedia("(max-width: 900px)").matches && ["overview","providers","inventory","settings"].includes(view)) setActiveTab("main");
        });
      }

      refreshChatEmpty();
      showOverview();
      fetchProviders();
      setInterval(fetchProviders, 30000);
      fetchInventory();
      setInterval(fetchInventory, 30000);

      const connDot = document.getElementById("conn-dot");
      const connText = document.getElementById("conn-text");
      const setConn = (up) => {
        connDot.className = "dot " + (up ? "up" : "down");
        connText.textContent = up ? "실시간" : "재연결 중…";
      };

      // SSE 연결 — 재연결 가능 클로저. EventSource 는 보통 끊기면 자동 재연결하지만,
      // 비-200 등 치명 에러면 CLOSED 로 영구 종료(자동 재연결 X) → 탭 stale. 그 경우만
      // 수동 재연결한다(데몬 재시작·블립 내성). 서버측 하트비트(: ping)와 함께 동작.
      let es = null;
      const connectStream = () => {
        es = new EventSource("/api/events");
        es.onopen = () => setConn(true);
        es.onmessage = (m) => {
          setConn(true);
          try { renderEvent(JSON.parse(m.data)); } catch (e) { /* skip malformed */ }
        };
        es.onerror = () => {
          setConn(false);
          // CONNECTING(=자동 재연결 중)이면 브라우저에 맡기고, CLOSED(치명)면 수동 재연결.
          if (es.readyState === EventSource.CLOSED) {
            setTimeout(connectStream, 3000);
          }
        };
      };
      // 과거 대화 이력을 먼저 복원한 뒤 SSE 연결(기능 B). dedup Set 이 채워진 상태로
      // 라이브 스트림이 붙어 history replay 중복을 막는다. 이력 로드 실패/지연이 SSE 를
      // 막지 않도록 then 으로 잇되, 실패해도 반드시 connectStream 으로 진행(라이브 무손상).
      loadChatHistory().finally(connectStream);

      const form = document.getElementById("chat-form");
      const input = document.getElementById("chat-input");
      const sendBtn = document.getElementById("chat-send");
      const statusEl = document.getElementById("chat-status");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (text.length === 0) return;
        sendBtn.disabled = true;
        statusEl.textContent = "전송 중...";
        input.value = "";
        try {
          const r = await fetch("/api/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text, threadKey: THREAD_KEY }),
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) {
            statusEl.textContent = "오류: " + (data.error || ("HTTP " + r.status));
            renderLocalChat("error", data.error || ("HTTP " + r.status));
          } else {
            statusEl.textContent = "";
          }
        } catch (err) {
          statusEl.textContent = "전송 실패: " + err.message;
          renderLocalChat("error", err.message);
        } finally {
          sendBtn.disabled = false;
          input.focus();
        }
      });
    </script>
  </body>
</html>
